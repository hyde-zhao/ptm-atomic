[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ptm-atomic"
version = "0.1.0"
description = "PTM Atomic — CLI for syncing and executing atomic operation specifications against network devices."
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "jsonschema",
    "requests",
    "cryptography",
    "paramiko",
]

[project.scripts]
ptm-atomic = "atomic_ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
