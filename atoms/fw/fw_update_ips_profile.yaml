schema_version: "1.1"
op_id: fw_update_ips_profile
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_update_ips_profile
description: Update an IPS protection profile by id through /api/v1/appsec/ips/profiles.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be ips_profile for this operation.
  params:
    type: json
    required: true
    description: >-
      IPS protection-profile update object with a top-level id and a full val
      body. The val body replaces name, actionWrapper, filters, whiteList,
      customAddRuleList and desc wholesale; fields omitted from val are
      cleared. actionWrapper entries use priority 1..5 and action 0/1/2.
      filters supports prioritys, Directs, OsTypes, classtype, protocols and
      builtintype (including [{}] for all rules), with optional action and
      capture_pkt. customAddRuleList entries carry a rule id, action 0/1/2
      and optional capture_pkt (true captures packets for that rule, false
      does not). whiteList is the IPS exception-rule list (entries carry
      ruleId), so an update that must keep exceptions has to resend them.
      Per-rule and per-filter actions override the actionWrapper level action
      for matched rules as captured from the Web UI. The id is the numeric
      profile id returned on create or listed by fw_verify_ips_profile.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: ips_profile
  params:
    id: "1001"
    name: test2
    actionWrapper:
      - priority: 1
        action: 1
      - priority: 2
        action: 1
      - priority: 3
        action: 1
      - priority: 4
        action: 1
      - priority: 5
        action: 1
    filters:
      - prioritys: []
        Directs: []
        OsTypes: []
        classtype:
          - 2
        action: 0
        capture_pkt: false
    whiteList: []
    customAddRuleList:
      - id: 3783
        action: 1
        capture_pkt: true
    desc: "123123"
  idempotency_key: "<idempotency-key>"
side_effect: state_mutation
returns:
  status: success
  data:
    ips_profile_id: "<ips-profile-id>"
    requested_action_wrapper: "<requested-action-wrapper>"
    requested_filter_count: 0
    capture_pkt_enabled_rule_ids: "<capture-pkt-enabled-rule-id-list>"
    capture_pkt_disabled_rule_ids: "<capture-pkt-disabled-rule-id-list>"
    pre_snapshot_ref: "<ips-profile-pre-snapshot-ref>"
    config_result:
      status: succeeded
      config_domain: ips_profile
      applied_ref: "<ips-profile-update-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - ips_profile_id
    - full_config
  notes: Restore the complete pre-change profile object, including actionWrapper, filters, whiteList and customAddRuleList.
pre_snapshot:
  op_id: fw_verify_ips_profile
  capture_fields:
    - profile_ids
    - full_config
  notes: Query the profile by key/id before update and keep the full list entry for restore.
rollback_apply:
  op_id: fw_update_ips_profile
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_ips_profile
  expected_state: equals_pre_snapshot
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - security_domain
gate:
  required: true
  reason: IPS protection-profile updates change rule actions and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk configuration contract is used.
  - The profile id must be resolved by fw_verify_ips_profile before update.
postconditions:
  - IPS profile update result and diagnostic references are available to the caller.
  - A follow-up fw_verify_ips_profile query can confirm the updated profile.
tags:
  - firewall
  - ips
  - profile
  - configuration
aliases:
  - ips-profile
  - ips-protection-profile
  - intrusion-prevention-profile
  - ips-template
  - ips-exception
since_version: "1.16.0"
