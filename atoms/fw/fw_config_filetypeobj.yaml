schema_version: "1.1"
op_id: fw_config_filetypeobj
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_config_filetypeobj
description: Define a file type group configuration contract for NGFW capacity.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be appsec_filetypeobj for this operation.
  params:
    type: json
    required: true
    description: File type group configuration with name, des and filetype members.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: appsec_filetypeobj
  params:
    id: 0
    val:
      name: atomicFileTypeGroup
      des: atomic file type group
      filetype:
        - name: PGD
          type: false
  idempotency_key: "<idempotency-key>"
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: appsec_filetypeobj
      applied_ref: "<filetypeobj-config-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
side_effect: state_mutation
rollback_strategy:
  type: inverse_op
  op_id: fw_delete_batch_filetypeobj
  snapshot_required: false
  required_inputs:
    - name
  id_source: args
  id_field: name
  notes: The file type group is matched by its name; rollback batch-deletes via /api/v1/batch.
pre_snapshot:
  op_id: fw_verify_filetypeobj
  capture_fields:
    - name
    - existence
post_verify:
  op_id: fw_verify_filetypeobj
  expected_state: present
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: File type group changes can affect application identification and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk configuration contract is used.
postconditions:
  - Configuration result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - filetypeobj
  - configuration
aliases:
  - file-type-group
  - appsec-filetype-group
  - filetype-obj
since_version: "1.11.0"
