schema_version: "1.1"
op_id: fw_config_batch_policy_route
device_type: fw
description: Loop-create multiple NGFW policy routes on one device by repeated POST /api/v1/policyroute.
parameters:
  device_inventory_ref:
    type: string
    required: false
    description: Reserved for multi-device orchestration; not consumed by the current CLI, which batch-creates on a single device.
  device_selector:
    type: json
    required: false
    description: Reserved for multi-device orchestration; not consumed by the current CLI.
  batch_ref:
    type: string
    required: false
    description: Non-sensitive external batch reference supplied by an external orchestrator.
  batch:
    type: json
    required: false
    description: Reserved for multi-device orchestration (max_concurrency default 1, maximum 5); not consumed by the current CLI.
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be policy_route for this batch operation.
  params:
    type: json
    required: true
    description: >-
      Policy route configuration object (source_network, dst_network, next_hop_ip or
      outgoing_interface, in_interface, service, weight, time_obj, ...) plus count and the
      increment flag consumed by the CLI config-batch loop.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive batch idempotency key for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: policy_route
  params:
    source_network: any
    dst_network: "1.1.1.0/24"
    next_hop_ip: "10.0.0.1"
    in_interface: GE0_3
    outgoing_interface: ""
    service: any
    weight: 100
    time_obj: ""
    count: 3
    increment: true
  idempotency_key: "<batch-policy-route-idempotency-key>"
returns:
  status: success
  data:
    mode: config_batch
    count: 3
    created_count: 2
    failed_count: 1
    created:
      - index: 1
        status: success
        policy_route_id: 101
        status_code: 200
      - index: 2
        status: success
        policy_route_id: 102
        status_code: 200
    failed:
      - index: 3
        status: failed
        error_code: RUNNER_CONFIG_REJECTED
        message: "<device-rejection-message>"
  error_type: NONE
  diag_snapshot_ref: "<batch-policy-route-diag-snapshot-ref>"
idempotent: true
timeout_ms: 60000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - BATCH_PARTIAL_FAILED
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
    - batch_configuration
gate:
  required: true
  reason: Policy route batch changes can alter forwarding across multiple firewalls.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - device_inventory_reference
    - parameter_digest
    - concurrency_review
batch:
  max_concurrency: 1
  device_inventory_ref: "<device-inventory-ref>"
  idempotency_key: "<batch-policy-route-idempotency-key>"
  failure_policy: isolate_failed_device
verification:
  kind: batch_summary
  rules:
    - name: policy_route_batch_result_counts_match
      input_ref: "<batch-policy-route-verification-summary-ref>"
      expected_result: total, succeeded, failed, and skipped device counts reconcile
  summary_ref: "<batch-policy-route-verification-summary-ref>"
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk batch configuration contract is used.
  - device_inventory_ref and device_selector contain only non-sensitive references.
postconditions:
  - >-
    Implementation-aligned returns (P2-48): the runner loops over count payloads and reports
    mode=config_batch with count, created_count, failed_count, created[] and failed[].
    Each created policy-route id is at created[].policy_route_id (per-entry index / status /
    status_code alongside); failed entries carry index / status / error_code / message.
    The earlier design-draft keys batch_policy_route_id, per_device_results, failed_devices and
    verification_summary_ref were never produced by the implementation and are removed.
  - A single failed entry does not abort the loop; only when every entry fails does the
    overall status become failed.
tags:
  - firewall
  - capacity
  - policy_route
  - batch_configuration
aliases:
  - bulk
since_version: "1.1.0"
