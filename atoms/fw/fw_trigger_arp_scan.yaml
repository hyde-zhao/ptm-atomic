schema_version: "1.1"
op_id: fw_trigger_arp_scan
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_trigger_arp_scan
description: Trigger an ARP scan immediately or schedule a periodic scan through /api/v1/neighbor/scan/trigger.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be arp_scan for this operation.
  params:
    type: json
    required: true
    description: Trigger options with is_periodic, period_in_seconds, and start_at_once.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: arp_scan
  params:
    val:
      is_periodic: false
      period_in_seconds: 300
      start_at_once: true
  idempotency_key: "<idempotency-key>"
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: arp_scan
      applied_ref: "<arp-scan-trigger-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: medium
  categories:
    - configuration
    - network
gate:
  required: false
  reason: ARP scan triggering probes the network on configured interfaces and is reversible by stopping the scan.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - ARP scan interfaces/nets are configured before triggering.
postconditions:
  - The ARP scan is triggered or scheduled and the result reference is available to the caller.
tags:
  - firewall
  - network
  - arp
  - scan
  - trigger
aliases:
  - arp-scan-trigger
  - arp-scan-periodic
  - neighbor-scan-trigger
  - arp-scan-now
since_version: "1.9.0"
