schema_version: "1.1"
op_id: fw_delete_static_route
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_static_route
description: Delete an NGFW static route by id.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be static_route for this operation.
  params:
    type: json
    required: true
    description: Static route delete selector with id.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: static_route
  params:
    id: "<route-id>"
  idempotency_key: "<idempotency-key>"
side_effect: destructive
returns:
  status: success
  data:
    static_route_id: "<route-id>"
    pre_snapshot_ref: "<static-route-pre-delete-snapshot-ref>"
    config_result:
      status: succeeded
      config_domain: static_route
      applied_ref: "<static-route-delete-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: false
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - id
    - full_config
  notes: Recreate the static route from the full pre-delete snapshot via POST /api/v1/route.
pre_snapshot:
  op_id: fw_verify_static_route
  capture_fields:
    - id
    - full_config
rollback_apply:
  op_id: fw_config_static_route
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_static_route
  expected_state: absent
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Static route deletion can alter traffic forwarding and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk configuration contract is used.
  - DELETE must use id as a query parameter and must not send a JSON body.
postconditions:
  - Static route deletion result and diagnostic references are available to the caller.
  - A follow-up fw_verify_static_route query can confirm the deleted route is absent.
tags:
  - firewall
  - capacity
  - static_route
  - configuration
aliases:
  - static-routing
since_version: "1.1.0"
