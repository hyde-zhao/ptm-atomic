schema_version: "1.1"
op_id: fw_config_pppoe
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_config_pppoe
description: Configure a PPPoE dial interface through PUT /api/v1/intf with an RSA-encrypted password.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be intf-pppoe for this operation.
  params:
    type: json
    required: true
    description: PPPoE interface object with id (interface id) and username; the password is supplied through the runner credential env var at execute time.
inputs:
  session_ref: "<session-ref>"
  config_domain: intf-pppoe
  params:
    id: TE0_21
    username: user01
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: intf-pppoe
      applied_ref: "<pppoe-config-result-ref>"
    password_encrypted: true
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
side_effect: state_mutation
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - interface
gate:
  required: true
  reason: PPPoE dial credentials and interface mode changes affect WAN connectivity and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
  - The PPPoE password environment variable is set for --execute; the runner encrypts it with the login RSA public key (PKCS1v15) and never writes plaintext.
postconditions:
  - The PPPoE interface is configured with the dial username and an encrypted password on the device.
  - A follow-up fw_verify_interface can confirm the interface state.
tags:
  - firewall
  - interface
  - pppoe
  - configuration
aliases:
  - pppoe-config
  - pppoe-interface
  - dial-interface-config
since_version: "1.9.0"
