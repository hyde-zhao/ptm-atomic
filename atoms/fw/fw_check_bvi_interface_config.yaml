schema_version: "1.1"
op_id: fw_check_bvi_interface_config
device_type: fw
transport: ssh
description: Query the BVI interface configuration from etcd over SSH or Telnet.
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_check_bvi_interface_config
parameters:
  transport:
    type: string
    required: false
    description: Network transport used by the runner. ssh uses paramiko; telnet uses telnetlib. Defaults to ssh.
  host:
    type: string
    required: false
    description: Optional target host; defaults to the host parsed from the runner base_url. Useful when telnet target differs from the management host.
  port:
    type: int
    required: false
    description: Optional TCP port; defaults to 22 for ssh and 23 for telnet.
  bvi_id:
    type: string
    required: true
    description: BVI interface identifier substituted into the etcd key path /vnf-agent/vpp1/config/vpp/v2/interfaces/bvi<id>.
inputs:
  transport: ssh
  host: ""
  port: 22
  bvi_id: ""
side_effect: observation
returns:
  status: success
  data:
    config_raw: "<config-raw-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
dry_run_supported: true
risk_level: low
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - RUNNER_SHELL_CONNECT_FAILED
  - RUNNER_SHELL_COMMAND_TIMEOUT
  - STATE_MISMATCH
verification:
  kind: capacity_domain
  rules:
    - name: config_returned
      input_ref: "<config-raw-ref>"
      expected_result: The device returns the etcd value for the BVI interface key as session output.
  summary_ref: "<bvi-config-summary-ref>"
preconditions:
  - Device management SSH or Telnet service is reachable.
  - A valid admin credential is available via the runner credential env var.
  - The etcdctl binary is available on the device PATH.
postconditions:
  - Query output is captured in diag_snapshot_ref; nothing is written to the repo.
tags:
  - firewall
  - bvi
  - interface
  - etcd
  - query
  - cli
aliases:
  - bvi-config
since_version: "1.1.0"
