schema_version: "1.1"
op_id: fw_verify_black_white_list
device_type: fw
description: Verify list entry configuration contract result for NGFW capacity.
parameters:
  config_result_ref:
    type: string
    required: false
    description: Non-sensitive reference to the related configuration result.
  config_result:
    type: json
    required: false
    description: Inline non-sensitive configuration result envelope.
  verification_rules:
    type: list
    required: true
    description: Rules used to check list entry configuration state.
  expected_entry_ref:
    type: string
    required: true
    description: Expected list entry reference.
inputs:
  state_ref: "<state-ref>"
  config_result_ref: "<list-config-result-ref>"
  config_domain: black_white_list
returns:
  status: success
  data:
    verification_summary_ref: "<list-verification-summary-ref>"
    verification_status: passed
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_RESULT_MISSING
  - STATE_MISMATCH
  - MANUAL_HANDLING_REQUIRED
verification:
  kind: capacity_domain
  rules:
    - name: list_state_matches
      input_ref: "<list-config-result-ref>"
      expected_result: list type, entry, action, and scope references match
  summary_ref: "<list-verification-summary-ref>"
preconditions:
  - A related list configuration result reference is available.
postconditions:
  - Verification summary and diagnostic references are available to the caller.
  - Any failed check is reported for manual handling.
tags:
  - firewall
  - capacity
  - black_white_list
  - verification
since_version: "1.1.0"
