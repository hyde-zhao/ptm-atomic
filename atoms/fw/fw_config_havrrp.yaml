schema_version: "1.1"
op_id: fw_config_havrrp
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_config_havrrp
description: Add an NGFW HA VRRP entry through POST /api/v1/havrrp.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be havrrp for this operation.
  params:
    type: json
    required: true
    description: Complete /api/v1/havrrp payload with val.enable, val.interface, val.vrId, val.vrRole, and val.vips.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: havrrp
  params:
    val:
      enable: true
      interface: GE0_9
      ipAddr: 0.0.0.0
      vrId: 1
      vrRole: MASTER
      vips:
        - 3.3.3.3/24
      useVirtualMac: false
  idempotency_key: "<idempotency-key>"
side_effect: state_mutation
returns:
  status: success
  data:
    havrrp_interface: GE0_9
    havrrp_vr_id: 1
    config_result:
      status: succeeded
      config_domain: havrrp
      applied_ref: "<havrrp-create-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: HA VRRP changes can affect virtual IP ownership and failover and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk HA VRRP configuration is used.
postconditions:
  - HA VRRP creation result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - ha
  - configuration
aliases:
  - ha-vrrp
  - vrrp
since_version: "1.6.0"
