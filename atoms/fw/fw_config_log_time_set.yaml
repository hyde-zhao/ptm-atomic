schema_version: "1.1"
op_id: fw_config_log_time_set
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_config_log_time_set
description: Configure log backup/retention time through PUT /api/v1/logsetting/logtimesetting.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be log_time_setting for this operation.
  params:
    type: json
    required: true
    description: >-
      Log time-setting body with id and val.timeSet. The captured body uses
      id "0" and timeSet 180. timeSet is the backup/retention interval modelled
      as an integer; its unit is device-defined and is not asserted as
      seconds or minutes.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: log_time_setting
  params:
    id: "0"
    timeSet: 180
  idempotency_key: "<idempotency-key>"
side_effect: state_mutation
returns:
  status: success
  data:
    requested_time_set: 180
    config_result:
      status: succeeded
      config_domain: log_time_setting
      applied_ref: "<log-time-setting-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - time_set
    - full_config
  notes: Restore the previous timeSet read through fw_verify_log_time_set.
pre_snapshot:
  op_id: fw_verify_log_time_set
  capture_fields:
    - time_set
    - full_config
rollback_apply:
  op_id: fw_config_log_time_set
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_log_time_set
  expected_state: equals_pre_snapshot
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - logging
    - global_setting
gate:
  required: true
  reason: Log backup/retention settings affect stored security evidence and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk global log setting is used.
postconditions:
  - The device accepts the PUT; a follow-up fw_verify_log_time_set query confirms the stored timeSet.
  - timeSet is an integer whose unit is device-defined and is not asserted as seconds or minutes.
tags:
  - firewall
  - log
  - setting
  - configuration
  - global
aliases:
  - log-time-setting
  - logtimesetting
  - log-retention
  - log-backup-time
since_version: "1.18.0"
