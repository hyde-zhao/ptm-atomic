schema_version: "1.1"
op_id: fw_delete_batch_keyword
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_batch_keyword
description: Batch-delete keyword objects by name through /api/v1/batch.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be keyword for this operation.
  ids:
    type: list
    required: true
    description: Non-empty list of keyword object names to delete in one batch request.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  session_ref: "<session-ref>"
  config_domain: keyword
  ids:
    - test_123
  idempotency_key: "<idempotency-key>"
side_effect: destructive
returns:
  status: success
  data:
    batch_result:
      status: succeeded
      count: 1
      success_count: 1
      failed_count: 0
      failed: []
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - name
    - full_config
  notes: Recreate the keyword object from the full pre-delete snapshot; the content list is not recoverable from the device.
pre_snapshot:
  op_id: fw_verify_keyword
  capture_fields:
    - name
    - full_config
  notes: Capture the full entry (desc and content) before the batch delete; it is the only record of the removed values.
rollback_apply:
  op_id: fw_config_keyword
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_keyword
  expected_state: absent
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - BATCH_PARTIAL_FAILED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
    - batch_configuration
    - destructive
gate:
  required: true
  reason: Removing keyword objects in bulk deletes content that policies may still match on and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - The named keyword objects exist and are not referenced by an object that forbids removal.
  - Gate evidence exists before this high-risk configuration contract is used.
postconditions:
  - Every requested name is gone from the device keyword object list.
  - Any failed check is reported for manual handling.
tags:
  - firewall
  - capacity
  - keyword
  - batch
  - delete
aliases:
  - keyword
  - keyword-object
  - kw-obj
since_version: "1.13.0"
