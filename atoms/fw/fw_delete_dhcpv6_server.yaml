schema_version: "1.1"
op_id: fw_delete_dhcpv6_server
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_dhcpv6_server
description: Delete a DHCPv6 server by bound interface name through /api/v1/dhcpv6?id=<ifname>.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be dhcpv6 for this operation.
  params:
    type: json
    required: true
    description: DHCPv6 server delete selector with the bound interface name as the id query value; DELETE sends no JSON body. The id must be non-empty, see preconditions.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: dhcpv6
  params:
    id: GE0_13
  idempotency_key: "<idempotency-key>"
side_effect: destructive
returns:
  status: success
  data:
    object_name: GE0_13
    pre_snapshot_ref: "<dhcpv6-pre-delete-snapshot-ref>"
    config_result:
      status: succeeded
      config_domain: dhcpv6
      applied_ref: "<dhcpv6-delete-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
# ── 幂等删除契约（CT-REM-ATOM-DELETE）──
# `idempotent: true` + `error_types` 含 RESOURCE_NOT_FOUND 二者**同时成立**时，
# 表达「目标对象不存在 = 目标状态已达成」：创建步回滚与用例清理步会重复删除同一
# 对象，第二次必然报「不存在」，不构成残留。
# 本族的「不存在」判据是 400 eRequestParam「http请求参数错误」，一个**通用**码 ——
# 它不能进 errors.py 的 RESOURCE_NOT_FOUND_ERR_CODES（会波及全部已登记 op），也不
# 能进全局 marker 列表（真·畸形请求会被误判成「已达成」）。故登记进
# RESOURCE_NOT_FOUND_OP_CODE_MARKERS，作用域限定到本 op。该判据成立的前提是
# 「请求里的 id 非空」，由 runner 在拼 URL 时本地强制（见 preconditions）。
idempotent: true
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - full_config
  notes: Recreate the DHCPv6 server configuration from the full pre-delete snapshot via fw_config_dhcpv6_server.
pre_snapshot:
  op_id: fw_verify_dhcpv6_server
  capture_fields:
    - full_config
rollback_apply:
  op_id: fw_config_dhcpv6_server
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_dhcpv6_server
  expected_state: absent
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - RESOURCE_NOT_FOUND
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Deleting a DHCPv6 server stops address assignment on the bound interface segment and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk DHCPv6 server deletion is used.
  - The id must be non-empty. A DELETE carrying no id at all answers 200 with a success body while leaving the configuration untouched - a false success. The runner refuses an empty id before the request leaves, so that path is unreachable from the command layer.
  - DELETE must use the interface name as a query value and must not send a JSON body.
postconditions:
  - DHCPv6 server deletion result and diagnostic references are available to the caller.
  - A follow-up fw_verify_dhcpv6_server query can confirm the configuration is absent.
  - Static host bindings of the deleted server are removed with it, because they have no separate storage and are only a projection of server.hosts.
  - A repeat delete, a never-existing interface name and an empty id all answer 400 eRequestParam with the message http request parameter error, which this operation alone reads as resource-not-found. A wrong HTTP method answers 405 instead and is not treated that way.
tags:
  - firewall
  - capacity
  - dhcpv6
  - configuration
aliases:
  - dhcpv6-server
  - dhcpv6-service
  - dhcpv6-scope
since_version: "1.15.0"
