schema_version: "1.1"
op_id: fw_config_nat_snat
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_config_nat_snat
description: Create a source NAT (SNAT) rule through /api/v1/natsnat.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be nat for this operation.
  params:
    type: json
    required: true
    description: >-
      Source NAT rule payload with val.natType, val.srcName, val.dstName,
      val.serviceName, and val.transType. val.natType carries the address
      family and protocol translation variant; nat44 is the only value the
      device exposes today, with nat66, nat46, and nat64 reserved for later
      interfaces.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: nat
  params:
    val:
      timeObj: ""
      noTransPort: false
      enabled: true
      outInterfaceName: TE0_7
      zoneName: any
      srcName: any
      srcName_is_group: false
      dstName: any
      dstName_is_group: false
      natType: nat44
      serviceName: any
      serviceName_is_group: false
      useInterface: true
      transType: 0
      transParm: ""
      relate:
        isIpv6: false
        VRRPId: 0
        VRRPIntf: ""
        enabled: false
  idempotency_key: "<idempotency-key>"
side_effect: state_mutation
returns:
  status: success
  data:
    nat_rule_id: "1"
    config_result:
      status: succeeded
      config_domain: nat
      applied_ref: "<nat-snat-create-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: false
rollback_strategy:
  type: inverse_op
  op_id: fw_delete_nat_snat
  snapshot_required: false
  required_inputs:
    - nat_rule_id
  id_source: response
  id_field: nat_rule_id
  notes: >-
    Delete only when the create result reports created=true; pre-existing
    idempotent rules must not be deleted by default. The nat_rule_id is the
    device-assigned id from the POST endpoint response.
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Source NAT rule creation changes address translation behavior and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk source NAT configuration is used.
  - The referenced outInterfaceName, zoneName, srcName, dstName, and serviceName objects exist on the device.
postconditions:
  - Source NAT rule creation result and diagnostic references are available to the caller.
  - A follow-up fw_verify_nat_snat query returns the created rule with a device-assigned integer id.
tags:
  - firewall
  - capacity
  - nat
  - snat
  - configuration
aliases:
  - nat
  - snat
  - source-nat
  - nat-snat
since_version: "1.6.0"
