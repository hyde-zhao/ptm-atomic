schema_version: "1.1"
op_id: fw_config_security_zone
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_config_security_zone
description: Create an NGFW security zone with optional interface bindings.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be security_zone for this operation.
  params:
    type: json
    required: true
    description: Security zone create object. name is 1-31 chars, supports letters/digits/Chinese/hyphen/dot, cannot be "." or ".." alone, and cannot start with "IDMC-".
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: security_zone
  params:
    name: "trust-zone"
    desc: "Trusted network zone"
    interfaces:
      - "GE0_1"
      - "GE0_2"
  idempotency_key: "<idempotency-key>"
side_effect: state_mutation
returns:
  status: success
  data:
    security_zone_name: "<security-zone-name>"
    created: true
    config_result:
      status: succeeded
      config_domain: security_zone
      applied_ref: "<security-zone-config-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
rollback_strategy:
  type: inverse_op
  op_id: fw_delete_security_zone
  snapshot_required: false
  required_inputs:
    - name
  id_source: args
  id_field: name
  notes: Delete only when the create result reports created=true; pre-existing idempotent objects must not be deleted by default. The security zone name is used as the DELETE query parameter.
pre_snapshot:
  op_id: fw_verify_security_zone
  capture_fields:
    - name
    - existence
post_verify:
  op_id: fw_verify_security_zone
  expected_state: exists
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Security zone changes can alter interface-to-zone mappings and affect policy enforcement.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk configuration contract is used.
  - Zone name must pass validation (1-31 chars, letters/digits/Chinese/hyphen/dot, not "." or "..", not start with "IDMC-").
postconditions:
  - Configuration result and diagnostic references are available to the caller.
  - A follow-up fw_verify_security_zone query can confirm the zone exists on the device.
tags:
  - firewall
  - capacity
  - security_zone
  - configuration
aliases:
  - zone
  - sfarea
since_version: "1.4.0"
