schema_version: "1.1"
op_id: fw_config_localcert
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_config_localcert
description: Define a local certificate creation contract for NGFW capacity.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be cert_localcert for this operation.
  params:
    type: json
    required: true
    description: Local certificate configuration with name, subject and option key algorithm.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: cert_localcert
  params:
    val:
      name: atomicLocalCert
      subject:
        country: CN
        state: Sichuan
        location: Chengdu
        organization: Atomic
        organUnit: QA
      option:
        type: RSA
        keyLenth: 2048
  idempotency_key: "<idempotency-key>"
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: cert_localcert
      applied_ref: "<localcert-config-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
side_effect: state_mutation
rollback_strategy:
  type: inverse_op
  op_id: fw_delete_localcert
  snapshot_required: false
  required_inputs:
    - name
  id_source: query
  query_op: fw_verify_localcert
  query_match: name
  id_field: id
  notes: The local certificate is created unsigned; rollback resolves the numeric id via fw_verify_localcert and deletes it.
pre_snapshot:
  op_id: fw_verify_localcert
  capture_fields:
    - name
    - existence
post_verify:
  op_id: fw_verify_localcert
  expected_state: present
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Local certificate creation changes the device trust material and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk configuration contract is used.
postconditions:
  - Configuration result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - cert
  - configuration
aliases:
  - local-certificate
  - cert-create
  - rsa-certificate
since_version: "1.11.0"
