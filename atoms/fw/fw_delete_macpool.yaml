schema_version: "1.1"
op_id: fw_delete_macpool
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_macpool
description: Delete an NGFW MAC address object by name through /api/v1/macpool.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be macpool for this operation.
  params:
    type: json
    required: true
    description: MAC address-object delete selector with id query value; DELETE sends no JSON body.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: macpool
  params:
    id: atomicMacPool
  idempotency_key: "<idempotency-key>"
side_effect: destructive
returns:
  status: success
  data:
    object_name: atomicMacPool
    pre_snapshot_ref: "<macpool-pre-delete-snapshot-ref>"
    config_result:
      status: succeeded
      config_domain: macpool
      applied_ref: "<macpool-delete-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
# ── 幂等删除契约（CT-REM-ATOM-DELETE，2026-09-24 补登记；只收敛口径，不新增字段）──
# `idempotent: true` + `error_types` 含 RESOURCE_NOT_FOUND 二者**同时成立**时，
# 表达「目标对象不存在 = 目标状态已达成」：创建步回滚与用例清理步会重复删除同一
# 对象，第二次必然报「不存在」，不构成残留。触发由设备回答决定（结构化 errCode
# 明确集，或通用码 + 文案特征），未在本表登记 / 设备未答「不存在」者一律维持
# 原失败语义（真残留保真）。消费方读统一键 details.error_type==RESOURCE_NOT_FOUND
# 且 details.idempotent is True；一致性由 validate_idempotent_registry() 守卫。
idempotent: true
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - name
    - full_config
  notes: Recreate the MAC address object from the full pre-delete snapshot.
pre_snapshot:
  op_id: fw_verify_macpool
  capture_fields:
    - name
    - full_config
rollback_apply:
  op_id: fw_config_macpool
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_macpool
  expected_state: exists
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - RESOURCE_NOT_FOUND
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: MAC address-object deletion removes a referenced capacity object and may affect policy matching; requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk MAC address-object deletion is used.
  - DELETE must use id as a query value and must not send a JSON body.
postconditions:
  - MAC address-object deletion result and diagnostic references are available to the caller.
  - A follow-up fw_verify_macpool query can confirm the deleted object is absent.
tags:
  - firewall
  - capacity
  - macpool
  - configuration
aliases:
  - mac-pool
  - mac-address-object
  - macaddr
since_version: "1.11.0"
