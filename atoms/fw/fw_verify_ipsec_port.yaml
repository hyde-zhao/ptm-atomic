schema_version: '1.1'
op_id: fw_verify_ipsec_port
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_verify_ipsec_port
description: Query NGFW IPsec port and NAT-T settings through GET /api/v1/ipsec/port.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be ipsec for this operation.
inputs:
  session_ref: <session-ref>
  config_domain: ipsec
side_effect: observation
returns:
  status: success
  data:
    observed_state_ref: <ipsec-port-state-ref>
    full_config_ref: <ipsec-port-full-config-ref>
    vals_ref: <ipsec-port-vals-ref>
    count: 0
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: <diag-snapshot-ref>
idempotent: true
dry_run_supported: true
risk_level: low
timeout_ms: 30000
error_types:
- NONE
- VALIDATION_FAILED
- CONFIG_RESULT_MISSING
- STATE_MISMATCH
- MANUAL_HANDLING_REQUIRED
verification:
  kind: capacity_domain
  rules:
  - name: ipsec_port_query_returns_settings
    input_ref: <ipsec-port-query-result-ref>
    expected_result: the device returns a vals list with one record per ip_protocol carrying local_port, remote_port, and nat_t.
  summary_ref: <ipsec-port-verification-summary-ref>
preconditions:
- External orchestration holds a valid session_ref.
postconditions:
- IPsec port query result and diagnostic references are available to the caller.
- Records are identified by ip_protocol, because the device echoes no id field in this list.
tags:
- firewall
- capacity
- ipsec
- verification
aliases:
- ipsec
- ipsec-port
- nat-t
since_version: 1.6.0
