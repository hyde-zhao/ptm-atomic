schema_version: "1.1"
op_id: fw_config_haconfig
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_config_haconfig
description: Configure NGFW HA settings through PUT /api/v1/haconfig.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be haconfig for this operation.
  params:
    type: json
    required: true
    description: Complete /api/v1/haconfig payload with HA enable, mode, role, heartbeat, and sync options.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: haconfig
  params:
    id: haconfig
    val:
      enable: true
      noSyncConfig: false
      noSyncState: false
      baseSync: true
      forcePermitEnable: false
      permitTcpSyn: 0
      permitTime: 500
      mode: MB
      role: BACKUP
      preempt: true
      shockTimeUnit: 120
      advertisePeriod: 1000
      hb:
        interface: HA
        localAddr: 1.1.1.2
        remoteAddr: 1.1.1.1
  idempotency_key: "<idempotency-key>"
side_effect: state_mutation
returns:
  status: success
  data:
    haconfig_id: haconfig
    pre_snapshot_ref: "<haconfig-pre-snapshot-ref>"
    config_result:
      status: succeeded
      config_domain: haconfig
      applied_ref: "<haconfig-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - haconfig_id
    - full_config
  notes: Restore the original HA configuration from the pre-update snapshot.
pre_snapshot:
  op_id: fw_verify_hasynclist
  capture_fields:
    - haconfig_id
    - full_config
rollback_apply:
  op_id: fw_config_haconfig
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_hasynclist
  expected_state: equals_pre_snapshot
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: HA configuration changes can affect both HA nodes and failover behavior and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk HA configuration is used.
postconditions:
  - HA configuration result and diagnostic references are available to the caller.
  - A follow-up fw_verify_hasynclist can confirm the HA state after configuration.
tags:
  - firewall
  - capacity
  - ha
  - configuration
aliases:
  - ha-config
  - ha-configuration
since_version: "1.6.0"
