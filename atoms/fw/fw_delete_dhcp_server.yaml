schema_version: "1.1"
op_id: fw_delete_dhcp_server
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_dhcp_server
description: Delete an IPv4 DHCP server by bound interface name through /api/v1/dhcp?id=<ifname>.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be dhcp for this operation.
  params:
    type: json
    required: true
    description: IPv4 DHCP server delete selector with the bound interface name as the id query value; DELETE sends no JSON body.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: dhcp
  params:
    id: GE0_13
  idempotency_key: "<idempotency-key>"
side_effect: destructive
returns:
  status: success
  data:
    object_name: GE0_13
    pre_snapshot_ref: "<dhcp-pre-delete-snapshot-ref>"
    config_result:
      status: succeeded
      config_domain: dhcp
      applied_ref: "<dhcp-delete-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
# ── 幂等删除契约（CT-REM-ATOM-DELETE）──
# `idempotent: true` + `error_types` 含 RESOURCE_NOT_FOUND 二者**同时成立**时，
# 表达「目标对象不存在 = 目标状态已达成」：创建步回滚与用例清理步会重复删除同一
# 对象，第二次必然报「不存在」，不构成残留。触发由设备回答决定（结构化 errCode
# 明确集，或通用码 + 文案特征）。本族的「不存在」判据是 400 eDhcpdConfigGetFail
# 「从数据库中获取数据失败」，已登记进 errors.py 的 RESOURCE_NOT_FOUND_ERR_CODES
# （2026-10-13 三例对照实测，见该处注释）。
idempotent: true
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - full_config
  notes: Recreate the DHCP server configuration from the full pre-delete snapshot via fw_config_dhcp_server.
pre_snapshot:
  op_id: fw_verify_dhcp_server
  capture_fields:
    - full_config
rollback_apply:
  op_id: fw_config_dhcp_server
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_dhcp_server
  expected_state: absent
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - RESOURCE_NOT_FOUND
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Deleting an IPv4 DHCP server stops address assignment on the bound interface segment and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk DHCP server deletion is used.
  - DELETE must use the interface name as a query value and must not send a JSON body.
postconditions:
  - DHCP server deletion result and diagnostic references are available to the caller.
  - A follow-up fw_verify_dhcp_server query can confirm the configuration is absent.
  - Static host bindings of the deleted server are removed with it, because they have no separate storage and are only a projection of server.hosts.
tags:
  - firewall
  - capacity
  - dhcp
  - configuration
aliases:
  - dhcp-server
  - dhcp-service
  - dhcp-scope
since_version: "1.14.0"
