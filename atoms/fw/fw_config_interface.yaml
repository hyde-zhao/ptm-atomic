schema_version: "1.1"
op_id: fw_config_interface
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_config_interface
description: Create an NGFW interface entry through /api/v1/intf.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be interface for this operation.
  params:
    type: json
    required: true
    description: Complete /api/v1/intf interface payload for bvi, subinterface, or bond creation.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: interface
  params:
    id: bvi109
    val:
      name: bvi109
      type: 14
      mode: Route
      ip_addresses:
        - 191.109.0.31/24
  idempotency_key: "<idempotency-key>"
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: interface
      applied_ref: "<interface-create-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Interface creation can change traffic reachability and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk interface configuration is used.
  - BVI bridge member ports (val.bvi.bridge.interfaces) are optional; when specified, they must already be Switch mode with pvid equal to the BVI instance and linkType 1 (access), prepared with fw_update_interface first.
postconditions:
  - Interface creation result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - interface
  - configuration
aliases:
  - subinterface
  - trunk
  - lag
  - bond
  - bvi
  - vlan-interface
  - pppoe
  - pppoe-client
  - dhcp
  - dhcp-client
  - southbound-interface
  - sub-interface
  - routed-interface
since_version: "1.3.0"
