schema_version: "1.1"
op_id: fw_update_interface_pair
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_update_interface_pair
description: Update an NGFW interface pair through PUT /api/v1/intf/pair.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be interface_pair for this operation.
  params:
    type: json
    required: true
    description: >-
      Complete interface-pair update envelope {id: <pair-name>, val: {...}}.
      The top-level id is the pair name and must equal val.name. val carries
      name, receive_interface, transmit_interface, status_sync, allowed_vlan
      and remark. val.name must match ^[一-龥a-zA-Z0-9.-]{1,31}$ (Chinese
      characters, letters, digits, '-' and '.'; 1-31 characters; underscores
      are not allowed) and is validated locally before the request is sent.
      Updating a pair that does not exist keeps the device error (errCode/errMsg)
      in the failure details; it is never treated as success. A duplicate name
      answered with HTTP 400 eObjCreateExist is mapped to CONFIG_REJECTED with
      the original errCode/errMsg preserved.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: interface_pair
  params:
    id: pair1
    val:
      name: pair1
      remark: "updated"
      receive_interface: GE0_1
      transmit_interface: GE0_2
      status_sync: true
      allowed_vlan: "1-4094"
  idempotency_key: "<idempotency-key>"
side_effect: state_mutation
returns:
  status: success
  data:
    pair_name: pair1
    pre_snapshot_ref: "<interface-pair-pre-snapshot-ref>"
    config_result:
      status: succeeded
      config_domain: interface_pair
      applied_ref: "<interface-pair-update-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - name
    - full_config
  notes: Restore the original interface-pair definition from the pre-update snapshot.
pre_snapshot:
  op_id: fw_verify_interface_pair
  capture_fields:
    - name
    - full_config
rollback_apply:
  op_id: fw_update_interface_pair
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_interface_pair
  expected_state: equals_pre_snapshot
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Interface-pair updates change L2 forwarding and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk interface-pair configuration is used.
  - The referenced physical interfaces are already in mode="Pair" through fw_update_interface.
  - The top-level id is the existing pair name and must match val.name.
postconditions:
  - Interface-pair update result and diagnostic references are available to the caller.
  - A follow-up fw_verify_interface_pair query can confirm the updated pair.
tags:
  - firewall
  - capacity
  - interface
  - pair
  - configuration
aliases:
  - interface-pair
  - port-pair
  - pair-interface
  - l2-pair
since_version: "1.20.0"
