schema_version: "1.1"
op_id: fw_delete_batch_neighbor
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_batch_neighbor
description: Batch-delete multiple NGFW neighbor (ARP) entries through /api/v1/batch.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be neighbor for this operation.
  params:
    type: json
    required: true
    description: Batch payload with DELETE /api/v1/neighbor items containing physAddress, interface, and ipAddress arrays.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: neighbor
  params:
    batch:
      - method: DELETE
        resource: /api/v1/neighbor
        body:
          physAddress:
            - "00:11:32:a7:7f:43"
          interface:
            - GE0_1
          ipAddress:
            - 100.1.1.6
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: neighbor
      applied_ref: "<neighbor-batch-delete-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - network
gate:
  required: true
  reason: Batch deletion of ARP entries can affect reachability for multiple hosts simultaneously.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk batch operation is used.
postconditions:
  - Multiple ARP entries are deleted and the result references are available to the caller.
tags:
  - firewall
  - network
  - arp
  - neighbor
  - configuration
  - batch
aliases:
  - arp
  - batch-delete-arp
  - neighbor-table
  - bulk-remove-arp
since_version: "1.6.0"
