schema_version: "1.1"
op_id: fw_delete_batch_dhcp_static_ip
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_batch_dhcp_static_ip
description: Delete multiple static address bindings by IP address through POST /api/v1/batchv2.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be dhcp for this operation.
  params:
    type: json
    required: true
    description: Batch delete request with DELETE /api/v1/dhcpstaticip items carrying the host addresses to remove.
inputs:
  session_ref: "<session-ref>"
  config_domain: dhcp
  params:
    batch:
      - method: DELETE
        resource: /api/v1/dhcpstaticip
        body:
          id:
            - "8.1.1.2"
      - method: DELETE
        resource: /api/v1/dhcpstaticip
        body:
          id:
            - "8.1.1.3"
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: dhcp
      applied_ref: "<dhcp-static-ip-batch-delete-result-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
# 本族与 geoip 等批量删族一致：不设 pre_snapshot/rollback_apply/restore，批量删除
# 是一次性动作；且此处删除的静态绑定没有独立存储，删完即随 server.hosts 消失。
idempotent: false
timeout_ms: 60000
error_types:
  - NONE
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - BATCH_PARTIAL_FAILED
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
    - batch_configuration
gate:
  required: true
  reason: Batch static address binding deletion removes address reservations that clients rely on and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
    - concurrency_review
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
  - Batch body carries one DELETE /api/v1/dhcpstaticip item per address, each with a single-element id list. The device honours only the first element of a multi-element id list and reports only that one in BatchResult, silently dropping the rest, so ids must not be packed into one item.
  - Each id is a host address from a server's hosts[].addr, not a binding name.
postconditions:
  - Batch static address binding deletion result and diagnostic references are available to the caller.
  - The response carries BatchResult with one entry per deleted address; the device answers data "success" rather than a status key, so the caller must not expect the standard batch summary counters.
tags:
  - firewall
  - capacity
  - dhcp
  - batch_configuration
aliases:
  - dhcp-static-ip
  - dhcp-binding
  - static-binding
  - bulk
since_version: "1.14.0"
