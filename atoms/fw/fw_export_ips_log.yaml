schema_version: "1.1"
op_id: fw_export_ips_log
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_export_ips_log
description: Export IPS logs as CSV through GET /api/v1/export with a time window.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  logtype:
    type: string
    required: false
    description: Log type to export; the user-confirmed scope implements ipslog only.
  export_type:
    type: string
    required: false
    description: Export format; the documented value is csv.
  timetype:
    type: string
    required: false
    description: >-
      Time window preset; one of 24h, all, 1h, 7d, 1m, or custom. Defaults to
      24h. Custom requires starttime and endtime.
  starttime:
    type: int
    required: false
    description: Unix-second start timestamp; required when timetype is custom.
  endtime:
    type: int
    required: false
    description: Unix-second end timestamp; required when timetype is custom.
  output_path:
    type: string
    required: true
    description: Local path where the exported response bytes are written.
inputs:
  session_ref: "<session-ref>"
  logtype: ipslog
  export_type: csv
  timetype: 24h
  output_path: /tmp/ipslog_export.csv
side_effect: observation
returns:
  status: success
  data:
    export_file_ref: /tmp/ipslog_export.csv
    file_size: 1024
    sha256: "<sha256-of-export>"
    raw_response_ref: "<ips-log-export-raw-ref>"
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
dry_run_supported: true
risk_level: medium
timeout_ms: 120000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - RESPONSE_INVALID
  - UNKNOWN_ERROR
risk:
  level: medium
  categories:
    - logging
    - data_management
gate:
  required: true
  reason: Exported IPS logs may contain sensitive traffic data and require review before leaving the device.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
  - The endpoint returns the export payload directly; the runner writes the response bytes to output_path without parsing them.
postconditions:
  - The export bytes are written to output_path and file_size/sha256 are reported.
  - If the device returns JSON instead of CSV, the same JSON is written to output_path and also exposed in the raw response.
  - logtype is currently limited to ipslog.
tags:
  - firewall
  - ips
  - log
  - export
  - data_management
aliases:
  - ips-log-export
  - log-export
  - export-ips-log
  - seclog-export
since_version: "1.18.0"
