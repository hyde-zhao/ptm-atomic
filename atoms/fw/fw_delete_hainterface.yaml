schema_version: "1.1"
op_id: fw_delete_hainterface
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_hainterface
description: Delete an NGFW HA monitored interface entry by id through DELETE /api/v1/hainterface.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be hainterface for this operation.
  params:
    type: json
    required: true
    description: HA monitored interface delete selector with id query value; DELETE sends no JSON body.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: hainterface
  params:
    id: 1
  idempotency_key: "<idempotency-key>"
side_effect: destructive
returns:
  status: success
  data:
    hainterface_id: 1
    pre_snapshot_ref: "<hainterface-pre-delete-snapshot-ref>"
    config_result:
      status: succeeded
      config_domain: hainterface
      applied_ref: "<hainterface-delete-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: false
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - hainterface_id
    - full_config
  notes: Recreate the HA monitored interface from the full pre-delete snapshot.
pre_snapshot:
  op_id: fw_verify_hainterface
  capture_fields:
    - hainterface_id
    - full_config
rollback_apply:
  op_id: fw_config_hainterface
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_hainterface
  expected_state: exists
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: HA monitored interface deletion can affect HA failover detection and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - DELETE must use id as a query value and must not send a JSON body.
postconditions:
  - HA monitored interface deletion result and diagnostic references are available to the caller.
  - A follow-up fw_verify_hainterface query can confirm the deleted entry is absent.
tags:
  - firewall
  - capacity
  - ha
  - configuration
aliases:
  - ha-interface
  - ha-monitored-interface
since_version: "1.6.0"
