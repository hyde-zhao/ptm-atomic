schema_version: "1.1"
op_id: fw_verify_interface
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_verify_interface
description: Query NGFW interface entries from /api/v1/intf with optional pagination.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  query_domain:
    type: string
    required: true
    description: Must be interface for this operation.
  page:
    type: int
    required: false
    description: Positive page number for the paginated interface query.
  size:
    type: int
    required: false
    description: Positive page size for the paginated interface query.
inputs:
  session_ref: "<session-ref>"
  query_domain: interface
  page: 1
  size: 100
side_effect: observation
returns:
  status: success
  data:
    observed_state_ref: "<interface-state-ref>"
    interface: "<interface>"
    admin_status: enabled
    link_config: "<interface-link-config-ref>"
    full_config: "<interface-full-config-ref>"
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
dry_run_supported: true
risk_level: low
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - DEVICE_UNREACHABLE
  - RESPONSE_INVALID
  - UNKNOWN_ERROR
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
postconditions:
  - All interface entries are available to the caller.
  - When page and size are supplied, the query returns the requested page of vals while count keeps the total.
tags:
  - firewall
  - capacity
  - interface
  - verification
aliases:
  - subinterface
  - trunk
  - lag
  - bond
  - bvi
  - vlan-interface
  - tunnel
  - ip-tunnel
  - ipip
  - gre
  - 4over6
  - 6over4
since_version: "1.3.0"
