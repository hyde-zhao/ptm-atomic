schema_version: "1.1"
op_id: fw_update_acl_policy
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_update_acl_policy
description: Update an IPv4 or IPv6 NGFW control policy by id.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be acl_policy for this operation.
  params:
    type: json
    required: true
    description: Control-policy update object with a top-level id and a full val body. policy_type selects the IPv4 (ip4policy) or IPv6 (ip6policy) address family and only changes the request path; the val body is identical for both families. The id must be resolved by a fw_verify_acl_policy query matching the policy name before update.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: acl_policy
  params:
    policy_type: ipv4
    id: 4
    name: test1
    enable: true
    action: 0
    log: false
    szone: any
    dzone: any
    policy_group: "全部"
    desc: "aaa"
    src_addr: any
    src_addr_is_group: false
    dst_addr: any
    dst_addr_is_group: false
    service: any
    service_is_group: false
  idempotency_key: "<idempotency-key>"
side_effect: state_mutation
returns:
  status: success
  data:
    acl_policy_id: 4
    pre_snapshot_ref: "<acl-policy-pre-snapshot-ref>"
    config_result:
      status: succeeded
      config_domain: acl_policy
      applied_ref: "<acl-policy-update-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - acl_policy_id
    - policy_type
    - full_config
  notes: Restore the complete pre-change control-policy object, not only the modified fields.
pre_snapshot:
  op_id: fw_verify_acl_policy
  capture_fields:
    - acl_policy_id
    - full_config
rollback_apply:
  op_id: fw_update_acl_policy
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_acl_policy
  expected_state: equals_pre_snapshot
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Control-policy updates can alter traffic filtering decisions and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk configuration contract is used.
  - The id must be resolved by a fw_verify_acl_policy query before update; the device does not look up policies by name on PUT.
postconditions:
  - Control-policy update result and diagnostic references are available to the caller.
  - A follow-up fw_verify_acl_policy query can confirm the device control-policy state.
tags:
  - firewall
  - capacity
  - acl_policy
  - configuration
aliases:
  - access-list
  - access-control-list
  - firewall-policy
  - security-policy
  - ipv4-policy
  - ipv4-security-policy
  - ipv6-policy
  - ipv6-security-policy
  - control-policy
since_version: "1.7.0"
