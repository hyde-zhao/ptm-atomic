schema_version: "1.1"
op_id: fw_config_keyword
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_config_keyword
description: Create a keyword object through /api/v1/keywords.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be keyword for this operation.
  params:
    type: json
    required: true
    description: Keyword object with a required name, an optional desc, and a required non-empty content list.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: keyword
  params:
    name: test_123
    desc: desperation
    content:
      - "123"
  idempotency_key: "<idempotency-key>"
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: keyword
      applied_ref: "<keyword-config-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
side_effect: state_mutation
rollback_strategy:
  type: inverse_op
  op_id: fw_delete_batch_keyword
  snapshot_required: false
  required_inputs:
    - name
  id_source: query
  query_op: fw_verify_keyword
  query_match: name
  id_field: name
  notes: A keyword object is addressed by its own name; the name is resolved by fw_verify_keyword and then removed through the batch delete resource.
pre_snapshot:
  op_id: fw_verify_keyword
  capture_fields:
    - name
    - existence
post_verify:
  op_id: fw_verify_keyword
  expected_state: present
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Keyword objects feed content matching in later policy configuration and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk configuration contract is used.
postconditions:
  - Configuration result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - keyword
  - configuration
aliases:
  - keyword
  - keyword-object
  - kw-obj
since_version: "1.13.0"
