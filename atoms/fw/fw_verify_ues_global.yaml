schema_version: "1.1"
op_id: fw_verify_ues_global
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_verify_ues_global
description: Query the NGFW UES global configuration.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be ues_global for this operation.
inputs:
  session_ref: "<session-ref>"
  config_domain: ues_global
side_effect: observation
returns:
  status: success
  data:
    verification_summary_ref: "<ues-global-verification-summary-ref>"
    verification_status: passed
    existence: true
    full_config: "<ues-global-full-config-ref>"
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
dry_run_supported: true
risk_level: low
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_RESULT_MISSING
  - STATE_MISMATCH
  - MANUAL_HANDLING_REQUIRED
verification:
  kind: capacity_domain
  rules:
    - name: ues_global_query_returns_global_config
      input_ref: "<ues-global-query-result-ref>"
      expected_result: response carries httpdstport, httpsdstport, open_service, blocktime, uesurl, and the enable flags
  summary_ref: "<ues-global-verification-summary-ref>"
preconditions:
  - External orchestration holds a valid session_ref.
postconditions:
  - UES global query result and diagnostic references are available to the caller.
tags:
  - firewall
  - ues
  - global
  - verification
aliases:
  - ues-global
  - ues-global-config
since_version: "1.7.0"
