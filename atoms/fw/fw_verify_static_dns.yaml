schema_version: "1.1"
op_id: fw_verify_static_dns
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_verify_static_dns
description: Query static DNS table entries through GET /api/v1/dns/cache?type=static.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be static-dns for this operation.
inputs:
  session_ref: "<session-ref>"
  config_domain: static-dns
side_effect: observation
returns:
  status: success
  data:
    observed_state_ref: "<static-dns-state-ref>"
    vals_ref: "<static-dns-vals-ref>"
    count: 0
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_RESULT_MISSING
  - STATE_MISMATCH
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
verification:
  kind: capacity_domain
  rules:
    - name: static_dns_query_returns_vals
      input_ref: "<static-dns-query-result-ref>"
      expected_result: the device returns all static DNS entries in vals with name and ip4addr.
  summary_ref: "<static-dns-verification-summary-ref>"
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
postconditions:
  - Static DNS table contents and diagnostic references are available to the caller.
tags:
  - firewall
  - dns
  - static-dns
  - verification
aliases:
  - static-dns-verify
  - dns-entry-query
  - domain-mapping-list
since_version: "1.9.0"
