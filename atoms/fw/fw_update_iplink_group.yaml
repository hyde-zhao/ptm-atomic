schema_version: "1.1"
op_id: fw_update_iplink_group
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_update_iplink_group
description: Update an NGFW iplink group through /api/v1/linkgroup.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be linkgroup for this operation.
  params:
    type: json
    required: true
    description: Complete /api/v1/linkgroup payload for linkgroup update with val.name identifying the target.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: linkgroup
  params:
    val:
      name: test-group
      description: ""
      mode_strict: true
      link_name:
        - test
  idempotency_key: "<idempotency-key>"
side_effect: state_mutation
returns:
  status: success
  data:
    linkgroup_name: test-group
    pre_snapshot_ref: "<linkgroup-pre-snapshot-ref>"
    config_result:
      status: succeeded
      config_domain: linkgroup
      applied_ref: "<linkgroup-update-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - linkgroup_name
    - full_config
  notes: Restore the original linkgroup definition from the pre-update snapshot.
pre_snapshot:
  op_id: fw_verify_iplink_group
  capture_fields:
    - linkgroup_name
    - full_config
rollback_apply:
  op_id: fw_update_iplink_group
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_iplink_group
  expected_state: equals_pre_snapshot
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Iplink-group updates can change link-detection aggregation and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk linkgroup configuration is used.
postconditions:
  - Iplink-group update result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - linkgroup
  - configuration
aliases:
  - iplink-group
  - link-group
since_version: "1.4.0"
