schema_version: "1.1"
op_id: fw_verify_hasynclist
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_verify_hasynclist
description: Query NGFW HA sync status list through GET /api/v1/hasynclist.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be hasync for this operation.
inputs:
  session_ref: "<session-ref>"
  config_domain: hasync
side_effect: observation
returns:
  status: success
  data:
    observed_state_ref: "<hasynclist-state-ref>"
    full_config_ref: "<hasynclist-full-config-ref>"
    menu_list_ref: "<hasynclist-menu-list-ref>"
    count: 0
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
dry_run_supported: true
risk_level: low
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_RESULT_MISSING
  - STATE_MISMATCH
  - MANUAL_HANDLING_REQUIRED
verification:
  kind: capacity_domain
  rules:
    - name: hasynclist_returns_menu_list
      input_ref: "<hasynclist-query-result-ref>"
      expected_result: the device returns the full HA sync status in menuList with issync and isfilesync flags.
  summary_ref: "<hasynclist-verification-summary-ref>"
preconditions:
  - External orchestration holds a valid session_ref.
postconditions:
  - HA sync status query result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - ha
  - verification
aliases:
  - ha-sync
  - ha-synchronization
since_version: "1.6.0"
