schema_version: "1.1"
op_id: fw_delete_batch_geoip
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_batch_geoip
description: Delete multiple custom geoip region objects through /api/v1/batch with string ids.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be geoip for this operation.
  params:
    type: json
    required: true
    description: Batch delete request with DELETE /api/v1/geoip/custom items carrying string ids.
inputs:
  session_ref: "<session-ref>"
  config_domain: geoip
  params:
    batch:
      - method: DELETE
        resource: /api/v1/geoip/custom
        body:
          id:
            - "4"
      - method: DELETE
        resource: /api/v1/geoip/custom
        body:
          id:
            - "5"
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: geoip
      applied_ref: "<geoip-batch-delete-result-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: false
timeout_ms: 60000
error_types:
  - NONE
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - BATCH_PARTIAL_FAILED
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
    - batch_configuration
gate:
  required: true
  reason: Batch geoip region object deletion can remove multiple geo-location mappings and affect policy matching; requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
    - concurrency_review
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
  - Batch body contains only DELETE /api/v1/geoip/custom items with string ids.
postconditions:
  - Batch geoip object deletion result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - geoip
  - batch_configuration
aliases:
  - geoip
  - geo-ip-object
  - region-object
  - custom-region
  - bulk
since_version: "1.11.0"
