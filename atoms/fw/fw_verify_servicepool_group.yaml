schema_version: "1.1"
op_id: fw_verify_servicepool_group
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_verify_servicepool_group
description: Query NGFW service pool groups through /api/v1/servicepool/group with pagination.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be servicepool_group for this operation.
  page:
    type: int
    required: false
    description: Positive page number for the service pool group query.
  size:
    type: int
    required: false
    description: Positive page size for the service pool group query.
  keywords:
    type: string
    required: false
    description: Keyword filter for the service pool group query.
  params:
    type: json
    required: true
    description: Service pool group query envelope; GET sends no JSON body and returns count and vals.
inputs:
  session_ref: "<session-ref>"
  config_domain: servicepool_group
  page: 1
  size: 40
  keywords: ""
  params: {}
side_effect: observation
returns:
  status: success
  data:
    observed_state_ref: "<servicepool-group-state-ref>"
    full_config_ref: "<servicepool-group-full-config-ref>"
    vals_ref: "<servicepool-group-vals-ref>"
    count: 0
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
dry_run_supported: true
risk_level: low
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_RESULT_MISSING
  - STATE_MISMATCH
  - MANUAL_HANDLING_REQUIRED
verification:
  kind: capacity_domain
  rules:
    - name: servicepool_group_query_returns_group_list
      input_ref: "<servicepool-group-query-result-ref>"
      expected_result: the device returns count and vals with name, desc, servicepools and refcnt fields.
  summary_ref: "<servicepool-group-verification-summary-ref>"
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
postconditions:
  - Service pool group query result and diagnostic references are available to the caller.
  - Any failed check is reported for manual handling.
tags:
  - firewall
  - capacity
  - servicepool_group
  - verification
aliases:
  - service-group
  - servicepool-group
since_version: "1.8.0"
