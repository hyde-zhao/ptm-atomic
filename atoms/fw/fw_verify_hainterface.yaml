schema_version: "1.1"
op_id: fw_verify_hainterface
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_verify_hainterface
description: Query NGFW HA monitored interface entries through GET /api/v1/hainterface.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be hainterface for this operation.
inputs:
  session_ref: "<session-ref>"
  config_domain: hainterface
side_effect: observation
returns:
  status: success
  data:
    observed_state_ref: "<hainterface-state-ref>"
    full_config_ref: "<hainterface-full-config-ref>"
    vals_ref: "<hainterface-vals-ref>"
    count: 0
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
dry_run_supported: true
risk_level: low
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_RESULT_MISSING
  - STATE_MISMATCH
  - MANUAL_HANDLING_REQUIRED
verification:
  kind: capacity_domain
  rules:
    - name: hainterface_query_returns_vals
      input_ref: "<hainterface-query-result-ref>"
      expected_result: the device returns all HA monitored interfaces in vals with id, trackIntf, and state.
  summary_ref: "<hainterface-verification-summary-ref>"
preconditions:
  - External orchestration holds a valid session_ref.
postconditions:
  - HA monitored interface query result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - ha
  - verification
aliases:
  - ha-interface
  - ha-monitored-interface
since_version: "1.6.0"
