schema_version: "1.1"
op_id: fw_verify_keyword
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_verify_keyword
description: Query keyword objects with pagination through /api/v1/keywords.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be keyword for this operation.
  page:
    type: int
    required: false
    description: Positive page number for the keyword object query.
  size:
    type: int
    required: false
    description: Positive page size for the keyword object query.
  key:
    type: string
    required: false
    description: Search filter sent as `key`; live probe 2026-10-09 confirmed `keywords` is ignored here.
  params:
    type: json
    required: true
    description: Keyword object query envelope; GET sends no JSON body and returns count and vals.
inputs:
  session_ref: "<session-ref>"
  config_domain: keyword
  page: 1
  size: 40
  key: ""
  params: {}
side_effect: observation
returns:
  status: success
  data:
    observed_state_ref: "<keyword-state-ref>"
    full_config_ref: "<keyword-full-config-ref>"
    vals_ref: "<keyword-vals-ref>"
    count: 1
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
dry_run_supported: true
risk_level: low
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_RESULT_MISSING
  - STATE_MISMATCH
  - MANUAL_HANDLING_REQUIRED
verification:
  kind: capacity_domain
  rules:
    - name: keyword_query_returns_list
      input_ref: "<keyword-query-result-ref>"
      expected_result: the device returns count and vals; each entry carries config_source, refcnt, name, desc and the content list.
  summary_ref: "<keyword-verification-summary-ref>"
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
postconditions:
  - Query result and diagnostic references are available to the caller.
  - Any failed check is reported for manual handling.
tags:
  - firewall
  - capacity
  - keyword
  - verification
aliases:
  - keyword
  - keyword-object
  - kw-obj
since_version: "1.13.0"
