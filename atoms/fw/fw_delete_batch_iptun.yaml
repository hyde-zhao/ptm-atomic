schema_version: "1.1"
op_id: fw_delete_batch_iptun
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_batch_iptun
description: Delete multiple NGFW IP tunnel entries through /api/v1/batch.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be iptun for this operation.
  params:
    type: json
    required: true
    description: Batch delete request with DELETE /api/v1/iptun items.
inputs:
  session_ref: "<session-ref>"
  config_domain: iptun
  params:
    batch:
      - method: DELETE
        resource: /api/v1/iptun
        body:
          id:
            - tunnel1
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: iptun
      applied_ref: "<iptun-batch-delete-result-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: false
timeout_ms: 60000
error_types:
  - NONE
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - BATCH_PARTIAL_FAILED
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
    - batch_configuration
gate:
  required: true
  reason: Batch IP tunnel deletion can remove multiple tunnel entries and their associated tunnel interfaces and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
    - concurrency_review
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
  - Batch body contains only DELETE /api/v1/iptun items.
postconditions:
  - Batch IP tunnel deletion result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - iptun
  - batch_configuration
aliases:
  - ip-tunnel
  - ipip
  - gre
  - 4over6
  - 6over4
  - tunnel
since_version: "1.5.0"
