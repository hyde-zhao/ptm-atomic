schema_version: "1.1"
op_id: fw_delete_policy_route
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_policy_route
description: Delete an NGFW policy route by id.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be policy_route for this operation.
  params:
    type: json
    required: true
    description: Policy route delete object with id field.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: policy_route
  params:
    id: 15
  idempotency_key: "<idempotency-key>"
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: policy_route
      applied_ref: "<policy-route-delete-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: false
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Policy route deletion removes forwarding policy and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk configuration contract is used.
postconditions:
  - Policy route deletion result and diagnostic references are available to the caller.
  - A follow-up fw_verify_policy_route query can confirm the deleted route is absent.
tags:
  - firewall
  - capacity
  - policy_route
  - configuration
since_version: "1.2.0"
