schema_version: "1.1"
op_id: fw_update_timeobject
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_update_timeobject
description: Update an existing time object configuration contract for NGFW capacity. Supports oneshot/day/week/month scheduletype.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be timeobject for this operation.
  params:
    type: json
    required: true
    description: Time object update with id (name) and a val envelope of mutable fields.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  session_ref: "<session-ref>"
  config_domain: timeobject
  params:
    id: atomicTimeObj
    val:
      name: atomicTimeObj
      scheduletype: oneshot
      timequantum:
        - starttime:
            time: "2026-07-24 00:00:00"
          endtime:
            time: "2026-07-24 23:59:59"
  idempotency_key: "<idempotency-key>"
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: timeobject
      applied_ref: "<timeobject-update-result-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: false
side_effect: state_mutation
rollback_strategy:
  type: inverse_op
  op_id: fw_delete_timeobject
  snapshot_required: false
  required_inputs:
    - name
  id_source: args
  id_field: name
  notes: The time object id is its name; rollback deletes via DELETE /api/v1/timeobject?id=<name>.
pre_snapshot:
  op_id: fw_verify_timeobject
  capture_fields:
    - name
    - existence
post_verify:
  op_id: fw_verify_timeobject
  expected_state: present
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Time object updates can affect policy scheduling and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
  - The target time object name exists on the device.
  - scheduletype must be oneshot, day, week or month; month uses timemonquantum, others use timequantum.
postconditions:
  - Update result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - timeobject
  - configuration
aliases:
  - time-object
  - schedule
  - timeobject
since_version: "1.9.0"
