schema_version: "1.1"
op_id: fw_config_static_route
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_config_static_route
description: Create an NGFW static route with destination network and next-hop.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be static_route for this operation.
  params:
    type: json
    required: true
    description: Static route create object. dst_network is CIDR notation; next_hop_addr must be a valid IP matching the route type (IPv4/IPv6).
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: static_route
  params:
    dst_network: "1.1.1.0/24"
    next_hop_addr: "1.1.1.1"
    enable: true
    preference: 1
    weight: 0
    outgoing_interface: ""
  idempotency_key: "<idempotency-key>"
side_effect: state_mutation
returns:
  status: success
  data:
    created: true
    config_result:
      status: succeeded
      config_domain: static_route
      applied_ref: "<static-route-config-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
rollback_strategy:
  type: inverse_op
  op_id: fw_delete_static_route
  snapshot_required: false
  required_inputs:
    - id
  id_source: query
  id_field: id
  query_op: fw_verify_static_route
  query_match: dst_network
  query_match_source: args
  notes: Delete only when the create result is confirmed. The device returns no id on create; rollback resolves the id via fw_verify_static_route matching dst_network.
pre_snapshot:
  op_id: fw_verify_static_route
  capture_fields:
    - id
    - existence
post_verify:
  op_id: fw_verify_static_route
  expected_state: exists
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Static route changes can alter traffic forwarding and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk configuration contract is used.
  - dst_network must be valid CIDR notation; next_hop_addr must be a valid IP address.
postconditions:
  - Configuration result and diagnostic references are available to the caller.
  - A follow-up fw_verify_static_route query can confirm the route exists on the device.
tags:
  - firewall
  - capacity
  - static_route
  - configuration
aliases:
  - static-routing
since_version: "1.1.0"
