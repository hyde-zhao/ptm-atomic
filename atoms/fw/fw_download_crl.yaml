schema_version: "1.1"
op_id: fw_download_crl
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_download_crl
description: Download a registered CRL certificate through /api/v1/cert/download and /api/v1/downloadfile.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be crl for this operation.
  params:
    type: json
    required: true
    description: CRL download selector with the registered certName and the artifact fileType; pfxPasswd is only used for fileType pfx.
  output_path:
    type: string
    required: true
    description: Local filesystem path the downloaded bytes are written to.
inputs:
  session_ref: "<session-ref>"
  config_domain: crl
  params:
    certName: GDCA_HKMR_IV_CA.crl
    fileType: cert
    pfxPasswd: ""
  output_path: "<crl-output-path>"
side_effect: observation
returns:
  status: success
  data:
    tmpcert_ref: "<crl-tmpcert-ref>"
    file_ref: "<crl-download-file-ref>"
    file_size: 480
    sha256: "<sha256-of-file>"
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
dry_run_supported: true
risk_level: low
timeout_ms: 60000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
preconditions:
  - The named CRL is registered on the device and the output path parent directory exists.
postconditions:
  - The downloaded bytes are written to output_path; contents are never parsed by the runner.
tags:
  - firewall
  - certificate
  - crl
  - download
  - data_management
aliases:
  - crl
  - certificate-revocation-list
  - certcrl
  - download-crl
since_version: "1.13.0"
