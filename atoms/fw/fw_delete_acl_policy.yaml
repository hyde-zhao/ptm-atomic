schema_version: "1.1"
op_id: fw_delete_acl_policy
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_acl_policy
description: Delete an NGFW control policy by id through /api/v1/ip{4,6}policy/fwaclconf.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be acl_policy for this operation.
  params:
    type: json
    required: true
    description: Control-policy delete selector with id and policy_type query values; DELETE sends no JSON body. policy_type selects the IPv4 (ip4policy) or IPv6 (ip6policy) address family and only changes the request path.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: acl_policy
  params:
    id: 4
    policy_type: ipv4
  idempotency_key: "<idempotency-key>"
side_effect: destructive
returns:
  status: success
  data:
    acl_policy_id: 4
    pre_snapshot_ref: "<acl-policy-pre-delete-snapshot-ref>"
    config_result:
      status: succeeded
      config_domain: acl_policy
      applied_ref: "<acl-policy-delete-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: false
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - acl_policy_id
    - policy_type
    - full_config
  notes: Recreate the control-policy object from the full pre-delete snapshot.
pre_snapshot:
  op_id: fw_verify_acl_policy
  capture_fields:
    - acl_policy_id
    - full_config
rollback_apply:
  op_id: fw_config_acl_policy
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_acl_policy
  expected_state: exists
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Control-policy deletion removes a filtering rule and may alter traffic decisions; requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk configuration contract is used.
  - DELETE must use id as a query value and must not send a JSON body.
  - The address family is selected by the request path only; no is_ip6 query is sent, unlike fw_delete_policy_route.
postconditions:
  - Control-policy deletion result and diagnostic references are available to the caller.
  - A follow-up fw_verify_acl_policy query can confirm the deleted policy is absent.
tags:
  - firewall
  - capacity
  - acl_policy
  - configuration
aliases:
  - access-list
  - access-control-list
  - firewall-policy
  - security-policy
  - ipv4-policy
  - ipv4-security-policy
  - ipv6-policy
  - ipv6-security-policy
  - control-policy
since_version: "1.7.0"
