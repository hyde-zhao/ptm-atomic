schema_version: "1.1"
op_id: fw_config_acl_policy
device_type: fw
description: Define ACL policy configuration contract for NGFW capacity operations.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be acl_policy for this operation.
  params:
    type: json
    required: true
    description: ACL policy configuration object with required domain fields.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: acl_policy
  params:
    policy_name: "<policy-name>"
    rule_ref: "<rule-ref>"
    action: allow
    params_digest: "<params-digest>"
  idempotency_key: "<idempotency-key>"
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: acl_policy
      applied_ref: "<acl-policy-config-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: ACL policy changes can affect traffic decisions and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk configuration contract is used.
postconditions:
  - Configuration result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - acl_policy
  - configuration
aliases:
  - access-list
  - access-control-list
  - firewall-policy
  - security-policy
  - ipv4-policy
  - ipv4-security-policy
  - control-policy
since_version: "1.1.0"
