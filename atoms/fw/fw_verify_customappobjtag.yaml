schema_version: "1.1"
op_id: fw_verify_customappobjtag
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_verify_customappobjtag
description: Query NGFW custom application tags through /api/v1/customappobjtag with pagination.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be customappobjtag for this operation.
  page:
    type: int
    required: false
    description: Positive page number for the custom application-tag query.
  size:
    type: int
    required: false
    description: Positive page size for the custom application-tag query.
  keywords:
    type: string
    required: false
    description: Keyword filter for the custom application-tag query.
  params:
    type: json
    required: true
    description: Custom application-tag query envelope; GET sends no JSON body and returns count and vals.
inputs:
  session_ref: "<session-ref>"
  config_domain: customappobjtag
  page: 1
  size: 40
  keywords: ""
  params: {}
side_effect: observation
returns:
  status: success
  data:
    observed_state_ref: "<customappobjtag-state-ref>"
    full_config_ref: "<customappobjtag-full-config-ref>"
    vals_ref: "<customappobjtag-vals-ref>"
    count: 0
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
dry_run_supported: true
risk_level: low
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_RESULT_MISSING
  - STATE_MISMATCH
  - MANUAL_HANDLING_REQUIRED
verification:
  kind: capacity_domain
  rules:
    - name: customappobjtag_query_returns_tag_list
      input_ref: "<customappobjtag-query-result-ref>"
      expected_result: the device returns count and vals with name_cn, desc, customflag, appobjkeys and refcnt fields.
  summary_ref: "<customappobjtag-verification-summary-ref>"
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
postconditions:
  - Custom application-tag query result and diagnostic references are available to the caller.
  - Any failed check is reported for manual handling.
tags:
  - firewall
  - capacity
  - customappobjtag
  - verification
aliases:
  - application-tag
  - custom-app-tag
  - appobjtag
since_version: "1.8.0"
