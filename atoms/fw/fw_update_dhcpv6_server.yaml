schema_version: "1.1"
op_id: fw_update_dhcpv6_server
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_update_dhcpv6_server
description: Update a DHCPv6 server by bound interface name through /api/v1/dhcpv6.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be dhcpv6 for this operation.
  params:
    type: json
    required: true
    description: DHCPv6 server update envelope with the target interface name as id and a full server configuration as val; the device replaces the whole configuration rather than merging fields. The lease and subnet keys are mandatory in practice; see postconditions.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: dhcpv6
  params:
    id: GE0_13
    val:
      ifname: GE0_13
      ifmode: SERVER
      enable: true
      server:
        enable: true
        name: GE0_13
        subnet: 1111::/96
        prefix: 8888::1111/96
        prefix_len: 96
        lease:
          limited: true
          default_seconds: 86400
        dns1: 1111::4133
        dns2: 1123::4556
        hosts: []
        sip: 1111::4111
        sntp: 1666::4666
        domain: example.internal
  idempotency_key: "<idempotency-key>"
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: dhcpv6
      applied_ref: "<dhcpv6-update-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
side_effect: state_mutation
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - full_config
  notes: Re-apply the full pre-update val captured before the change; the device replaces the whole configuration, so a partial payload cannot restore it.
pre_snapshot:
  op_id: fw_verify_dhcpv6_server
  capture_fields:
    - full_config
rollback_apply:
  op_id: fw_update_dhcpv6_server
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_dhcpv6_server
  expected_state: present
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Updating a DHCPv6 server changes the addresses and options handed to clients on the bound interface segment and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk configuration contract is used.
  - A DHCPv6 server already exists for the target interface name; the create path is POST, not PUT.
  - A minimal body cannot express an update. Live probing rejected bodies that carried enable flags alone (eRequestParam, and eDhcpdNoPrefixOrNetworkWithDetail when the address pool itself was also missing), which proves PUT replaces the whole configuration rather than merging fields. Bindings and optional options omitted from an update are therefore removed.
  - server.subnet and server.prefix must differ, server.prefix_len must fall in the inclusive range from the prefix length to that length plus 16, and every host binding address must fall inside server.subnet; the device answers eDhcpdNetworkDuplicateWithDetail, eDhcpdPrefixRangeErrorWithDetail and eDhcpdConfigHostIpWithinSubnetWithDetail respectively.
  - Both enable flags are independent of each other and of the update itself; a val that omits the top-level enable lets the device materialise false for that key.
postconditions:
  - Configuration result and diagnostic references are available to the caller.
  - The device's management service stays up only because val.server.lease and val.server.subnet are both present in the request body. Omitting lease crashes the management service (nginx 502, roughly 90 seconds of outage) - a conclusion inherited from live isolation on the IPv4 sibling family rather than repeated locally. Omitting subnet was proven to crash it locally on 2026-10-16, also nginx 502, roughly 3 minutes of outage.
  - A failed request answers a nested error object carrying code and message, rather than the flat errCode shape used by every other endpoint in this repository.
tags:
  - firewall
  - capacity
  - dhcpv6
  - configuration
aliases:
  - dhcpv6-server
  - dhcpv6-service
  - dhcpv6-scope
since_version: "1.15.0"
