schema_version: "1.1"
op_id: fw_verify_filetypeobj
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_verify_filetypeobj
description: Query NGFW file type groups through /api/v1/appsec/filetypeObj with pagination.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be appsec_filetypeobj for this operation.
  page:
    type: int
    required: false
    description: Positive page number for the file type group query.
  size:
    type: int
    required: false
    description: Positive page size for the file type group query.
  keywords:
    type: string
    required: false
    description: Keyword filter for the file type group query.
  params:
    type: json
    required: true
    description: File type group query envelope; GET sends no JSON body and returns count and vals.
inputs:
  session_ref: "<session-ref>"
  config_domain: appsec_filetypeobj
  page: 1
  size: 40
  keywords: ""
  params: {}
side_effect: observation
returns:
  status: success
  data:
    observed_state_ref: "<filetypeobj-state-ref>"
    full_config_ref: "<filetypeobj-full-config-ref>"
    vals_ref: "<filetypeobj-vals-ref>"
    count: 0
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
dry_run_supported: true
risk_level: low
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_RESULT_MISSING
  - STATE_MISMATCH
  - MANUAL_HANDLING_REQUIRED
verification:
  kind: capacity_domain
  rules:
    - name: filetypeobj_query_returns_list
      input_ref: "<filetypeobj-query-result-ref>"
      expected_result: the device returns count and vals with objid, name, count, des and filetype fields.
  summary_ref: "<filetypeobj-verification-summary-ref>"
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
postconditions:
  - Query result and diagnostic references are available to the caller.
  - Any failed check is reported for manual handling.
tags:
  - firewall
  - capacity
  - filetypeobj
  - verification
aliases:
  - file-type-group
  - appsec-filetype-group
  - filetype-obj
since_version: "1.11.0"
