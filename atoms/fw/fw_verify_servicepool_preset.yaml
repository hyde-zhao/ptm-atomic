schema_version: "1.1"
op_id: fw_verify_servicepool_preset
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_verify_servicepool_preset
description: Query NGFW preset service pools through /api/v1/servicepool with type PRESET and pagination.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be servicepool for this operation.
  page:
    type: int
    required: false
    description: Positive page number for the preset service pool query.
  size:
    type: int
    required: false
    description: Positive page size for the preset service pool query.
  params:
    type: json
    required: true
    description: Preset service pool query envelope; GET sends no JSON body and returns count and vals with type PRESET.
inputs:
  session_ref: "<session-ref>"
  config_domain: servicepool
  page: 1
  size: 40
  params: {}
side_effect: observation
returns:
  status: success
  data:
    observed_state_ref: "<servicepool-preset-state-ref>"
    full_config_ref: "<servicepool-preset-full-config-ref>"
    vals_ref: "<servicepool-preset-vals-ref>"
    count: 0
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
dry_run_supported: true
risk_level: low
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_RESULT_MISSING
  - STATE_MISMATCH
  - MANUAL_HANDLING_REQUIRED
verification:
  kind: capacity_domain
  rules:
    - name: servicepool_preset_query_returns_preset_list
      input_ref: "<servicepool-preset-query-result-ref>"
      expected_result: the device returns count and vals with name, desc, type PRESET, ranges and refcnt fields.
  summary_ref: "<servicepool-preset-verification-summary-ref>"
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
postconditions:
  - Preset service pool query result and diagnostic references are available to the caller.
  - Any failed check is reported for manual handling.
tags:
  - firewall
  - capacity
  - servicepool
  - verification
aliases:
  - service-pool
  - preset-service
  - servicepool-preset
since_version: "1.8.0"
