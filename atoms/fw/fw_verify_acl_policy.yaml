schema_version: "1.1"
op_id: fw_verify_acl_policy
device_type: fw
description: Verify ACL policy configuration contract result for NGFW capacity operations.
parameters:
  config_result_ref:
    type: string
    required: false
    description: Non-sensitive reference to the related configuration result.
  config_result:
    type: json
    required: false
    description: Inline non-sensitive configuration result envelope.
  verification_rules:
    type: list
    required: true
    description: Rules used to check ACL policy configuration state.
  expected_rule_ref:
    type: string
    required: true
    description: Expected rule reference.
inputs:
  state_ref: "<state-ref>"
  config_result_ref: "<acl-policy-config-result-ref>"
  config_domain: acl_policy
returns:
  status: success
  data:
    verification_summary_ref: "<acl-policy-verification-summary-ref>"
    verification_status: passed
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_RESULT_MISSING
  - STATE_MISMATCH
  - MANUAL_HANDLING_REQUIRED
verification:
  kind: capacity_domain
  rules:
    - name: acl_policy_state_matches
      input_ref: "<acl-policy-config-result-ref>"
      expected_result: policy name, rule reference, action, and digest match
  summary_ref: "<acl-policy-verification-summary-ref>"
preconditions:
  - A related ACL policy configuration result reference is available.
postconditions:
  - Verification summary and diagnostic references are available to the caller.
  - Any failed check is reported for manual handling.
tags:
  - firewall
  - capacity
  - acl_policy
  - verification
aliases:
  - access-list
  - access-control-list
  - firewall-policy
  - security-policy
  - ipv4-policy
  - ipv4-security-policy
  - control-policy
since_version: "1.1.0"
