schema_version: "1.1"
op_id: fw_delete_halinkgroup
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_halinkgroup
description: Delete an NGFW HA linkgroup entry by name through DELETE /api/v1/ha/iplink with isGroup=true.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be halinkgroup for this operation.
  params:
    type: json
    required: true
    description: HA linkgroup delete selector with id query value and isGroup=true; DELETE sends no JSON body.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: halinkgroup
  params:
    id: iplinkgroup
  idempotency_key: "<idempotency-key>"
side_effect: destructive
returns:
  status: success
  data:
    halinkgroup_name: iplinkgroup
    pre_snapshot_ref: "<halinkgroup-pre-delete-snapshot-ref>"
    config_result:
      status: succeeded
      config_domain: halinkgroup
      applied_ref: "<halinkgroup-delete-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: false
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - halinkgroup_name
    - full_config
  notes: Recreate the HA linkgroup from the full pre-delete snapshot.
pre_snapshot:
  op_id: fw_verify_halinkgroup
  capture_fields:
    - halinkgroup_name
    - full_config
rollback_apply:
  op_id: fw_config_halinkgroup
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_halinkgroup
  expected_state: exists
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: HA linkgroup deletion can affect HA failover detection and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - DELETE uses the /api/v1/ha/iplink path with id as a query value and isGroup=true.
postconditions:
  - HA linkgroup deletion result and diagnostic references are available to the caller.
  - A follow-up fw_verify_halinkgroup query can confirm the deleted entry is absent.
tags:
  - firewall
  - capacity
  - ha
  - configuration
aliases:
  - ha-linkgroup
  - ha-link-group
since_version: "1.6.0"
