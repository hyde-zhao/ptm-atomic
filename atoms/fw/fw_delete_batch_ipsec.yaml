schema_version: '1.1'
op_id: fw_delete_batch_ipsec
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_batch_ipsec
description: Delete multiple NGFW IPsec policies in one device through POST /api/v1/batch.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be ipsec for this operation.
  params:
    type: json
    required: true
    description: Batch delete request with DELETE items targeting /api/v1/ipsec. Each item carries body.id as a non-empty list of policy names.
inputs:
  session_ref: <session-ref>
  config_domain: ipsec
  params:
    batch:
    - method: DELETE
      resource: /api/v1/ipsec
      body:
        id:
        - p2mp
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: ipsec
      applied_ref: <ipsec-batch-delete-result-ref>
  error_type: NONE
  diag_snapshot_ref: <diag-snapshot-ref>
idempotent: false
rollback_strategy:
  type: irreversible
  snapshot_required: false
  required_inputs: []
  notes: A batch delete returns one result per item with no shared id to roll back from; recreate the policies individually through fw_config_ipsec_policy when they must be restored.
timeout_ms: 60000
error_types:
- NONE
- VALIDATION_FAILED
- GATE_MISSING
- CONFIG_REJECTED
- DEVICE_UNREACHABLE
- BATCH_PARTIAL_FAILED
- UNKNOWN_ERROR
risk:
  level: high
  categories:
  - configuration
  - capacity_domain
  - batch_configuration
gate:
  required: true
  reason: Batch IPsec policy deletion can tear down several tunnels in one request and requires review.
  approver_role: change_reviewer
  evidence_required:
  - approved_change_record
  - state_reference
  - parameter_digest
preconditions:
- External orchestration holds a valid session_ref or runner session file.
- Batch body contains only DELETE items targeting /api/v1/ipsec.
- Batch operations are scoped to a single device; multi-device orchestration is a separate contract.
postconditions:
- Batch IPsec policy deletion result and diagnostic references are available to the caller.
- A follow-up fw_verify_ipsec_policy query can confirm the deleted policy names are absent.
tags:
- firewall
- capacity
- ipsec
- batch_configuration
aliases:
- ipsec
- ipsec-batch
since_version: 1.6.0
