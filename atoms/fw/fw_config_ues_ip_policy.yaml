schema_version: "1.1"
op_id: fw_config_ues_ip_policy
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_config_ues_ip_policy
description: Create an NGFW UES IP promotion policy.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be ues_ip_policy for this operation.
  params:
    type: json
    required: true
    description: UES IP promotion-policy create object. action maps to 0=permit, 1=permit and log, 2=permit and push promotion (cycletime is the push interval in cycles; exact semantics of 1 and 2 need device confirmation). srcip/dstip are address object names unless the matching isgroup flag is true; "any" matches any address.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: ues_ip_policy
  params:
    name: "hh"
    enable: true
    action: 0
    log: false
    cycletime: 0
    desc: ""
    srcip: "any"
    srcipisgroup: false
    dstip: "any"
    dstipisgroup: false
  idempotency_key: "<idempotency-key>"
side_effect: state_mutation
returns:
  status: success
  data:
    ip_policy_id: "<ues-ip-policy-id>"
    created: true
    config_result:
      status: succeeded
      config_domain: ues_ip_policy
      applied_ref: "<ues-ip-policy-config-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
rollback_strategy:
  type: inverse_op
  op_id: fw_delete_ues_ip_policy
  snapshot_required: false
  required_inputs:
    - ip_policy_id
  id_source: query
  query_op: fw_verify_ues_ip_policy
  query_match: name
  query_match_source: args
  notes: Delete only when the create result reports created=true; pre-existing idempotent objects must not be deleted by default. POST /api/v1/uesippolicy returns only {"msg":"success"}, so the new policy id is resolved by querying the list and matching name.
pre_snapshot:
  op_id: fw_verify_ues_ip_policy
  capture_fields:
    - ip_policy_id
    - existence
post_verify:
  op_id: fw_verify_ues_ip_policy
  expected_state: exists
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - ues_integration
gate:
  required: true
  reason: UES promotion-policy creation changes user-facing traffic behavior and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk configuration contract is used.
postconditions:
  - Configuration result and diagnostic references are available to the caller.
  - A follow-up fw_verify_ues_ip_policy query can confirm the policy exists by name.
tags:
  - firewall
  - ues
  - ip_policy
  - configuration
aliases:
  - ues-promotion-policy
  - promotion-policy
  - ues-ippolicy
since_version: "1.7.0"
