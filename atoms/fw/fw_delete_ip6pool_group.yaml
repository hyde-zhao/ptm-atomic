schema_version: "1.1"
op_id: fw_delete_ip6pool_group
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_ip6pool_group
description: Delete an NGFW IPv6 address group by name through /api/v1/ip6pool/group.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be ip6pool_group for this operation.
  params:
    type: json
    required: true
    description: IPv6 address group delete selector with id query value; DELETE sends no JSON body.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: ip6pool_group
  params:
    id: atomicIp6Group
  idempotency_key: "<idempotency-key>"
side_effect: destructive
returns:
  status: success
  data:
    name: atomicIp6Group
    pre_snapshot_ref: "<ip6pool-group-pre-delete-snapshot-ref>"
    config_result:
      status: succeeded
      config_domain: ip6pool_group
      applied_ref: "<ip6pool-group-delete-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: false
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - name
    - full_config
  notes: Recreate the IPv6 address group from the full pre-delete snapshot.
pre_snapshot:
  op_id: fw_verify_ip6pool_group
  capture_fields:
    - name
    - full_config
rollback_apply:
  op_id: fw_config_ip6pool_group
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_ip6pool_group
  expected_state: absent
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: IPv6 address group deletion removes a referenced capacity object and may affect policy matching; requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk deletion is used.
  - DELETE must use id as a query value and must not send a JSON body.
postconditions:
  - Deletion result and diagnostic references are available to the caller.
  - A follow-up fw_verify_ip6pool_group query can confirm the deleted group is absent.
tags:
  - firewall
  - capacity
  - ip6pool_group
  - configuration
aliases:
  - ip6pool-group
  - ipv6-address-group
  - address-group
since_version: "1.9.0"
