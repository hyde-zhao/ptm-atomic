schema_version: "1.1"
op_id: fw_delete_dns_proxy_server
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_dns_proxy_server
description: Delete a DNS proxy server by address through DELETE /api/v1/dns/globalserver?id=<addr>.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be dns-proxy-server for this operation.
  params:
    type: json
    required: true
    description: DNS proxy server address object with id field equal to the addr to delete.
inputs:
  session_ref: "<session-ref>"
  config_domain: dns-proxy-server
  params:
    id: <DNS_SERVER_IP>
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: dns-proxy-server
      applied_ref: "<dns-proxy-server-delete-result-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
side_effect: destructive
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - dns
    - destructive
gate:
  required: true
  reason: Deleting a DNS proxy server disrupts proxied DNS resolution and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
  - The addr field is the address of an existing DNS proxy server.
postconditions:
  - DNS proxy server deletion result and diagnostic references are available to the caller.
  - A follow-up fw_verify_dns_proxy_server can confirm the server is gone.
tags:
  - firewall
  - dns
  - dns-proxy
  - destructive
aliases:
  - dns-proxy-server-delete
  - global-dns-server-del
  - proxy-server-remove
since_version: "1.9.0"
