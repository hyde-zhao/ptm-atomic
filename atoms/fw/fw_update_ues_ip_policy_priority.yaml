schema_version: "1.1"
op_id: fw_update_ues_ip_policy_priority
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_update_ues_ip_policy_priority
description: Move an NGFW UES IP promotion-policy priority.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be ues_ip_policy_order for this operation.
  params:
    type: json
    required: true
    description: Priority move object with targetsite and moveid. targetsite supports first (recorded); before/after/last and targetid are not recorded yet and need device confirmation.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: ues_ip_policy_order
  params:
    targetsite: first
    moveid: 1
    targetid: 0
  idempotency_key: "<idempotency-key>"
side_effect: state_mutation
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: ues_ip_policy_order
      applied_ref: "<ues-ip-policy-order-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - ues_integration
gate:
  required: true
  reason: UES promotion-policy priority changes alter user-facing traffic order and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk priority change is used.
  - The recorded payload carries only targetsite and moveid; targetid is not sent for first moves.
postconditions:
  - UES promotion-policy priority update result and diagnostic references are available to the caller.
  - A follow-up fw_verify_ues_ip_policy_order query can confirm policy ordering.
tags:
  - firewall
  - ues
  - ip_policy
  - configuration
aliases:
  - ues-policy-order
  - ues-priority
  - move-ues-policy
since_version: "1.7.0"
