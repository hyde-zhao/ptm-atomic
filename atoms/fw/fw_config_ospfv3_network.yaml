schema_version: "1.1"
op_id: fw_config_ospfv3_network
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_config_ospfv3_network
description: Create an NGFW OSPFv3 network entry.
parameters:
  params:
    type: json
    required: true
    description: OSPFv3 network object with interface and area fields.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: ospfv3_network
      applied_ref: "<ospfv3-network-config-result-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: false
timeout_ms: 30000
error_types: [NONE, VALIDATION_FAILED, GATE_MISSING, CONFIG_REJECTED, DEVICE_UNREACHABLE, UNKNOWN_ERROR]
risk:
  level: high
  categories: [configuration, routing]
gate:
  required: true
  reason: OSPFv3 network changes alter interface area participation and require review.
  approver_role: change_reviewer
  evidence_required: [approved_change_record, parameter_digest]
preconditions:
  - Gate evidence exists before this high-risk routing configuration is used.
postconditions:
  - OSPFv3 network creation result is available to the caller.
tags: [firewall, ospfv3, routing, configuration]
since_version: "1.2.0"
