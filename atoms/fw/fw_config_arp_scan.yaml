schema_version: "1.1"
op_id: fw_config_arp_scan
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_config_arp_scan
description: Configure ARP scan interfaces and CIDR nets through /api/v1/neighbor/scan/intf.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be arp_scan for this operation.
  params:
    type: json
    required: true
    description: ARP scan interface list, each with name, enable, and nets (CIDR strings).
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: arp_scan
  params:
    val:
      intfs:
        - name: GE0_6
          enable: true
          nets:
            - 66.1.1.0/24
  idempotency_key: "<idempotency-key>"
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: arp_scan
      applied_ref: "<arp-scan-config-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - network
gate:
  required: true
  reason: ARP scan settings change which interfaces probe the network and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - At least one interface with a valid CIDR net is provided.
postconditions:
  - ARP scan interface/nets are configured and the result reference is available to the caller.
tags:
  - firewall
  - network
  - arp
  - scan
  - configuration
aliases:
  - arp-scan
  - arp-scan-intf
  - neighbor-scan
  - arp-scan-config
since_version: "1.9.0"
