schema_version: "1.1"
op_id: fw_delete_ips_profile
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_ips_profile
description: Delete one IPS protection profile by id through /api/v1/appsec/ips/profiles.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be ips_profile for this operation.
  params:
    type: json
    required: true
    description: >-
      IPS protection-profile delete selector. id is the numeric profile id
      carried in a JSON request body ({"id": "..."}), unlike the query-string
      delete style used by several other NGFW families.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: ips_profile
  params:
    id: "1001"
  idempotency_key: "<idempotency-key>"
side_effect: destructive
returns:
  status: success
  data:
    ips_profile_id: "<ips-profile-id>"
    pre_snapshot_ref: "<ips-profile-pre-delete-snapshot-ref>"
    config_result:
      status: succeeded
      config_domain: ips_profile
      applied_ref: "<ips-profile-delete-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - ips_profile_id
    - full_config
  notes: Recreate the IPS protection profile from the full pre-delete snapshot.
pre_snapshot:
  op_id: fw_verify_ips_profile
  capture_fields:
    - profile_ids
    - full_config
  notes: Capture the full profile (filters, actionWrapper, whiteList and customAddRuleList) before delete.
rollback_apply:
  op_id: fw_config_ips_profile
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_ips_profile
  expected_state: absent
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - security_domain
    - destructive
gate:
  required: true
  reason: Deleting an IPS protection profile removes prevention coverage and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk deletion contract is used.
  - No control policy references the profile through sec_obj_data, or the caller accepts removing that reference.
postconditions:
  - 'The device answers {"msg": "success"} for a successful delete.'
  - A follow-up fw_verify_ips_profile query confirms the profile is absent.
tags:
  - firewall
  - ips
  - profile
  - delete
aliases:
  - ips-profile
  - ips-protection-profile
  - intrusion-prevention-profile
  - ips-template
since_version: "1.16.0"
