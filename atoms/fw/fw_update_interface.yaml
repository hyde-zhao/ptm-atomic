schema_version: "1.1"
op_id: fw_update_interface
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_update_interface
description: Update an NGFW interface entry through /api/v1/intf.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be interface for this operation.
  params:
    type: json
    required: true
    description: >-
      Complete /api/v1/intf interface payload for bvi, subinterface, physical, or bond update.
      FULL-REPLACEMENT PUT: fields omitted from val are wiped on the device (e.g. toggling
      --interface-enabled without --ip-address clears existing IPs). Pass --keep-ip on
      'ptm-atomic run interface update' to backfill current device IPs, or re-pass --ip-address.
      Bond update (P2-bond-schema) - id is bond<N>, val.type is 10, val.bond={id, mode, lb,
      bonded_interfaces=[{name, is_passive, is_long_timeout}]}; CLI --bond-member must be
      repeated per member (a comma-joined string is ONE member name).
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: interface
  params:
    id: GE0_19
    val:
      name: GE0_19
      type: 3
      mode: Route
      ip_addresses: []
  idempotency_key: "<idempotency-key>"
side_effect: state_mutation
returns:
  status: success
  data:
    interface: GE0_19
    pre_snapshot_ref: "<interface-pre-snapshot-ref>"
    config_result:
      status: succeeded
      config_domain: interface
      applied_ref: "<interface-update-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - interface
    - full_config
  notes: Restore the original interface definition; disable/enable changes must return to the pre-operation admin status.
pre_snapshot:
  op_id: fw_verify_interface
  capture_fields:
    - interface
    - admin_status
    - link_config
    - full_config
rollback_apply:
  op_id: fw_update_interface
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_interface
  expected_state: equals_pre_snapshot
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Interface updates can change traffic reachability and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk interface configuration is used.
  - >-
    FULL-REPLACEMENT PUT semantics (P2-42): fw_update_interface sends the complete val object;
    any field omitted from val (ip_addresses, desc, level, service, mtus, ...) is wiped on the device.
    When only toggling --interface-enabled/--interface-disabled, callers MUST re-pass --ip-address
    (or use --keep-ip so the runner backfills current device IPs) or gateway IPs will be lost.
  - >-
    Bond interfaces (P2-bond-schema): id is bond<N> and val.type is 10; val.bond carries
    id, mode, lb and bonded_interfaces=[{name, is_passive, is_long_timeout}]. On the CLI,
    --bond-member is an append flag: repeat it per member (--bond-member GE0_1 --bond-member GE0_2);
    a comma-joined string is sent as ONE member name.
postconditions:
  - Interface update result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - interface
  - configuration
aliases:
  - subinterface
  - trunk
  - lag
  - bond
  - bvi
  - vlan-interface
  - pppoe
  - dhcp
  - southbound-interface
  - sub-interface
  - routed-interface
  - tunnel
  - ip-tunnel
  - ipip
  - gre
  - 4over6
  - 6over4
since_version: "1.3.0"
