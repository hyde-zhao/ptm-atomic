schema_version: "1.1"
op_id: fw_config_reboot
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_config_reboot
description: Reboot an NGFW device through /api/v1/reboot.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be reboot for this operation.
  expected_unavailable_seconds:
    type: int
    required: false
    description: Informational estimate of how long the device stays unreachable after reboot.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: reboot
  expected_unavailable_seconds: 300
  idempotency_key: "<idempotency-key>"
side_effect: destructive
returns:
  status: success
  data:
    reboot_initiated: true
    session_invalidated: true
    expected_unavailable_seconds: 300
    state_ref: "<state-ref>"
    state_status: invalid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: false
rollback_strategy:
  type: manual_required
  snapshot_required: false
  required_inputs:
    - reboot_initiated
  notes: A reboot cannot be rolled back automatically; the operator must wait for the device to come back up.
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Rebooting the device causes a service interruption and invalidates the current session.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this destructive reboot is used.
postconditions:
  - The device is rebooting and will be unreachable for expected_unavailable_seconds.
  - A fresh fw_login_web_management session is required before any further run command.
tags:
  - firewall
  - capacity
  - reboot
  - configuration
aliases:
  - restart
  - reload
  - device-reboot
since_version: "1.6.0"
