schema_version: "1.1"
op_id: fw_verify_bandwidth
device_type: fw
description: Verify bandwidth configuration contract result for NGFW capacity.
parameters:
  config_result_ref:
    type: string
    required: false
    description: Non-sensitive reference to the related configuration result.
  config_result:
    type: json
    required: false
    description: Inline non-sensitive configuration result envelope.
  verification_rules:
    type: list
    required: true
    description: Rules used to check bandwidth configuration state.
  expected_profile_ref:
    type: string
    required: true
    description: Expected bandwidth profile reference.
inputs:
  state_ref: "<state-ref>"
  config_result_ref: "<bandwidth-config-result-ref>"
  config_domain: bandwidth
returns:
  status: success
  data:
    verification_summary_ref: "<bandwidth-verification-summary-ref>"
    verification_status: passed
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_RESULT_MISSING
  - STATE_MISMATCH
  - MANUAL_HANDLING_REQUIRED
verification:
  kind: capacity_domain
  rules:
    - name: bandwidth_state_matches
      input_ref: "<bandwidth-config-result-ref>"
      expected_result: profile, limit value, unit, and target references match
  summary_ref: "<bandwidth-verification-summary-ref>"
preconditions:
  - A related bandwidth configuration result reference is available.
postconditions:
  - Verification summary and diagnostic references are available to the caller.
  - Any failed check is reported for manual handling.
tags:
  - firewall
  - capacity
  - bandwidth
  - verification
aliases:
  - qos
  - traffic-shaping
  - rate-limit
since_version: "1.1.0"
