schema_version: "1.1"
op_id: fw_verify_crl
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_verify_crl
description: Query CRL certificates with pagination through /api/v1/cert/certcrl.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be crl for this operation.
  page:
    type: int
    required: false
    description: Positive page number for the CRL query.
  size:
    type: int
    required: false
    description: Positive page size for the CRL query.
  keywords:
    type: string
    required: false
    description: Search filter sent as `keywords`; live probe 2026-10-09 confirmed `key` is ignored here.
  params:
    type: json
    required: true
    description: CRL query envelope; GET sends no JSON body and returns count and vals.
inputs:
  session_ref: "<session-ref>"
  config_domain: crl
  page: 1
  size: 40
  keywords: ""
  params: {}
side_effect: observation
returns:
  status: success
  data:
    observed_state_ref: "<crl-state-ref>"
    full_config_ref: "<crl-full-config-ref>"
    vals_ref: "<crl-vals-ref>"
    count: 0
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
dry_run_supported: true
risk_level: low
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_RESULT_MISSING
  - STATE_MISMATCH
  - MANUAL_HANDLING_REQUIRED
verification:
  kind: capacity_domain
  rules:
    - name: crl_query_returns_list
      input_ref: "<crl-query-result-ref>"
      expected_result: the device returns count and vals for registered CRL certificates; each entry carries name and numeric id.
  summary_ref: "<crl-verification-summary-ref>"
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
postconditions:
  - Query result and diagnostic references are available to the caller.
  - Any failed check is reported for manual handling.
tags:
  - firewall
  - certificate
  - crl
  - verification
aliases:
  - crl
  - certificate-revocation-list
  - certcrl
  - revocation-list
since_version: "1.13.0"
