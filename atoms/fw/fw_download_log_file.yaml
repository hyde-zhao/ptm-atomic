schema_version: "1.1"
op_id: fw_download_log_file
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_download_log_file
description: Download an exported log file through GET /api/v1/downloadfile.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  file_id:
    type: string
    required: true
    description: File name returned by fw_verify_log_download_task.
  output_path:
    type: string
    required: true
    description: Local path where the downloaded log file bytes are written.
inputs:
  session_ref: "<session-ref>"
  file_id: "<ready-filename>"
  output_path: /tmp/ipslog_export.csv
side_effect: observation
returns:
  status: success
  data:
    file_id: "<ready-filename>"
    file_ref: /tmp/ipslog_export.csv
    file_size: 1024
    sha256: "<sha256-of-log-file>"
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
dry_run_supported: true
risk_level: low
timeout_ms: 60000
error_types:
  - NONE
  - VALIDATION_FAILED
  - DEVICE_UNREACHABLE
  - RESPONSE_INVALID
  - UNKNOWN_ERROR
verification:
  kind: diagnostics
  rules:
    - name: log_file_download_writes_bytes
      input_ref: "<log-file-download-result-ref>"
      expected_result: >-
        GET /api/v1/downloadfile?id=<urlencoded filename> returns the log file
        bytes; the runner writes them to output_path and reports file_size and
        sha256 without parsing the contents.
  summary_ref: "<log-file-download-verification-summary-ref>"
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
  - file_id comes from fw_verify_log_download_task.
postconditions:
  - The log file bytes are written to output_path and file_size/sha256 are reported.
tags:
  - firewall
  - log
  - export
  - download
aliases:
  - log-file-download
  - download-log-file
  - downloadfile-log
since_version: "1.18.0"
