schema_version: "1.1"
op_id: fw_clear_ips_log
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_clear_ips_log
description: Clear IPS security logs through DELETE /api/v1/deletelog?logtype=ipslog.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  logtype:
    type: string
    required: false
    description: Log type to clear; the user-confirmed scope implements ipslog only.
inputs:
  session_ref: "<session-ref>"
  logtype: ipslog
side_effect: irreversible
returns:
  status: success
  data:
    cleared: true
    logtype: ipslog
    config_result:
      status: succeeded
      config_domain: log_management
      applied_ref: "<ips-log-clear-result-ref>"
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
rollback_strategy:
  type: irreversible
  snapshot_required: false
  required_inputs:
    - logtype
  notes: Cleared logs cannot be restored by this repository; recovery depends on device-side backups.
dry_run_supported: true
risk_level: high
timeout_ms: 60000
error_types:
  - NONE
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - logging
    - destructive
gate:
  required: true
  reason: Clearing IPS logs irreversibly removes security evidence and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
  - Gate evidence exists before this irreversible log clear is used.
postconditions:
  - The device accepts the DELETE; cleared logs are not recoverable through this repository.
  - logtype is currently limited to ipslog.
tags:
  - firewall
  - ips
  - log
  - clear
  - destructive
aliases:
  - clear-ips-log
  - delete-ips-log
  - log-clear
  - seclog-clear
since_version: "1.18.0"
