schema_version: '1.1'
op_id: fw_delete_ipsec_policy
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_ipsec_policy
description: Delete an NGFW IPsec policy by name through DELETE /api/v1/ipsec?id=<name>.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be ipsec for this operation.
  params:
    type: json
    required: true
    description: IPsec policy delete selector. The device takes the policy name as the id query value (DELETE /api/v1/ipsec?id=<name>) and sends no JSON body.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: <state-ref>
  session_ref: <session-ref>
  config_domain: ipsec
  params:
    id: p2mp
  idempotency_key: <idempotency-key>
side_effect: destructive
returns:
  status: success
  data:
    ipsec_policy_id: p2mp
    pre_snapshot_ref: <ipsec-policy-pre-delete-snapshot-ref>
    config_result:
      status: succeeded
      config_domain: ipsec
      applied_ref: <ipsec-policy-delete-result-ref>
    state_ref: <state-ref>
    state_status: valid
    expires_at: null
    manual_handling_ref: <manual-handling-ref>
  error_type: NONE
  diag_snapshot_ref: <diag-snapshot-ref>
idempotent: false
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
  - ipsec_policy_id
  - full_config
  notes: Recreate the policy from the pre-delete snapshot taken with fw_verify_ipsec_policy. GET /api/v1/ipsec lists policies keyed by name and echoes no id field, so the snapshot record is matched on name while the replayed PUT envelope carries the policy name as its id; name also stays inside val because the device contract requires it there. Deletion is irreversible in practice when no snapshot was captured, so use this op as a cleanup action that does not trigger rollback.
pre_snapshot:
  op_id: fw_verify_ipsec_policy
  capture_fields:
  - ipsec_policy_id
  - full_config
rollback_apply:
  op_id: fw_config_ipsec_policy
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_ipsec_policy
  expected_state: absent
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
- NONE
- STATE_INVALID
- VALIDATION_FAILED
- GATE_MISSING
- CONFIG_REJECTED
- DEVICE_UNREACHABLE
- UNKNOWN_ERROR
risk:
  level: high
  categories:
  - configuration
  - capacity_domain
gate:
  required: true
  reason: IPsec policy deletion tears down a tunnel for matching traffic and requires review.
  approver_role: change_reviewer
  evidence_required:
  - approved_change_record
  - state_reference
  - parameter_digest
preconditions:
- External orchestration holds a valid state_ref or session_ref.
- Gate evidence exists before this high-risk IPsec policy deletion is used.
- The id is the policy name, passed as the id query value and not as a JSON body.
postconditions:
- IPsec policy deletion result and diagnostic references are available to the caller.
- A follow-up fw_verify_ipsec_policy query can confirm the deleted policy name is absent.
tags:
- firewall
- capacity
- ipsec
- configuration
aliases:
- ipsec
- ipsec-policy
- ipsec-tunnel
since_version: 1.6.0
