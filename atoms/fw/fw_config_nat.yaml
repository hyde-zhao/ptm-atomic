schema_version: "1.1"
op_id: fw_config_nat
device_type: fw
description: >-
  Deprecated since 1.6.0; superseded by fw_config_nat_snat, fw_config_nat_dnat,
  and fw_config_nat_static.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be nat for this operation.
  params:
    type: json
    required: true
    description: NAT configuration object with required domain fields.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: nat
  params:
    nat_rule_ref: "<nat-rule-ref>"
    source_ref: "<source-ref>"
    translated_ref: "<translated-ref>"
    direction: outbound
  idempotency_key: "<idempotency-key>"
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: nat
      applied_ref: "<nat-config-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: NAT changes can alter address translation behavior and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk configuration contract is used.
postconditions:
  - Configuration result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - nat
  - configuration
aliases:
  - network-address-translation
deprecated: true
deprecated_by: fw_config_nat_snat
since_version: "1.1.0"
