schema_version: "1.1"
op_id: fw_delete_batch_ips_rule
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_batch_ips_rule
description: Batch-delete custom IPS rules through /api/v1/batch.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be ips_rule for this operation.
  ids:
    type: list
    required: true
    description: >-
      Non-empty list of numeric IPS rule ids. The runner emits one
      DELETE /api/v1/appsec/ips/rules batch item per id, matching the captured
      Web UI request.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  session_ref: "<session-ref>"
  config_domain: ips_rule
  ids:
    - "9708128"
    - "8207295"
  idempotency_key: "<idempotency-key>"
side_effect: destructive
returns:
  status: success
  data:
    batch_result:
      status: succeeded
      count: 2
      success_count: 2
      failed_count: 0
      failed: []
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - ids
    - full_config
  notes: Recreate each removed rule from its full pre-delete snapshot.
pre_snapshot:
  op_id: fw_verify_ips_rule
  capture_fields:
    - rule_ids
    - full_config
  notes: Capture every selected rule (name, desc and isProfenal) before the batch delete.
rollback_apply:
  op_id: fw_config_ips_rule
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_ips_rule
  expected_state: absent
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - BATCH_PARTIAL_FAILED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - security_domain
    - batch_configuration
    - destructive
gate:
  required: true
  reason: Bulk IPS rule deletion removes intrusion-detection coverage and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - Every requested rule id exists and is not required by a protection profile.
  - Gate evidence exists before this high-risk deletion contract is used.
postconditions:
  - The device returns a BatchResult list with one entry per requested id.
  - A follow-up fw_verify_ips_rule selected-id query confirms the rules are absent.
tags:
  - firewall
  - ips
  - rule
  - batch
  - delete
aliases:
  - ips
  - ips-rule
  - intrusion-prevention
  - intrusion-prevention-rule
  - signature-rule
  - snort-rule
since_version: "1.16.0"
