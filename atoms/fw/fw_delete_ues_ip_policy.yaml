schema_version: "1.1"
op_id: fw_delete_ues_ip_policy
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_ues_ip_policy
description: Delete an NGFW UES IP promotion policy by id.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be ues_ip_policy for this operation.
  params:
    type: json
    required: true
    description: UES IP promotion-policy delete selector with id; DELETE sends no JSON body.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: ues_ip_policy
  params:
    id: 2
  idempotency_key: "<idempotency-key>"
side_effect: destructive
returns:
  status: success
  data:
    ip_policy_id: 2
    pre_snapshot_ref: "<ues-ip-policy-pre-delete-snapshot-ref>"
    config_result:
      status: succeeded
      config_domain: ues_ip_policy
      applied_ref: "<ues-ip-policy-delete-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: false
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - ip_policy_id
    - full_config
  notes: Recreate the UES IP promotion-policy object from the full pre-delete snapshot.
pre_snapshot:
  op_id: fw_verify_ues_ip_policy
  capture_fields:
    - ip_policy_id
    - full_config
rollback_apply:
  op_id: fw_config_ues_ip_policy
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_ues_ip_policy
  expected_state: absent
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - ues_integration
gate:
  required: true
  reason: UES promotion-policy deletion removes user-facing traffic behavior and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk configuration contract is used.
  - DELETE must use id as a query value and must not send a JSON body.
postconditions:
  - UES promotion-policy deletion result and diagnostic references are available to the caller.
  - A follow-up fw_verify_ues_ip_policy query can confirm the deleted policy is absent.
tags:
  - firewall
  - ues
  - ip_policy
  - configuration
aliases:
  - ues-promotion-policy
  - promotion-policy
  - ues-ippolicy
since_version: "1.7.0"
