schema_version: "1.1"
op_id: fw_update_policy_route
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_update_policy_route
description: Update an IPv4 or IPv6 NGFW policy route by id.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be policy_route for this operation.
  params:
    type: json
    required: true
    description: Policy route update object with matching top-level id and val.id, type, match fields, and forwarding path. The forwarding path requires next_hop_ip or outgoing_interface; next_hop_ip must match the selected IP version when provided. applist (list of {appname, appid}) and app_tag_name (list of tag names) are optional application match criteria; omit to match no application. ip_link_name is an optional IP-link object name; when provided, forwarding_paths[].health_check becomes {"type":"iplink","name":"<ip_link_name>"}.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: policy_route
  params:
    id: 1
    type: ipv6
    in_interface: any
    source_network: any
    source_network_is_group: false
    dst_network: any
    dst_network_is_group: false
    service: any
    service_is_group: false
    active: true
    next_hop_ip: "2091::1"
    outgoing_interface: ""
    weight: 100
    time_obj: ""
    action: 1
    config_source: 0
    applist:
      - appname: "UDP应用"
        appid: "479"
    app_tag_name:
      - "限速应用"
    ip_link_name: "13-96"
  idempotency_key: "<idempotency-key>"
side_effect: state_mutation
returns:
  status: success
  data:
    policy_route_id: 1
    pre_snapshot_ref: "<policy-route-pre-snapshot-ref>"
    config_result:
      status: succeeded
      config_domain: policy_route
      applied_ref: "<policy-route-update-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - policy_route_id
    - full_config
  notes: Restore the complete pre-change policy-route object, not only the modified fields.
pre_snapshot:
  op_id: fw_verify_policy_route
  capture_fields:
    - policy_route_id
    - full_config
rollback_apply:
  op_id: fw_update_policy_route
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_policy_route
  expected_state: equals_pre_snapshot
dry_run_supported: true
risk_level: high
timeout_ms: 30000
# ── 幂等修改契约口径（2026-09-21 补齐 error_types，与 CT-REM-ATOM-DELETE 同构）──
# `idempotent: true` 表达「回滚 restore_snapshot 恢复配置时对象已不存在 ⇒ 无物可
#   恢复 ⇒ 目标状态已达成」，不构成残留。2026-09-21 实测设备原文：
#   HTTP 400 ePolicyRouteIdNotExist「修改ipv4策略路由1失败，策略路由不存在」
# 此前本文件只有 `idempotent: true` 而无 RESOURCE_NOT_FOUND 枚举、且不在 runner
#   登记表内 ⇒ 属「只具其一的声明」却因反向检查（漏登记）只在声明面注入时可用而
#   静默通过（策略配置 run-20260921-174814 实测 3 条 CLEANUP_FAILED 假阳性）。
# 执行期负例不受影响：运行时代码仍为 RUNNER_CONFIG_REJECTED（exit 48），
#   仅 details 增幂等键。
# ────────────────────────────────────────────────────────────────────────────
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - RESOURCE_NOT_FOUND
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Policy route updates can alter traffic forwarding and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk configuration contract is used.
  - The update request must carry the same route id in both the top-level id field and val.id; otherwise the device rejects it as a route ID change.
postconditions:
  - Policy route update result and diagnostic references are available to the caller.
  - A follow-up fw_verify_policy_route query can confirm the device route state.
tags:
  - firewall
  - capacity
  - policy_route
  - configuration
aliases:
  - ipv6-route
  - ipv6
  - pbr
  - policy-based-routing
since_version: "1.2.0"
