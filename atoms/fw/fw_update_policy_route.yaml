schema_version: "1.1"
op_id: fw_update_policy_route
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_update_policy_route
description: Update an IPv4 or IPv6 NGFW policy route by id.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be policy_route for this operation.
  params:
    type: json
    required: true
    description: Policy route update object with id, type, match fields, and forwarding path.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: policy_route
  params:
    id: 1
    type: ipv6
    in_interface: any
    source_network: any
    source_network_is_group: false
    dst_network: any
    dst_network_is_group: false
    service: any
    service_is_group: false
    active: true
    next_hop_ip: "2091::1"
    outgoing_interface: ""
    weight: 100
    time_obj: ""
    action: 1
    config_source: 0
  idempotency_key: "<idempotency-key>"
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: policy_route
      applied_ref: "<policy-route-update-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Policy route updates can alter traffic forwarding and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk configuration contract is used.
postconditions:
  - Policy route update result and diagnostic references are available to the caller.
  - A follow-up fw_verify_policy_route query can confirm the device route state.
tags:
  - firewall
  - capacity
  - policy_route
  - configuration
since_version: "1.2.0"
