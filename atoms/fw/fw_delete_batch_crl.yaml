schema_version: "1.1"
op_id: fw_delete_batch_crl
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_batch_crl
description: Batch-delete CRL certificates by id through /api/v1/batch on /api/v1/cert/certcrl.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be crl for this operation.
  ids:
    type: list
    required: true
    description: Non-empty list of CRL entry ids to delete in one batch request.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  session_ref: "<session-ref>"
  config_domain: crl
  ids:
    - "1"
  idempotency_key: "<idempotency-key>"
side_effect: destructive
returns:
  status: success
  data:
    batch_result:
      status: succeeded
      count: 1
      success_count: 1
      failed_count: 0
      failed: []
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - cert_name
    - full_config
  notes: Re-register the CRL from the source file captured before the delete; the device keeps no copy once the entry is gone.
pre_snapshot:
  op_id: fw_verify_crl
  capture_fields:
    - id
    - name
    - full_config
  notes: Capture the entry id and registered name before the batch delete; the source .crl file must still be available to restore it.
rollback_apply:
  op_id: fw_config_crl
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_crl
  expected_state: absent
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - BATCH_PARTIAL_FAILED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - certificate
    - batch_configuration
    - destructive
gate:
  required: true
  reason: Removing CRL entries un-revokes every certificate the list covered and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - The listed CRL entries exist and the source .crl file is retained for a possible restore.
  - Gate evidence exists before this high-risk configuration contract is used.
postconditions:
  - Every requested id is gone from the device CRL list.
  - Any failed check is reported for manual handling.
tags:
  - firewall
  - certificate
  - crl
  - batch
  - delete
aliases:
  - crl
  - certificate-revocation-list
  - certcrl
  - delete-crl
since_version: "1.13.0"
