schema_version: "1.1"
op_id: fw_delete_ospfv3_interface
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_ospfv3_interface
description: Delete an NGFW OSPFv3 interface entry by id.
parameters:
  params:
    type: json
    required: true
    description: OSPFv3 interface delete object with id field.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: ospfv3_interface
      applied_ref: "<ospfv3-interface-delete-result-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
timeout_ms: 30000
error_types: [NONE, VALIDATION_FAILED, GATE_MISSING, CONFIG_REJECTED, DEVICE_UNREACHABLE, UNKNOWN_ERROR]
risk:
  level: high
  categories: [configuration, routing]
gate:
  required: true
  reason: OSPFv3 interface deletion removes adjacency participation and requires review.
  approver_role: change_reviewer
  evidence_required: [approved_change_record, parameter_digest]
preconditions:
  - Gate evidence exists before this high-risk routing configuration is used.
postconditions:
  - OSPFv3 interface deletion result is available to the caller.
tags: [firewall, ospfv3, routing, configuration]
since_version: "1.2.0"
