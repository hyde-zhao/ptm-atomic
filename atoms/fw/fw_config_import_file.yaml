schema_version: "1.1"
op_id: fw_config_import_file
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_config_import_file
description: Import an NGFW configuration file through the async /api/v1/uploadfile workflow.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be config_file for this operation.
  moduletype:
    type: string
    required: true
    description: NGFW import module type, e.g. systemconfig. Open string; other module types are passed through unchanged.
  filetype:
    type: string
    required: true
    description: Import archive type, e.g. tgz.
  operationtype:
    type: string
    required: true
    description: Import merge strategy, e.g. override.
  input_path:
    type: string
    required: true
    description: Local filesystem path of the file to upload.
  chunkornot:
    type: bool
    required: false
    description: Whether the upload is chunked; defaults to false.
  poll_timeout_ms:
    type: int
    required: false
    description: Upper bound for the upload task polling loop in milliseconds.
  poll_interval_ms:
    type: int
    required: false
    description: Sleep between upload task polling attempts in milliseconds.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: config_file
  moduletype: systemconfig
  filetype: tgz
  operationtype: override
  input_path: /tmp/systemconfig.tgz
  chunkornot: false
  poll_timeout_ms: 60000
  poll_interval_ms: 2000
  idempotency_key: "<idempotency-key>"
side_effect: state_mutation
returns:
  status: success
  data:
    moduletype: systemconfig
    upload_task_id: 1
    import_confirmed: true
    havefile: true
    pre_snapshot_ref: "<config-pre-import-snapshot-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: false
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - moduletype
    - full_config
  notes: Restore the pre-import configuration by exporting it first and re-importing the snapshot if the override is wrong.
pre_snapshot:
  op_id: fw_config_export_file
  capture_fields:
    - moduletype
    - full_config
rollback_apply:
  op_id: fw_config_import_file
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_ngfw_health
  expected_state: reachable
dry_run_supported: true
risk_level: high
timeout_ms: 120000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Importing a configuration file can overwrite the running configuration and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk configuration import is used.
  - A reboot via fw_config_reboot is required after import for the configuration to take effect.
postconditions:
  - Import task completion and importfile confirmation references are available to the caller.
  - The device must be rebooted with fw_config_reboot before the imported configuration takes effect.
tags:
  - firewall
  - capacity
  - config_file
  - configuration
aliases:
  - import-config
  - restore-config
  - systemconfig-import
  - override-config
since_version: "1.6.0"
