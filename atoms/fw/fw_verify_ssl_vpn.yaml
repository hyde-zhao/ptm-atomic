schema_version: "1.1"
op_id: fw_verify_ssl_vpn
device_type: fw
description: Verify SSL VPN configuration contract result for NGFW capacity operations.
parameters:
  config_result_ref:
    type: string
    required: false
    description: Non-sensitive reference to the related configuration result.
  config_result:
    type: json
    required: false
    description: Inline non-sensitive configuration result envelope.
  verification_rules:
    type: list
    required: true
    description: Rules used to check SSL VPN configuration state.
  expected_vpn_profile_ref:
    type: string
    required: true
    description: Expected VPN profile reference.
inputs:
  state_ref: "<state-ref>"
  config_result_ref: "<ssl-vpn-config-result-ref>"
  config_domain: ssl_vpn
returns:
  status: success
  data:
    verification_summary_ref: "<ssl-vpn-verification-summary-ref>"
    verification_status: passed
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_RESULT_MISSING
  - STATE_MISMATCH
  - MANUAL_HANDLING_REQUIRED
verification:
  kind: capacity_domain
  rules:
    - name: ssl_vpn_state_matches
      input_ref: "<ssl-vpn-config-result-ref>"
      expected_result: VPN profile, user group, portal, and policy references match
  summary_ref: "<ssl-vpn-verification-summary-ref>"
preconditions:
  - A related SSL VPN configuration result reference is available.
postconditions:
  - Verification summary and diagnostic references are available to the caller.
  - Any failed check is reported for manual handling.
tags:
  - firewall
  - capacity
  - ssl_vpn
  - verification
since_version: "1.1.0"
