schema_version: "1.1"
op_id: fw_verify_session
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_verify_session
description: Query NGFW session table entries (IPv4 or IPv6) with optional filter conditions.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  page:
    type: int
    required: false
    description: Query page number (default 1).
  size:
    type: int
    required: false
    description: Query page size (default 40).
  is_ip6:
    type: bool
    required: false
    description: false queries IPv4 sessions and true queries IPv6 sessions.
  proto:
    type: string
    required: false
    description: Protocol filter, e.g. ANY, UDP, TCP.
  src_addr:
    type: string
    required: false
    description: Source address filter.
  dst_addr:
    type: string
    required: false
    description: Destination address filter.
  src_port:
    type: int
    required: false
    description: Source port filter (0 = no filter).
  dst_port:
    type: int
    required: false
    description: Destination port filter (0 = no filter).
  rx_zone:
    type: string
    required: false
    description: Ingress (source) security zone filter.
  tx_zone:
    type: string
    required: false
    description: Egress (destination) security zone filter.
  rx_if:
    type: string
    required: false
    description: Ingress interface filter.
  tx_if:
    type: string
    required: false
    description: Egress interface filter.
  action:
    type: string
    required: false
    description: Session action filter (permit/deny).
inputs:
  session_ref: "<session-ref>"
  page: 1
  size: 40
  is_ip6: false
  proto: ANY
  src_addr: "0:0::0"
  dst_addr: "0:0::0"
  src_port: 0
  dst_port: 0
  rx_zone: ""
  tx_zone: ""
  rx_if: ""
  tx_if: ""
  action: ""
side_effect: observation
returns:
  status: success
  data:
    verification_summary_ref: "<session-verification-summary-ref>"
    verification_status: passed
    count: 0
    sessions: "<session-entry-list>"
    session_zones: "<session-zone-pair-list>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
dry_run_supported: true
risk_level: low
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_RESULT_MISSING
  - STATE_MISMATCH
verification:
  kind: capacity_domain
  rules:
    - name: session_query_returns_zone_fields
      input_ref: "<session-query-result-ref>"
      expected_result: Session entries expose rxzone (ingress zone) and txzone (egress zone) fields used for security-zone assertions.
  summary_ref: "<session-verification-summary-ref>"
preconditions:
  - External orchestration holds a valid session_ref.
  - At least one session exists for the requested address family, or empty result is acceptable.
postconditions:
  - Session query result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - session
  - monitor
  - verification
aliases:
  - session-table
  - sessioninfo
  - session-monitor
since_version: "1.1.0"
