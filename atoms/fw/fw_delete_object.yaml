schema_version: "1.1"
op_id: fw_delete_object
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_object
description: Delete an NGFW address object by name through /api/v1/ippool.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be object for this operation.
  params:
    type: json
    required: true
    description: Address-object delete selector with id query value; DELETE sends no JSON body.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: object
  params:
    id: atomicSrc1921680016
  idempotency_key: "<idempotency-key>"
side_effect: destructive
returns:
  status: success
  data:
    object_name: atomicSrc1921680016
    pre_snapshot_ref: "<object-pre-delete-snapshot-ref>"
    config_result:
      status: succeeded
      config_domain: object
      applied_ref: "<object-delete-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
# ── 幂等删除契约口径（CT-REM-ATOM-DELETE；只收敛口径，不新增字段）──────────────
# `idempotent`（语义键）：true = 重复执行收敛到同一目标状态；对删除 op 特指
#   「目标对象不存在 = 目标状态已达成」—— 创建步回滚与用例清理步会**重复删除同一
#   对象**，第二次必然报「不存在」。2026-09-20 实测设备原文：
#   HTTP 400 eObjGetNoExist「Couldn't found OBJ-SRC-192 from DB」
# `error_types`（错误枚举）：其中 RESOURCE_NOT_FOUND 在 `idempotent: true` 前提下
#   表达「目标已不存在」，**不构成残留**。
# 二者必须**同时成立**；只具其一的声明视为口径不一致 —— 由 runner 侧
#   `validate_idempotent_registry()` 显式报错，不得静默按「非幂等」处理。
# 消费方判定式（cleanup_failed / exit 9 判定读统一键）：回滚信封
#   `details.error_type == "RESOURCE_NOT_FOUND"` 且 `details.idempotent == true`
#   同时成立 → 判「幂等成功」，不计入 cleanup_failed；未命中则维持既有
#   CLEANUP_FAILED 归一（真残留保真）。不得据此归一「被引用」类拒绝
#   （反例：eIntfisRefed「该接口已被引用」= 真失败 —— 与「不存在」是不同的 errCode）。
# ────────────────────────────────────────────────────────────────────────────
idempotent: true
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - object_name
    - full_config
  notes: Recreate the address object from the full pre-delete snapshot.
pre_snapshot:
  op_id: fw_verify_object
  capture_fields:
    - object_name
    - full_config
rollback_apply:
  op_id: fw_config_object
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_object
  expected_state: exists
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - RESOURCE_NOT_FOUND
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Address-object deletion removes a referenced capacity object and may affect policy matching; requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk address-object deletion is used.
  - DELETE must use id as a query value and must not send a JSON body.
postconditions:
  - Address-object deletion result and diagnostic references are available to the caller.
  - A follow-up fw_verify_object query can confirm the deleted object is absent.
tags:
  - firewall
  - capacity
  - object
  - configuration
aliases:
  - address-object
  - service-object
  - ip-pool
  - ippool
since_version: "1.6.0"
