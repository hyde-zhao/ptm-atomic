schema_version: "1.1"
op_id: fw_update_localcert
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_update_localcert
description: Update or issue (sign) an NGFW local certificate through /api/v1/cert/localcert.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be cert_localcert for this operation.
  params:
    type: json
    required: true
    description: Complete /api/v1/cert/localcert payload for update (name/subject/option) or issue (option/cacert/timeLenth) with the numeric id.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: cert_localcert
  params:
    id: 5
    val:
      option: "1"
      cacert: defaultLocalCA.crt
      timeLenth: 30
  idempotency_key: "<idempotency-key>"
side_effect: state_mutation
returns:
  status: success
  data:
    object_name: atomicLocalCert
    pre_snapshot_ref: "<localcert-pre-snapshot-ref>"
    config_result:
      status: succeeded
      config_domain: cert_localcert
      applied_ref: "<localcert-update-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - name
    - full_config
  notes: Restore the original local certificate definition from the pre-update snapshot; issuance is one-way and manual handling may be required.
pre_snapshot:
  op_id: fw_verify_localcert
  capture_fields:
    - name
    - full_config
rollback_apply:
  op_id: fw_update_localcert
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_localcert
  expected_state: equals_pre_snapshot
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Local certificate update or issuance changes the device trust material and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk local certificate update is used.
  - The issue variant requires the pending certificate numeric id and a valid CA certificate name.
postconditions:
  - Local certificate update result and diagnostic references are available to the caller.
  - Issued certificates carry a one-way state transition; manual handling may be required on rollback.
tags:
  - firewall
  - capacity
  - cert
  - configuration
aliases:
  - local-certificate
  - issue-certificate
  - sign-certificate
  - cert-issue
since_version: "1.11.0"
