schema_version: "1.1"
op_id: fw_verify_dynamic_routing
device_type: fw
description: Verify dynamic routing configuration contract result for NGFW capacity.
parameters:
  config_result_ref:
    type: string
    required: false
    description: Non-sensitive reference to the related configuration result.
  config_result:
    type: json
    required: false
    description: Inline non-sensitive configuration result envelope.
  verification_rules:
    type: list
    required: true
    description: Rules used to check dynamic routing configuration state.
  expected_protocol:
    type: string
    required: true
    description: Expected dynamic routing protocol.
inputs:
  state_ref: "<state-ref>"
  config_result_ref: "<dynamic-routing-config-result-ref>"
  config_domain: dynamic_routing
returns:
  status: success
  data:
    verification_summary_ref: "<dynamic-routing-verification-summary-ref>"
    verification_status: passed
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_RESULT_MISSING
  - STATE_MISMATCH
  - MANUAL_HANDLING_REQUIRED
verification:
  kind: capacity_domain
  rules:
    - name: dynamic_routing_state_matches
      input_ref: "<dynamic-routing-config-result-ref>"
      expected_result: protocol, neighbor, area, and route policy references match
  summary_ref: "<dynamic-routing-verification-summary-ref>"
preconditions:
  - A related dynamic routing configuration result reference is available.
postconditions:
  - Verification summary and diagnostic references are available to the caller.
  - Any failed check is reported for manual handling.
tags:
  - firewall
  - capacity
  - dynamic_routing
  - verification
since_version: "1.1.0"
