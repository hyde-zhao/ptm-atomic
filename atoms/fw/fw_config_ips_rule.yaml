schema_version: "1.1"
op_id: fw_config_ips_rule
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_config_ips_rule
description: Create a custom IPS rule through /api/v1/appsec/ips/rules.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be ips_rule for this operation.
  params:
    type: json
    required: true
    description: >-
      IPS rule create object. name is required for ordinary custom rules;
      desc carries the raw Snort-style rule text and must be non-empty;
      isProfenal selects the protection-rule form captured from the Web UI.
      When isProfenal is true the device derives the displayed name from the
      rule text and accepts an empty name; otherwise name must be non-empty.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: ips_rule
  params:
    name: test1
    desc: 'alert tcp 1.1.1.1 1000 -> 2.2.2.2 2000 ( msg:"test1"; dsize:>256; content:"abcdef"; rev:100; )'
    isProfenal: false
  idempotency_key: "<idempotency-key>"
side_effect: state_mutation
returns:
  status: success
  data:
    ips_rule_id: "<ips-rule-id>"
    ips_rule_name: "<ips-rule-name>"
    created: true
    config_result:
      status: succeeded
      config_domain: ips_rule
      applied_ref: "<ips-rule-config-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
rollback_strategy:
  type: inverse_op
  op_id: fw_delete_ips_rule
  snapshot_required: false
  required_inputs:
    - ips_rule_id
  id_source: response
  id_field: ips_rule_id
  notes: >-
    Delete only when the create result reports created=true. The create
    response carries the new rule id in vals[0].Id; the runner exposes it as
    ips_rule_id. Pre-existing rules must not be deleted by default.
pre_snapshot:
  op_id: fw_verify_ips_rule
  capture_fields:
    - rule_ids
post_verify:
  op_id: fw_verify_ips_rule
  expected_state: present
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - security_domain
gate:
  required: true
  reason: IPS rules change intrusion-detection and prevention behaviour and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk configuration contract is used.
  - desc contains a non-empty Snort-style rule body; isProfenal selects the protection-rule form.
postconditions:
  - The device returns vals[0].Id and vals[0].Name for the created rule; the runner exposes the id as ips_rule_id.
  - A follow-up fw_verify_ips_rule query can confirm the new rule and its attributes.
tags:
  - firewall
  - ips
  - rule
  - configuration
aliases:
  - ips
  - ips-rule
  - intrusion-prevention
  - intrusion-prevention-rule
  - signature-rule
  - snort-rule
since_version: "1.16.0"
