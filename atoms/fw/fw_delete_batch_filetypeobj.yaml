schema_version: "1.1"
op_id: fw_delete_batch_filetypeobj
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_batch_filetypeobj
description: Delete multiple NGFW file type groups through /api/v1/batch.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be appsec_filetypeobj for this operation.
  params:
    type: json
    required: true
    description: Batch delete request with DELETE /api/v1/appsec/filetypeObj items.
inputs:
  session_ref: "<session-ref>"
  config_domain: appsec_filetypeobj
  params:
    batch:
      - method: DELETE
        resource: /api/v1/appsec/filetypeObj
        body:
          id:
            - fileTypeGroup1
      - method: DELETE
        resource: /api/v1/appsec/filetypeObj
        body:
          id:
            - fileTypeGroup2
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: appsec_filetypeobj
      applied_ref: "<filetypeobj-batch-delete-result-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: false
timeout_ms: 60000
error_types:
  - NONE
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - BATCH_PARTIAL_FAILED
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
    - batch_configuration
gate:
  required: true
  reason: Batch file type-group deletion can remove multiple referenced capacity objects and affect application identification; requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
    - concurrency_review
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
  - Batch body contains only DELETE /api/v1/appsec/filetypeObj items.
postconditions:
  - Batch file type-group deletion result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - filetypeobj
  - batch_configuration
aliases:
  - file-type-group
  - appsec-filetype-group
  - filetype-obj
  - bulk
since_version: "1.11.0"
