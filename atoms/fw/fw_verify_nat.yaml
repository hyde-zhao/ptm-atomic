schema_version: "1.1"
op_id: fw_verify_nat
device_type: fw
description: >-
  Deprecated since 1.6.0; superseded by fw_verify_nat_snat, fw_verify_nat_dnat,
  and fw_verify_nat_static.
parameters:
  config_result_ref:
    type: string
    required: false
    description: Non-sensitive reference to the related configuration result.
  config_result:
    type: json
    required: false
    description: Inline non-sensitive configuration result envelope.
  verification_rules:
    type: list
    required: true
    description: Rules used to check NAT configuration state.
  expected_nat_rule_ref:
    type: string
    required: true
    description: Expected NAT rule reference.
inputs:
  state_ref: "<state-ref>"
  config_result_ref: "<nat-config-result-ref>"
  config_domain: nat
returns:
  status: success
  data:
    verification_summary_ref: "<nat-verification-summary-ref>"
    verification_status: passed
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_RESULT_MISSING
  - STATE_MISMATCH
  - MANUAL_HANDLING_REQUIRED
verification:
  kind: capacity_domain
  rules:
    - name: nat_state_matches
      input_ref: "<nat-config-result-ref>"
      expected_result: NAT rule, source, translated reference, and direction match
  summary_ref: "<nat-verification-summary-ref>"
preconditions:
  - A related NAT configuration result reference is available.
postconditions:
  - Verification summary and diagnostic references are available to the caller.
  - Any failed check is reported for manual handling.
tags:
  - firewall
  - capacity
  - nat
  - verification
aliases:
  - network-address-translation
deprecated: true
deprecated_by: fw_verify_nat_snat
since_version: "1.1.0"
