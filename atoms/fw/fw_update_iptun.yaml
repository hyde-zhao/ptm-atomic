schema_version: "1.1"
op_id: fw_update_iptun
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_update_iptun
description: Update an NGFW IP tunnel entry through /api/v1/iptun.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be iptun for this operation.
  params:
    type: json
    required: true
    description: Complete /api/v1/iptun payload for tunnel update with id and val.name identifying the target.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: iptun
  params:
    id: tunnel1
    val:
      name: tunnel1
      type: 15
      enabled: true
      level: 100
      ip_addresses:
        - 13.0.0.1/24
      ipip:
        src_addr: 2001::1
        dst_addr: 2001::2
  idempotency_key: "<idempotency-key>"
side_effect: state_mutation
returns:
  status: success
  data:
    iptun_name: tunnel1
    pre_snapshot_ref: "<iptun-pre-snapshot-ref>"
    config_result:
      status: succeeded
      config_domain: iptun
      applied_ref: "<iptun-update-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - iptun_name
    - full_config
  notes: Restore the original IP tunnel definition from the pre-update snapshot.
pre_snapshot:
  op_id: fw_verify_iptun
  capture_fields:
    - iptun_name
    - full_config
rollback_apply:
  op_id: fw_update_iptun
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_iptun
  expected_state: equals_pre_snapshot
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: IP tunnel updates can change traffic reachability and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk IP tunnel configuration is used.
postconditions:
  - IP tunnel update result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - iptun
  - configuration
aliases:
  - ip-tunnel
  - ipip
  - gre
  - 4over6
  - 6over4
  - tunnel
since_version: "1.5.0"
