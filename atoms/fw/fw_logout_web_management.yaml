schema_version: "1.1"
op_id: fw_logout_web_management
device_type: fw
description: Define the NGFW web management logout contract that invalidates a session reference.
parameters:
  management_endpoint_ref:
    type: string
    required: true
    description: Non-sensitive reference to the management endpoint context.
  session_ref:
    type: string
    required: true
    description: Non-sensitive session reference to invalidate.
credential_ref:
  kind: external_session_ref
  ref: "<session-ref>"
returns:
  status: success
  data:
    logout_status: invalidated
    session_ref: "<session-ref>"
    state_status: logged_out
  error_type: LOGOUT_FAILED
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
timeout_ms: 10000
error_types:
  - LOGOUT_FAILED
  - MANAGEMENT_ENDPOINT_UNAVAILABLE
  - STATE_REFERENCE_INVALID
  - TIMEOUT
risk:
  level: low
  categories:
    - authentication
    - session_state
    - management_plane
gate:
  required: false
  reason: Web management logout invalidates an existing session reference; low-risk and does not require approval.
  approver_role: none
  evidence_required: []
verification:
  kind: session_state
  rules:
    - name: session_reference_invalidated
      input_ref: "<session-ref>"
      expected_result: session reference is no longer valid after logout
  summary_ref: "<logout-state-summary-ref>"
preconditions:
  - A valid session reference exists from a prior fw_login_web_management call.
postconditions:
  - The session reference is invalidated on the device.
  - Subsequent operations using this session reference will fail.
tags:
  - firewall
  - ngfw
  - logout
  - session_management
since_version: "1.1.0"
