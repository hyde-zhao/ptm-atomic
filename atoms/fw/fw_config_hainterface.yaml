schema_version: "1.1"
op_id: fw_config_hainterface
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_config_hainterface
description: Add an NGFW HA monitored interface entry through POST /api/v1/hainterface.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be hainterface for this operation.
  params:
    type: json
    required: true
    description: Complete /api/v1/hainterface payload with val.trackIntf identifying the monitored interface.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: hainterface
  params:
    val:
      trackIntf: GE0_1
  idempotency_key: "<idempotency-key>"
side_effect: state_mutation
returns:
  status: success
  data:
    hainterface_track_intf: GE0_1
    config_result:
      status: succeeded
      config_domain: hainterface
      applied_ref: "<hainterface-create-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: HA monitored interface changes can affect HA failover detection and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk HA configuration is used.
postconditions:
  - HA monitored interface creation result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - ha
  - configuration
aliases:
  - ha-interface
  - ha-monitored-interface
since_version: "1.6.0"
