schema_version: "1.1"
op_id: fw_delete_static_dns
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_static_dns
description: Delete a static DNS entry by domain name through DELETE /api/v1/dns/cache?id=<domain>.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be static-dns for this operation.
  params:
    type: json
    required: true
    description: Static DNS delete object with id field (domain name).
inputs:
  session_ref: "<session-ref>"
  config_domain: static-dns
  params:
    id: www.example.com
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: static-dns
      applied_ref: "<static-dns-delete-result-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: false
side_effect: destructive
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - dns
gate:
  required: true
  reason: Removing a static DNS entry can break local and proxied DNS resolution and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
  - The target domain exists in the static DNS table (or the delete semantics of an absent entry are understood).
postconditions:
  - Static DNS entry deletion result and diagnostic references are available to the caller.
  - A follow-up fw_verify_dns_resolution can confirm the entry no longer resolves through the static table.
tags:
  - firewall
  - dns
  - static-dns
  - configuration
aliases:
  - static-dns-delete
  - dns-entry-delete
  - domain-mapping-delete
since_version: "1.9.0"
