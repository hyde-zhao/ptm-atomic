schema_version: "1.1"
op_id: fw_delete_interface
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_interface
description: Delete an NGFW interface entry by id through /api/v1/intf.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be interface for this operation.
  params:
    type: json
    required: true
    description: Interface delete object with id field.
inputs:
  session_ref: "<session-ref>"
  config_domain: interface
  params:
    id: GE0_2.106
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: interface
      applied_ref: "<interface-delete-result-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: false
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Interface deletion can remove connectivity and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
  - The target is a deletable bvi, subinterface, or bond interface.
postconditions:
  - Interface deletion result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - interface
  - configuration
aliases:
  - subinterface
  - trunk
  - lag
  - bond
  - bvi
  - vlan-interface
since_version: "1.3.0"
