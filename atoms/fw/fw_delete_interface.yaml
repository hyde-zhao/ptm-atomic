schema_version: "1.1"
op_id: fw_delete_interface
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_interface
description: Delete an NGFW interface entry by id through /api/v1/intf.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be interface for this operation.
  params:
    type: json
    required: true
    description: Interface delete object with id field.
inputs:
  session_ref: "<session-ref>"
  config_domain: interface
  params:
    id: GE0_2.106
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: interface
      applied_ref: "<interface-delete-result-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
# ── 幂等删除契约口径（CT-REM-ATOM-DELETE；只收敛口径，不新增字段）──────────────
# `idempotent`（语义键）：true = 重复执行收敛到同一目标状态；对删除 op 特指
#   「目标接口不存在 = 目标状态已达成」—— 创建步回滚与用例清理步会**重复删除同一
#   接口**，第二次必然报「不存在」。2026-09-21 实测设备原文：
#   HTTP 400 eIntfGetTypeByName「unknow interface GE0_3.100」
# `error_types`（错误枚举）：其中 RESOURCE_NOT_FOUND 在 `idempotent: true` 前提下
#   表达「目标已不存在」，**不构成残留**。
# 二者必须**同时成立**；只具其一的声明视为口径不一致 —— 由 runner 侧
#   `validate_idempotent_registry()` 显式报错，不得静默按「非幂等」处理。
# 消费方判定式（cleanup_failed / exit 9 判定读统一键）：回滚信封
#   `details.error_type == "RESOURCE_NOT_FOUND"` 且 `details.idempotent == true`
#   同时成立 → 判「幂等成功」，不计入 cleanup_failed；未命中则维持既有
#   CLEANUP_FAILED 归一（真残留保真）。
# 本 op 的**真失败**反例：eIntfisRefed「该接口已被引用」—— 删除确实未完成，
#   与 eIntfGetTypeByName 是不同 errCode，不在 RESOURCE_NOT_FOUND_ERR_CODES 内。
# ────────────────────────────────────────────────────────────────────────────
idempotent: true
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - RESOURCE_NOT_FOUND
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Interface deletion can remove connectivity and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
  - The target is a deletable bvi, subinterface, or bond interface.
postconditions:
  - Interface deletion result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - interface
  - configuration
aliases:
  - subinterface
  - trunk
  - lag
  - bond
  - bvi
  - vlan-interface
since_version: "1.3.0"
