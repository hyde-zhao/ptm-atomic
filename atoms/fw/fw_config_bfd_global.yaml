schema_version: "1.1"
op_id: fw_config_bfd_global
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_config_bfd_global
description: Configure NGFW BFD global enablement.
parameters:
  params:
    type: json
    required: true
    description: BFD global object with id and enable fields.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: bfd_global
      applied_ref: "<bfd-global-config-result-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
timeout_ms: 30000
error_types: [NONE, VALIDATION_FAILED, GATE_MISSING, CONFIG_REJECTED, DEVICE_UNREACHABLE, UNKNOWN_ERROR]
risk:
  level: high
  categories: [configuration, routing]
gate:
  required: true
  reason: BFD global changes can affect fast failure detection and require review.
  approver_role: change_reviewer
  evidence_required: [approved_change_record, parameter_digest]
preconditions:
  - Gate evidence exists before this high-risk routing configuration is used.
postconditions:
  - BFD global configuration result is available to the caller.
tags: [firewall, bfd, routing, configuration]
since_version: "1.2.0"
