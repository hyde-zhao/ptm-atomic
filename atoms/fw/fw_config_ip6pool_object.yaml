schema_version: "1.1"
op_id: fw_config_ip6pool_object
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_config_ip6pool_object
description: Define an IPv6 address object configuration contract for NGFW capacity.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be ip6pool_object for this operation.
  params:
    type: json
    required: true
    description: >-
      IPv6 address object configuration with object name, ipaddr, mask, and optional
      excluded ranges (exclranges) and excluded networks (exclnetworks).
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: ip6pool_object
  params:
    object_type: address
    object_name: atomicSrc2001000064
    ipaddr: "2001::"
    mask: "64"
    object_desc: atomicSrc2001000064
    exclranges: []
    exclnetworks:
      - ipaddr: "2001::1"
        mask: ""
  idempotency_key: "<idempotency-key>"
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: ip6pool_object
      applied_ref: "<ip6pool-object-config-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
side_effect: state_mutation
rollback_strategy:
  type: inverse_op
  op_id: fw_delete_ip6pool_object
  snapshot_required: false
  required_inputs:
    - object_name
  id_source: args
  id_field: object_name
  notes: The IPv6 address-object id is its name; rollback deletes via DELETE /api/v1/ip6pool?id=<object_name>.
pre_snapshot:
  op_id: fw_verify_ip6pool_object
  capture_fields:
    - object_name
    - existence
post_verify:
  op_id: fw_verify_ip6pool_object
  expected_state: absent
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: IPv6 address object changes can affect policy matching and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk configuration contract is used.
postconditions:
  - Configuration result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - ip6pool_object
  - configuration
aliases:
  - ip6pool-object
  - ipv6-address-object
  - ip6-pool
  - ip6pool
since_version: "1.10.0"
