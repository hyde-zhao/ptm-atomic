schema_version: "1.1"
op_id: fw_export_object_data
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_export_object_data
description: Generate an object module export file through GET /api/v1/dataexport?type=<module>.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  module:
    type: string
    required: true
    description: Module type for the export; documented value ip6pool, device-verified on 55.63 also ippool, macpool and geoip.
  output_path:
    type: string
    required: false
    description: Local path where the generated export file is written; the response names the generated exportDir file.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  module: ip6pool
  output_path: /tmp/ip6pool_export.xlsx
  idempotency_key: "<idempotency-key>"
side_effect: observation
returns:
  status: success
  data:
    module_type: ip6pool
    export_file_id: exportDir/ip6pool_20260903_151226.xlsx
    download:
      file_ref: /tmp/ip6pool_export.xlsx
      file_size: 1024
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
dry_run_supported: true
risk_level: medium
timeout_ms: 120000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: medium
  categories:
    - configuration
    - data_management
gate:
  required: true
  reason: Generated export files may contain object data and require review before leaving the device.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
postconditions:
  - An export file is generated when the device supports the flow; the id is parsed from the response when present.
tags:
  - firewall
  - object
  - export
  - data_management
aliases:
  - dataexport
since_version: "1.12.0"
