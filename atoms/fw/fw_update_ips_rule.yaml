schema_version: "1.1"
op_id: fw_update_ips_rule
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_update_ips_rule
description: Update a custom IPS rule by id through /api/v1/appsec/ips/rules.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be ips_rule for this operation.
  params:
    type: json
    required: true
    description: >-
      IPS rule update object with a top-level id and a full val body. The val
      body uses the same name, desc and isProfenal fields as create and
      replaces the stored rule wholesale. The id is the numeric rule id
      returned on create or listed by fw_verify_ips_rule.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: ips_rule
  params:
    id: "5191533"
    name: test5
    desc: 'alert http 6.6.6.6 1 -> 8.8.8.8 30000 ( msg:"test5"; rev:100; )'
    isProfenal: false
  idempotency_key: "<idempotency-key>"
side_effect: state_mutation
returns:
  status: success
  data:
    ips_rule_id: "<ips-rule-id>"
    pre_snapshot_ref: "<ips-rule-pre-snapshot-ref>"
    config_result:
      status: succeeded
      config_domain: ips_rule
      applied_ref: "<ips-rule-update-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - ips_rule_id
    - full_config
  notes: Restore the complete pre-change IPS rule object, not only the modified fields.
pre_snapshot:
  op_id: fw_verify_ips_rule
  capture_fields:
    - rule_ids
    - full_config
  notes: Query the rule by id before update and keep its full val body for restore.
rollback_apply:
  op_id: fw_update_ips_rule
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_ips_rule
  expected_state: equals_pre_snapshot
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - security_domain
gate:
  required: true
  reason: IPS rule updates change intrusion-detection and prevention behaviour and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk configuration contract is used.
  - The rule id must be resolved by fw_verify_ips_rule before update.
postconditions:
  - IPS rule update result and diagnostic references are available to the caller.
  - A follow-up fw_verify_ips_rule query can confirm the updated rule.
tags:
  - firewall
  - ips
  - rule
  - configuration
aliases:
  - ips
  - ips-rule
  - intrusion-prevention
  - intrusion-prevention-rule
  - signature-rule
  - snort-rule
since_version: "1.16.0"
