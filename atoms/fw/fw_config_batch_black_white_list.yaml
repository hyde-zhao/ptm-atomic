schema_version: "1.1"
op_id: fw_config_batch_black_white_list
device_type: fw
description: Define multi-device list batch configuration contract for NGFW capacity.
parameters:
  device_inventory_ref:
    type: string
    required: true
    description: Non-sensitive external device inventory reference.
  device_selector:
    type: json
    required: true
    description: Non-sensitive selector using device_refs or labels.
  batch_ref:
    type: string
    required: true
    description: Non-sensitive batch reference supplied by an external orchestrator.
  batch:
    type: json
    required: true
    description: Batch policy with max_concurrency default 1 and maximum 5.
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be black_white_list for this batch operation.
  params:
    type: json
    required: true
    description: List configuration object with required domain fields.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive batch idempotency key for repeatable intent.
inputs:
  device_inventory_ref: "<device-inventory-ref>"
  device_selector:
    device_ids:
      - "<device-ref-a>"
      - "<device-ref-b>"
    labels:
      role: edge_firewall
    max_selected: 5
  batch_ref: "<batch-ref>"
  batch:
    max_concurrency: 1
    failure_policy: isolate_failed_device
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: black_white_list
  params:
    list_type: allow_list
    entry_ref: "<entry-ref>"
    action: permit
    scope_ref: "<scope-ref>"
  idempotency_key: "<batch-black-white-list-idempotency-key>"
returns:
  status: success
  data:
    batch_status: partial_failed
    per_device_results:
      - device_ref: "<device-ref-a>"
        status: succeeded
        idempotency_key: "<device-a-idempotency-key>"
        config_result_ref: "<device-a-list-config-result-ref>"
        error_type: NONE
        diag_snapshot_ref: "<device-a-diag-snapshot-ref>"
        verification_summary_ref: "<device-a-verification-summary-ref>"
      - device_ref: "<device-ref-b>"
        status: failed
        idempotency_key: "<device-b-idempotency-key>"
        config_result_ref: "<device-b-list-config-result-ref>"
        error_type: CONFIG_REJECTED
        diag_snapshot_ref: "<device-b-diag-snapshot-ref>"
        verification_summary_ref: "<device-b-verification-summary-ref>"
    failed_devices:
      - device_ref: "<device-ref-b>"
        error_type: CONFIG_REJECTED
        diag_snapshot_ref: "<device-b-diag-snapshot-ref>"
        handling_hint: manual_review_required
    verification_summary_ref: "<batch-list-verification-summary-ref>"
  error_type: NONE
  diag_snapshot_ref: "<batch-list-diag-snapshot-ref>"
idempotent: true
timeout_ms: 60000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - BATCH_PARTIAL_FAILED
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
    - batch_configuration
gate:
  required: true
  reason: List batch changes can affect access decisions across multiple firewalls.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - device_inventory_reference
    - parameter_digest
    - concurrency_review
batch:
  max_concurrency: 1
  device_inventory_ref: "<device-inventory-ref>"
  idempotency_key: "<batch-black-white-list-idempotency-key>"
  failure_policy: isolate_failed_device
verification:
  kind: batch_summary
  rules:
    - name: black_white_list_batch_result_counts_match
      input_ref: "<batch-list-verification-summary-ref>"
      expected_result: total, succeeded, failed, and skipped device counts reconcile
  summary_ref: "<batch-list-verification-summary-ref>"
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk batch configuration contract is used.
  - device_inventory_ref and device_selector contain only non-sensitive references.
postconditions:
  - Per-device results, failed device references, and batch verification summary are available.
  - Successful devices are not automatically reverted when another device fails.
tags:
  - firewall
  - capacity
  - black_white_list
  - batch_configuration
aliases:
  - bulk
since_version: "1.1.0"
