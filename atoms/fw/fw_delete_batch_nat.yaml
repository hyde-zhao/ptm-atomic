schema_version: "1.1"
op_id: fw_delete_batch_nat
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_batch_nat
description: Delete multiple NAT rules in one device through /api/v1/batch.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be nat for this operation.
  params:
    type: json
    required: true
    description: >-
      Batch delete request with DELETE items. Each item names the target NAT
      endpoint in resource (/api/v1/natsnat, /api/v1/iterate/natdnat, or
      /api/v1/natstatic) and carries body.id as a non-empty list.
inputs:
  session_ref: "<session-ref>"
  config_domain: nat
  params:
    batch:
      - method: DELETE
        resource: /api/v1/natsnat
        body:
          id:
            - "1"
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: nat
      applied_ref: "<nat-batch-delete-result-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: false
timeout_ms: 60000
error_types:
  - NONE
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - BATCH_PARTIAL_FAILED
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
    - batch_configuration
gate:
  required: true
  reason: Batch NAT deletion can remove multiple translation rules in one request and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
  - Batch body contains only DELETE items targeting the three NAT rule endpoints.
  - Batch operations are scoped to a single device; multi-device orchestration is a separate contract.
postconditions:
  - Batch NAT deletion result and diagnostic references are available to the caller.
  - A follow-up fw_verify_nat_snat, fw_verify_nat_dnat, or fw_verify_nat_static query can confirm the deleted rules are absent.
tags:
  - firewall
  - capacity
  - nat
  - batch_configuration
aliases:
  - nat
  - nat-batch
since_version: "1.6.0"
