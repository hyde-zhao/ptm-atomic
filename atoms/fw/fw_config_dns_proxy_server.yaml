schema_version: "1.1"
op_id: fw_config_dns_proxy_server
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_config_dns_proxy_server
description: Create DNS proxy servers through POST /api/v1/dns/globalserver.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be dns-proxy-server for this operation.
  params:
    type: json
    required: true
    description: DNS proxy server object with servers list carrying one addr per entry.
inputs:
  session_ref: "<session-ref>"
  config_domain: dns-proxy-server
  params:
    servers:
      - addr: <DNS_SERVER_IP>
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: dns-proxy-server
      applied_ref: "<dns-proxy-server-create-result-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: false
side_effect: state_mutation
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - dns
gate:
  required: true
  reason: DNS proxy servers receive proxied client queries and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
  - The global DNS proxy is expected to be enabled for the servers to take effect.
postconditions:
  - DNS proxy server creation result and diagnostic references are available to the caller.
  - A follow-up fw_verify_dns_proxy_server can confirm the servers are effective.
tags:
  - firewall
  - dns
  - dns-proxy
  - configuration
aliases:
  - dns-proxy-server-config
  - global-dns-server-add
  - proxy-server-create
since_version: "1.9.0"
