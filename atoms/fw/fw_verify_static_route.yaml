schema_version: "1.1"
op_id: fw_verify_static_route
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_verify_static_route
description: Query NGFW static routes.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
inputs:
  session_ref: "<session-ref>"
  config_domain: static_route
side_effect: observation
returns:
  status: success
  data:
    verification_summary_ref: "<static-route-verification-summary-ref>"
    verification_status: passed
    existence: true
    static_route_id: "<route-id>"
    static_route_ids: "<route-id-list>"
    count: 0
    full_config: "<static-route-full-config-ref>"
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
dry_run_supported: true
risk_level: low
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_RESULT_MISSING
  - STATE_MISMATCH
  - MANUAL_HANDLING_REQUIRED
verification:
  kind: capacity_domain
  rules:
    - name: static_route_query_returns_all_routes
      input_ref: "<static-route-query-result-ref>"
      expected_result: All static routes are returned with id, dst_network, next_hop_addr, enable, preference, weight, and outgoing_interface.
  summary_ref: "<static-route-verification-summary-ref>"
preconditions:
  - External orchestration holds a valid session_ref.
postconditions:
  - Static route query result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - static_route
  - verification
aliases:
  - static-routing
since_version: "1.1.0"
