schema_version: "1.1"
op_id: fw_update_security_zone
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_update_security_zone
description: Update an NGFW security zone name, description, or interface bindings.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be security_zone for this operation.
  params:
    type: json
    required: true
    description: Security zone update object with name, desc, interfaces, and refcnt. name used as the resource identifier.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: security_zone
  params:
    name: "trust-zone"
    desc: "Updated description"
    interfaces:
      - "GE0_1"
      - "GE0_2"
      - "GE0_3"
  idempotency_key: "<idempotency-key>"
side_effect: state_mutation
returns:
  status: success
  data:
    security_zone_name: "<security-zone-name>"
    pre_snapshot_ref: "<security-zone-pre-snapshot-ref>"
    config_result:
      status: succeeded
      config_domain: security_zone
      applied_ref: "<security-zone-update-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - name
    - full_config
  notes: Restore the complete pre-change security-zone object via PUT /api/v1/sfarea.
pre_snapshot:
  op_id: fw_verify_security_zone
  capture_fields:
    - name
    - full_config
rollback_apply:
  op_id: fw_update_security_zone
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_security_zone
  expected_state: equals_pre_snapshot
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Security zone updates can alter interface-to-zone mappings and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk configuration contract is used.
  - The update request must carry the zone name as both the top-level id and val.name; otherwise the device rejects it.
postconditions:
  - Security zone update result and diagnostic references are available to the caller.
  - A follow-up fw_verify_security_zone query can confirm the device zone state.
tags:
  - firewall
  - capacity
  - security_zone
  - configuration
aliases:
  - zone
  - sfarea
since_version: "1.4.0"
