schema_version: "1.1"
op_id: fw_config_filetype
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_config_filetype
description: Define a custom file type configuration contract for NGFW capacity.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be appsec_filetype for this operation.
  params:
    type: json
    required: true
    description: Custom file type configuration with name, type, classify, refcnt and description.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: appsec_filetype
  params:
    id: 0
    val:
      name: atomicFileType
      type: true
      classify:
        - 0
      refcnt: 0
      description: atomic custom file type
  idempotency_key: "<idempotency-key>"
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: appsec_filetype
      applied_ref: "<filetype-config-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
side_effect: state_mutation
rollback_strategy:
  type: inverse_op
  op_id: fw_delete_filetype
  snapshot_required: false
  required_inputs:
    - name
  id_source: args
  id_field: name
  notes: The custom file type id is its name; rollback deletes via DELETE /api/v1/appsec/filetype?id=<name>.
pre_snapshot:
  op_id: fw_verify_filetypeobj
  capture_fields:
    - name
    - existence
post_verify:
  op_id: fw_verify_filetypeobj
  expected_state: present
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Custom file type changes can affect application identification and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk configuration contract is used.
postconditions:
  - Configuration result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - filetype
  - configuration
aliases:
  - custom-file-type
  - appsec-filetype
  - file-type
since_version: "1.11.0"
