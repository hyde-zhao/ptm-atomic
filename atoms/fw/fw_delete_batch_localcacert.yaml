schema_version: "1.1"
op_id: fw_delete_batch_localcacert
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_batch_localcacert
description: Delete multiple NGFW local CA certificates through /api/v1/batch.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be cert_localcacert for this operation.
  params:
    type: json
    required: true
    description: Batch delete request with DELETE /api/v1/cert/localcacert items carrying string certificate ids.
inputs:
  session_ref: "<session-ref>"
  config_domain: cert_localcacert
  params:
    batch:
      - method: DELETE
        resource: /api/v1/cert/localcacert
        body:
          id:
            - "7"
      - method: DELETE
        resource: /api/v1/cert/localcacert
        body:
          id:
            - "8"
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: cert_localcacert
      applied_ref: "<localcacert-batch-delete-result-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: false
timeout_ms: 60000
error_types:
  - NONE
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - BATCH_PARTIAL_FAILED
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
    - batch_configuration
gate:
  required: true
  reason: Batch local CA certificate deletion removes multiple trust anchors and may affect certificate issuance; requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
    - concurrency_review
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
  - Batch body contains only DELETE /api/v1/cert/localcacert items.
postconditions:
  - Batch local CA certificate deletion result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - cert
  - batch_configuration
aliases:
  - local-ca-certificate
  - cacert-bulk-delete
  - bulk
since_version: "1.11.0"
