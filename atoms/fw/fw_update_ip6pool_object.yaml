schema_version: "1.1"
op_id: fw_update_ip6pool_object
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_update_ip6pool_object
description: Update an NGFW IPv6 address object through /api/v1/ip6pool.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be ip6pool_object for this operation.
  params:
    type: json
    required: true
    description: >-
      Complete /api/v1/ip6pool payload for IPv6 address-object update with id and
      val.name identifying the target, including optional exclranges and exclnetworks.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: ip6pool_object
  params:
    id: atomicSrc2001000064
    val:
      name: atomicSrc2001000064
      desc: atomicSrc2001000064
      type: 4
      ranges: []
      networks:
        - ipaddr: "2001::"
          mask: "64"
      exclranges: []
      exclnetworks:
        - ipaddr: "2001::1"
          mask: ""
  idempotency_key: "<idempotency-key>"
side_effect: state_mutation
returns:
  status: success
  data:
    object_name: atomicSrc2001000064
    pre_snapshot_ref: "<ip6pool-object-pre-snapshot-ref>"
    config_result:
      status: succeeded
      config_domain: ip6pool_object
      applied_ref: "<ip6pool-object-update-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - object_name
    - full_config
  notes: Restore the original IPv6 address-object definition from the pre-update snapshot.
pre_snapshot:
  op_id: fw_verify_ip6pool_object
  capture_fields:
    - object_name
    - full_config
rollback_apply:
  op_id: fw_update_ip6pool_object
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_ip6pool_object
  expected_state: equals_pre_snapshot
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: IPv6 address-object updates can change policy matching and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk IPv6 address-object update is used.
postconditions:
  - IPv6 address-object update result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - ip6pool_object
  - configuration
aliases:
  - ip6pool-object
  - ipv6-address-object
  - ip6-pool
  - ip6pool
since_version: "1.10.0"
