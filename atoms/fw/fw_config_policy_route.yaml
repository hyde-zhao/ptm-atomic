schema_version: "1.1"
op_id: fw_config_policy_route
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_config_policy_route
description: Create an IPv4 or IPv6 NGFW policy route.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be policy_route for this operation.
  params:
    type: json
    required: true
    description: Policy route create object. type must be ipv4 or ipv6; forwarding path requires next_hop_ip or outgoing_interface, and next_hop_ip must match the selected IP version when provided.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: policy_route
  params:
    source_network: "策略路由源IP1"
    source_network_is_group: false
    dst_network: any
    dst_network_is_group: false
    type: ipv4
    next_hop_ip: 18.18.2.2
    in_interface: GE0_12
    outgoing_interface: ""
    service: any
    service_is_group: false
    active: true
    weight: 100
    time_obj: ""
    action: 1
    config_source: 0
  idempotency_key: "<idempotency-key>"
side_effect: state_mutation
returns:
  status: success
  data:
    policy_route_id: "<policy-route-id>"
    created: true
    config_result:
      status: succeeded
      config_domain: policy_route
      applied_ref: "<policy-route-config-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
rollback_strategy:
  type: inverse_op
  op_id: fw_delete_policy_route
  snapshot_required: false
  required_inputs:
    - policy_route_id
  id_source: response
  id_field: policy_route_id
  notes: Delete only when the create result reports created=true; pre-existing idempotent objects must not be deleted by default. The policy_route_id is taken from the POST /api/v1/policyroute response.
pre_snapshot:
  op_id: fw_verify_policy_route
  capture_fields:
    - policy_route_id
    - existence
post_verify:
  op_id: fw_verify_policy_route
  expected_state: absent
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Policy route changes can alter traffic forwarding and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk configuration contract is used.
postconditions:
  - Configuration result and diagnostic references are available to the caller.
  - A follow-up fw_verify_policy_route query can confirm the device route state.
tags:
  - firewall
  - capacity
  - policy_route
  - configuration
aliases:
  - ipv6-route
  - ipv6
  - pbr
  - policy-based-routing
since_version: "1.1.0"
