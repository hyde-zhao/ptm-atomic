schema_version: "1.1"
op_id: fw_config_customappobj
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_config_customappobj
description: Define a custom application object configuration contract for NGFW capacity.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be customappobj for this operation.
  params:
    type: json
    required: true
    description: Custom application object configuration with name_cn, pid, protocol, pattern and tcpudpcfg.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: customappobj
  params:
    name_cn: atomicAppObj333
    pid: "268435599"
    protocol: TCP
    platform: "Windows、MacOS、Linux、IOS、Android、HarmonyOS"
    ip: ""
    path: 即时通讯/QQ/atomicAppObj333
    pattern_type: Ascii
    pattern: "222"
    desc: atomic custom application object
    customflag: true
    name_en: atomicAppObj333
    tcpudpcfg:
      offset: "0"
      port: ""
      direct: client
  idempotency_key: "<idempotency-key>"
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: customappobj
      applied_ref: "<customappobj-config-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: false
side_effect: state_mutation
rollback_strategy:
  type: inverse_op
  op_id: fw_delete_batch_customappobj
  snapshot_required: false
  required_inputs:
    - name_cn
  id_source: args
  id_field: name_cn
  notes: The device delete id is name_cn (not the numeric appid); rollback deletes via POST /api/v1/batch with DELETE /api/v1/customappobj.
pre_snapshot:
  op_id: fw_verify_customappobj
  capture_fields:
    - name_cn
    - existence
post_verify:
  op_id: fw_verify_customappobj
  expected_state: present
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Custom application-object changes can affect application-aware policy matching and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk configuration contract is used.
postconditions:
  - Configuration result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - customappobj
  - configuration
aliases:
  - application-object
  - custom-app
  - appobj
since_version: "1.8.0"
