schema_version: "1.1"
op_id: fw_verify_dns_proxy_server
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_verify_dns_proxy_server
description: Query configured DNS proxy servers through GET /api/v1/dns/globalserver.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be dns-proxy-server for this operation.
inputs:
  session_ref: "<session-ref>"
  config_domain: dns-proxy-server
side_effect: observation
returns:
  status: success
  data:
    observed_state_ref: "<dns-proxy-server-state-ref>"
    vals_ref: "<dns-proxy-server-vals-ref>"
    count: 0
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_RESULT_MISSING
  - STATE_MISMATCH
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
verification:
  kind: capacity_domain
  rules:
    - name: dns_proxy_server_query_returns_servers
      input_ref: "<dns-proxy-server-query-result-ref>"
      expected_result: the device returns all configured DNS proxy server addresses in vals[].servers[].addr.
  summary_ref: "<dns-proxy-server-verification-summary-ref>"
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
  - The global DNS proxy is enabled so proxy servers exist to observe.
postconditions:
  - DNS proxy server contents and diagnostic references are available to the caller.
tags:
  - firewall
  - dns
  - dns-proxy
  - verification
aliases:
  - dns-proxy-server-verify
  - global-dns-server-list
  - proxy-server-query
since_version: "1.9.0"
