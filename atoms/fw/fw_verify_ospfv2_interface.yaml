schema_version: "1.1"
op_id: fw_verify_ospfv2_interface
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_verify_ospfv2_interface
description: Query NGFW OSPFv2 interface entries.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  query_domain:
    type: string
    required: true
    description: Must be ospfv2_interface for this operation.
returns:
  status: success
  data:
    observed_state_ref: "<ospfv2-interface-state-ref>"
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - DEVICE_UNREACHABLE
  - RESPONSE_INVALID
  - UNKNOWN_ERROR
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
postconditions:
  - OSPFv2 interface entries are available to the caller.
tags:
  - firewall
  - ospfv2
  - routing
  - verification
since_version: "1.2.0"
