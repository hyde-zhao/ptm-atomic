schema_version: "1.1"
op_id: fw_delete_batch_acl_policy
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_batch_acl_policy
description: Delete multiple NGFW control policies through /api/v1/batch.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be acl_policy for this operation.
  params:
    type: json
    required: true
    description: Batch delete request with DELETE /api/v1/ip{4,6}policy/fwaclconf items. policy_type selects the IPv4 (ip4policy) or IPv6 (ip6policy) address family for the whole batch; every item carries the same resource path. Each item body.id is a non-empty string list; no is_ip6 is sent, unlike fw_delete_batch_policy_route.
inputs:
  session_ref: "<session-ref>"
  config_domain: acl_policy
  params:
    policy_type: ipv4
    batch:
      - method: DELETE
        resource: /api/v1/ip4policy/fwaclconf
        body:
          id:
            - "1"
      - method: DELETE
        resource: /api/v1/ip4policy/fwaclconf
        body:
          id:
            - "2"
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: acl_policy
      applied_ref: "<acl-policy-batch-delete-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: false
timeout_ms: 60000
error_types:
  - NONE
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - BATCH_PARTIAL_FAILED
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
    - batch_configuration
gate:
  required: true
  reason: Batch control-policy deletion can remove multiple filtering rules and alter traffic decisions; requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
    - concurrency_review
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
  - Batch body contains only DELETE /api/v1/ip4policy/fwaclconf or DELETE /api/v1/ip6policy/fwaclconf items.
  - Each item body.id must be a non-empty string list; the address family is fixed by policy_type and shared across all items.
postconditions:
  - Batch control-policy deletion result and diagnostic references are available to the caller.
  - A follow-up fw_verify_acl_policy query can confirm the deleted policies are absent.
tags:
  - firewall
  - capacity
  - acl_policy
  - batch_configuration
aliases:
  - bulk
  - access-list
  - access-control-list
  - firewall-policy
  - security-policy
  - control-policy
since_version: "1.7.0"
