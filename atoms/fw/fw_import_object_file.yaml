schema_version: "1.1"
op_id: fw_import_object_file
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_import_object_file
description: Import an object module Excel file by uploading it and starting the async /api/v1/dataimport task.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  module:
    type: string
    required: true
    description: Module type for the import; documented values are ippool, ip6pool, ip6group, macpool, domainpool, geoip, serpool, sergrouppool, appObject and urlObject.
  input_path:
    type: string
    required: true
    description: Local filesystem path of the .xlsx file to upload.
  is_skip_dup:
    type: bool
    required: false
    description: Skip duplicate entries when importing; defaults to true.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  module: macpool
  input_path: /tmp/macpool_import.xlsx
  is_skip_dup: true
  idempotency_key: "<idempotency-key>"
side_effect: state_mutation
returns:
  status: success
  data:
    module_type: macpool
    input_file: /tmp/macpool_import.xlsx
    staged_file: /userdata/userfile/policyfile/macpool/macpool_import.xlsx
    staged_path_source: response
    is_skip_dup: true
    import_message: 导入任务启动成功
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: false
dry_run_supported: true
risk_level: medium
timeout_ms: 60000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: medium
  categories:
    - configuration
    - data_management
gate:
  required: true
  reason: Bulk object data import can create or override module rows and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - The .xlsx file follows the module template format downloaded via fw_download_object_file or fw_export_object_policy.
postconditions:
  - The import task is accepted; {"data":"导入任务启动成功"} does not guarantee rows landed because the task is asynchronous.
tags:
  - firewall
  - object
  - import
  - data_management
aliases:
  - import-objects
  - module-import
  - dataimport
since_version: "1.12.0"
