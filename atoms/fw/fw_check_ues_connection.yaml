schema_version: "1.1"
op_id: fw_check_ues_connection
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_check_ues_connection
description: Test NGFW connectivity to the UES platform.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be ues_access for this operation.
  params:
    type: json
    required: true
    description: UES connection test object mirroring the access config val; uesip, port, securitykey, and thirdpartycode.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: ues_access
  params:
    uesip: "<UES_IP>"
    port: "53443"
    securitykey: ""
    thirdpartycode: "tgfw"
  idempotency_key: "<idempotency-key>"
side_effect: none
returns:
  status: success
  data:
    connection_result:
      status: succeeded
      config_domain: ues_access
      applied_ref: "<ues-connection-test-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
dry_run_supported: true
risk_level: low
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - uesip and port point to a reachable UES platform.
postconditions:
  - Connection test result and diagnostic references are available to the caller.
  - The POST does not mutate the saved UES access configuration.
tags:
  - firewall
  - ues
  - access
  - diagnostics
aliases:
  - ues-connection
  - ues-connection-test
since_version: "1.7.0"
