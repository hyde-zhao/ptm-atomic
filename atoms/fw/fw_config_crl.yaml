schema_version: "1.1"
op_id: fw_config_crl
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_config_crl
description: Upload and register a CRL certificate through /api/v1/upload and /api/v1/cert/upload.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be crl for this operation.
  params:
    type: json
    required: true
    description: CRL registration with certName, uploadType (local or http), keyType plus the optional keyName, certType, urlName and CRL passphrases.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: crl
  params:
    certName: GDCA_HKMR_IV_CA.crl
    certType: ""
    keyName: ""
    pfxPasswd: ""
    keyPasswd: ""
    uploadType: local
    urlName: ""
    crlAutoUpTime: ""
    keyType: RSA
  idempotency_key: "<idempotency-key>"
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: crl
      applied_ref: "<crl-config-result-ref>"
    staged_ref: "<crl-staged-file-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
side_effect: state_mutation
rollback_strategy:
  type: inverse_op
  op_id: fw_delete_batch_crl
  snapshot_required: false
  required_inputs:
    - cert_name
  id_source: query
  query_op: fw_verify_crl
  query_match: name
  id_field: id
  notes: The registered CRL entry is resolved by fw_verify_crl and then removed through the certcrl batch delete resource.
pre_snapshot:
  op_id: fw_verify_crl
  capture_fields:
    - name
    - existence
post_verify:
  op_id: fw_verify_crl
  expected_state: present
timeout_ms: 60000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - certificate
gate:
  required: true
  reason: Registering a CRL changes which certificates the device treats as revoked and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - For uploadType local the source .crl file is readable by the runner; for uploadType http the device can reach urlName.
  - Gate evidence exists before this high-risk configuration contract is used.
postconditions:
  - The CRL is registered and visible through fw_verify_crl.
  - Any failed check is reported for manual handling.
tags:
  - firewall
  - certificate
  - crl
  - configuration
aliases:
  - crl
  - certificate-revocation-list
  - certcrl
  - revocation-list
since_version: "1.13.0"
