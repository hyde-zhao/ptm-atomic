schema_version: "1.1"
op_id: fw_config_static_dns
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_config_static_dns
description: Create a static DNS entry (domain to IPv4/IPv6 address) through POST /api/v1/dns/cache.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be static-dns for this operation.
  params:
    type: json
    required: true
    description: Static DNS entry object with name and ip4addr fields; ip6addr is optional.
inputs:
  session_ref: "<session-ref>"
  config_domain: static-dns
  params:
    val:
      name: www.example.com
      ip4addr: 10.10.10.10
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: static-dns
      applied_ref: "<static-dns-create-result-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: false
side_effect: state_mutation
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - dns
gate:
  required: true
  reason: DNS resolution behavior can change for local and proxied traffic and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
  - The domain name and address comply with the static DNS table constraints (domain 1-253 chars, labels up to 63 chars; table capacity up to 128 entries).
postconditions:
  - Static DNS entry creation result and diagnostic references are available to the caller.
  - A follow-up fw_verify_dns_resolution can confirm the entry is effective.
tags:
  - firewall
  - dns
  - static-dns
  - configuration
aliases:
  - static-dns
  - dns-entry
  - domain-mapping
since_version: "1.9.0"
