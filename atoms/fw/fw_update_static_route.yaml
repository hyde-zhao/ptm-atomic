schema_version: "1.1"
op_id: fw_update_static_route
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_update_static_route
description: Update an existing NGFW static route by id.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be static_route for this operation.
  params:
    type: json
    required: true
    description: Static route update object with id and all required domain fields. All fields must be provided; partial update is not supported.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: static_route
  params:
    id: "<route-id>"
    dst_network: "<destination-ref>"
    next_hop_addr: "<next-hop-ref>"
    enable: true
    preference: 1
    weight: 0
    outgoing_interface: ""
  idempotency_key: "<idempotency-key>"
side_effect: state_mutation
returns:
  status: success
  data:
    static_route_id: "<route-id>"
    pre_snapshot_ref: "<static-route-pre-snapshot-ref>"
    config_result:
      status: succeeded
      config_domain: static_route
      applied_ref: "<static-route-update-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
rollback_strategy:
  type: restore_snapshot
  snapshot_required: true
  required_inputs:
    - id
    - full_config
  notes: Restore the complete pre-change static-route object via PUT /api/v1/route.
pre_snapshot:
  op_id: fw_verify_static_route
  capture_fields:
    - id
    - full_config
rollback_apply:
  op_id: fw_update_static_route
  input_from: pre_snapshot.full_config
post_verify:
  op_id: fw_verify_static_route
  expected_state: equals_pre_snapshot
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Static route changes can alter traffic forwarding and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk configuration contract is used.
  - The update request must carry the route id at both the top-level and val.id; all fields must be provided.
postconditions:
  - Configuration result and diagnostic references are available to the caller.
  - A follow-up fw_verify_static_route query can confirm the device route state.
tags:
  - firewall
  - capacity
  - static_route
  - configuration
aliases:
  - static-routing
since_version: "1.1.0"
