schema_version: "1.1"
op_id: fw_config_interface_pair
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_config_interface_pair
description: Create an NGFW interface pair through POST /api/v1/intf/pair.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be interface_pair for this operation.
  params:
    type: json
    required: true
    description: >-
      Complete interface-pair create envelope {val: {...}}. val carries name,
      receive_interface, transmit_interface, status_sync, allowed_vlan and remark.
      POST /api/v1/intf/pair has no top-level id; name is the pair identity.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: interface_pair
  params:
    val:
      name: pair1
      remark: ""
      receive_interface: GE0_1
      transmit_interface: GE0_2
      status_sync: false
      allowed_vlan: "0"
  idempotency_key: "<idempotency-key>"
side_effect: state_mutation
returns:
  status: success
  data:
    pair_name: pair1
    config_result:
      status: succeeded
      config_domain: interface_pair
      applied_ref: "<interface-pair-create-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: false
rollback_strategy:
  type: inverse_op
  op_id: fw_delete_interface_pair
  snapshot_required: false
  required_inputs:
    - name
  id_source: args
  id_field: name
  notes: Delete the interface pair by its name, which is also the DELETE ?id= value.
pre_snapshot:
  op_id: fw_verify_interface_pair
  capture_fields:
    - name
    - existence
post_verify:
  op_id: fw_verify_interface_pair
  expected_state: present
dry_run_supported: true
risk_level: high
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Interface-pair creation changes L2 forwarding and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk interface-pair configuration is used.
  - >-
    Both physical interfaces must already be prepared with fw_update_interface
    mode="Pair" before the interface pair is created; configure the interfaces
    first, then create the pair.
  - >-
    For L2 forwarding, prepare member ports with fw_update_interface (mode
    Switch, pvid, linkType) and create the BVI with fw_config_interface before
    creating any interface pair that references those ports.
postconditions:
  - Interface-pair creation result and diagnostic references are available to the caller.
  - A follow-up fw_verify_interface_pair query can confirm the pair is present.
tags:
  - firewall
  - capacity
  - interface
  - pair
  - configuration
aliases:
  - interface-pair
  - port-pair
  - pair-interface
  - l2-pair
since_version: "1.20.0"
