schema_version: "1.1"
op_id: fw_verify_policy_route
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_verify_policy_route
description: Query IPv4 or IPv6 NGFW policy routes.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  page:
    type: int
    required: true
    description: Query page number.
  size:
    type: int
    required: true
    description: Query page size.
  is_ip6:
    type: bool
    required: true
    description: false queries IPv4 policy routes and true queries IPv6 policy routes.
inputs:
  session_ref: "<session-ref>"
  config_domain: policy_route
  page: 1
  size: 40
  is_ip6: false
side_effect: observation
returns:
  status: success
  data:
    verification_summary_ref: "<policy-route-verification-summary-ref>"
    verification_status: passed
    existence: true
    policy_route_id: "<policy-route-id>"
    full_config: "<policy-route-full-config-ref>"
    hitcount: 0
    next_hop_status: reachable
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
dry_run_supported: true
risk_level: low
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_RESULT_MISSING
  - STATE_MISMATCH
  - MANUAL_HANDLING_REQUIRED
verification:
  kind: capacity_domain
  rules:
    - name: policy_route_query_returns_requested_address_family
      input_ref: "<policy-route-query-result-ref>"
      expected_result: page, size, and is_ip6 filters are applied by the device query.
  summary_ref: "<policy-route-verification-summary-ref>"
preconditions:
  - External orchestration holds a valid session_ref.
postconditions:
  - Policy route query result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - policy_route
  - verification
aliases:
  - ipv6-route
  - ipv6
  - pbr
  - policy-based-routing
since_version: "1.1.0"
