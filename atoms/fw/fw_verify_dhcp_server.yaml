schema_version: "1.1"
op_id: fw_verify_dhcp_server
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_verify_dhcp_server
description: Query IPv4 DHCP server configurations through /api/v1/dhcp.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be dhcp for this operation.
  params:
    type: json
    required: true
    description: IPv4 DHCP server query envelope; GET sends no JSON body and no query parameters, and returns vals only.
inputs:
  session_ref: "<session-ref>"
  config_domain: dhcp
  params: {}
side_effect: observation
returns:
  status: success
  data:
    observed_state_ref: "<dhcp-state-ref>"
    full_config_ref: "<dhcp-full-config-ref>"
    vals_ref: "<dhcp-vals-ref>"
    count: 0
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
dry_run_supported: true
risk_level: low
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_RESULT_MISSING
  - STATE_MISMATCH
  - MANUAL_HANDLING_REQUIRED
verification:
  kind: capacity_domain
  rules:
    - name: dhcp_query_returns_list
      input_ref: "<dhcp-query-result-ref>"
      expected_result: the device returns vals for IPv4 DHCP servers; each entry carries ifname, ifmode and a server object with enable, name, subnets, lease, dns1, dns2 and hosts.
  summary_ref: "<dhcp-verification-summary-ref>"
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
postconditions:
  - Query result and diagnostic references are available to the caller.
  - Any failed check is reported for manual handling.
tags:
  - firewall
  - capacity
  - dhcp
  - verification
aliases:
  - dhcp-server
  - dhcp-service
  - dhcp-scope
since_version: "1.14.0"
