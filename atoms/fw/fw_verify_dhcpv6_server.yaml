schema_version: "1.1"
op_id: fw_verify_dhcpv6_server
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_verify_dhcpv6_server
description: Query DHCPv6 server configurations through /api/v1/dhcpv6.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be dhcpv6 for this operation.
  params:
    type: json
    required: true
    description: DHCPv6 server query envelope; GET sends no JSON body and no query parameters, and returns data only.
inputs:
  session_ref: "<session-ref>"
  config_domain: dhcpv6
  params: {}
side_effect: observation
returns:
  status: success
  data:
    observed_state_ref: "<dhcpv6-state-ref>"
    full_config_ref: "<dhcpv6-full-config-ref>"
    data_ref: "<dhcpv6-data-ref>"
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
dry_run_supported: true
risk_level: low
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_RESULT_MISSING
  - STATE_MISMATCH
  - MANUAL_HANDLING_REQUIRED
verification:
  kind: capacity_domain
  rules:
    - name: dhcpv6_query_returns_list
      input_ref: "<dhcpv6-query-result-ref>"
      expected_result: the device returns a data list for DHCPv6 servers; each entry carries ifname, ifmode, enable and a server object with enable, name, subnet, prefix, prefix_len, lease, dns1, dns2, hosts, sip, sntp and domain.
  summary_ref: "<dhcpv6-verification-summary-ref>"
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
postconditions:
  - Query result and diagnostic references are available to the caller.
  - The list arrives under the data key. The IPv4 sibling family returns the same shape under vals, and that key difference is the only response-shape divergence between the two families.
  - The device returns no count field; the caller takes the length of the list.
  - Any failed check is reported for manual handling.
tags:
  - firewall
  - capacity
  - dhcpv6
  - verification
aliases:
  - dhcpv6-server
  - dhcpv6-service
  - dhcpv6-scope
since_version: "1.15.0"
