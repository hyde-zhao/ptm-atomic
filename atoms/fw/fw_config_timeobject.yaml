schema_version: "1.1"
op_id: fw_config_timeobject
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_config_timeobject
description: Define a time object configuration contract for NGFW capacity. Supports oneshot/day/week/month scheduletype.
parameters:
  state_ref:
    type: string
    required: false
    description: Non-sensitive state reference from an external orchestrator.
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be timeobject for this operation.
  params:
    type: json
    required: true
    description: >-
      Time object configuration with name, scheduletype and timequantum/timemonquantum.
      Field-level shape (P2): timequantum is an ARRAY of segments, each
      {starttime: {time, weekday?}, endtime: {time, weekday?}} - oneshot times are
      'YYYY-MM-DD HH:MM:SS', day/week times are 'HH:MM' (HH:MM:SS input is normalized to HH:MM), week adds weekday int 1-7;
      timemonquantum is an ARRAY of {time: int, planday: str}. The structured CLI emits ONE
      segment unless --time-range / --month-quantum entries are repeated; ANY multi-segment or
      cross-day/week/month shape can also be passed verbatim through the --payload-json /
      --payload-file escape hatch, which the runner forwards to the device unvalidated.
  idempotency_key:
    type: string
    required: true
    description: Non-sensitive key used by the external orchestrator for repeatable intent.
inputs:
  state_ref: "<state-ref>"
  session_ref: "<session-ref>"
  config_domain: timeobject
  params:
    name: atomicTimeObj
    scheduletype: oneshot
    timequantum:
      - starttime:
          time: "2026-07-24 00:00:00"
        endtime:
          time: "2026-07-24 23:59:59"
  idempotency_key: "<idempotency-key>"
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: timeobject
      applied_ref: "<timeobject-config-result-ref>"
    state_ref: "<state-ref>"
    state_status: valid
    expires_at: null
    manual_handling_ref: "<manual-handling-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: false
side_effect: state_mutation
rollback_strategy:
  type: inverse_op
  op_id: fw_delete_timeobject
  snapshot_required: false
  required_inputs:
    - name
  id_source: args
  id_field: name
  notes: The time object id is its name; rollback deletes via DELETE /api/v1/timeobject?id=<name>.
pre_snapshot:
  op_id: fw_verify_timeobject
  capture_fields:
    - name
    - existence
post_verify:
  op_id: fw_verify_timeobject
  expected_state: present
timeout_ms: 30000
error_types:
  - NONE
  - STATE_INVALID
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
gate:
  required: true
  reason: Time object changes can affect policy scheduling and require review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
preconditions:
  - External orchestration holds a valid state_ref or session_ref.
  - Gate evidence exists before this high-risk configuration contract is used.
  - scheduletype must be oneshot, day, week or month; month uses timemonquantum, others use timequantum.
  - >-
    Multi-segment shapes (P2): timequantum/timemonquantum are arrays and accept multiple segments
    (cross-day/cross-week/cross-month). Escape hatch: --payload-json / --payload-file are forwarded
    verbatim and unvalidated, so any multi-segment body is expressible; the structured CLI supports
    repeatable --time-range ('START~END', week 'N:START~M:END') and --month-quantum
    ('<time>:<planday>') entries.
postconditions:
  - Configuration result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - timeobject
  - configuration
aliases:
  - time-object
  - schedule
  - timeobject
since_version: "1.9.0"
