schema_version: "1.1"
op_id: fw_verify_timeobject
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_verify_timeobject
description: Query NGFW time objects through /api/v1/timeobject with pagination.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be timeobject for this operation.
  page:
    type: int
    required: false
    description: Positive page number for the time object query.
  size:
    type: int
    required: false
    description: Positive page size for the time object query.
  keywords:
    type: string
    required: false
    description: Keyword filter for the time object query.
  params:
    type: json
    required: true
    description: Time object query envelope; GET sends no JSON body and returns count and vals.
inputs:
  session_ref: "<session-ref>"
  config_domain: timeobject
  page: 1
  size: 40
  keywords: ""
  params: {}
side_effect: observation
returns:
  status: success
  data:
    observed_state_ref: "<timeobject-state-ref>"
    full_config_ref: "<timeobject-full-config-ref>"
    vals_ref: "<timeobject-vals-ref>"
    count: 0
    state_status: valid
    expires_at: null
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: true
dry_run_supported: true
risk_level: low
timeout_ms: 30000
error_types:
  - NONE
  - VALIDATION_FAILED
  - CONFIG_RESULT_MISSING
  - STATE_MISMATCH
  - MANUAL_HANDLING_REQUIRED
verification:
  kind: capacity_domain
  rules:
    - name: timeobject_query_returns_list
      input_ref: "<timeobject-query-result-ref>"
      expected_result: the device returns count and vals with name, scheduletype, timequantum/timemonquantum and refcnt fields.
  summary_ref: "<timeobject-verification-summary-ref>"
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
postconditions:
  - Query result and diagnostic references are available to the caller.
  - Any failed check is reported for manual handling.
tags:
  - firewall
  - capacity
  - timeobject
  - verification
aliases:
  - time-object
  - schedule
  - timeobject
since_version: "1.9.0"
