schema_version: "1.1"
op_id: fw_delete_batch_haiplink
device_type: fw
adapter_contract_ref: adapters/ngfw/default.yaml#/operations/fw_delete_batch_haiplink
description: Delete multiple NGFW HA iplink monitor entries through /api/v1/batch.
parameters:
  session_ref:
    type: string
    required: false
    description: Non-sensitive session reference from an external orchestrator.
  config_domain:
    type: string
    required: true
    description: Must be haiplink for this operation.
  params:
    type: json
    required: true
    description: Batch delete request with DELETE /api/v1/ha/iplink items and body.isGroup set to undefined.
inputs:
  session_ref: "<session-ref>"
  config_domain: haiplink
  params:
    batch:
      - method: DELETE
        resource: /api/v1/ha/iplink
        body:
          id:
            - iplink1
          isGroup:
            - undefined
returns:
  status: success
  data:
    config_result:
      status: succeeded
      config_domain: haiplink
      applied_ref: "<haiplink-batch-delete-result-ref>"
  error_type: NONE
  diag_snapshot_ref: "<diag-snapshot-ref>"
idempotent: false
timeout_ms: 60000
error_types:
  - NONE
  - VALIDATION_FAILED
  - GATE_MISSING
  - CONFIG_REJECTED
  - DEVICE_UNREACHABLE
  - BATCH_PARTIAL_FAILED
  - UNKNOWN_ERROR
risk:
  level: high
  categories:
    - configuration
    - capacity_domain
    - batch_configuration
gate:
  required: true
  reason: Batch HA iplink deletion can remove multiple failover entries and requires review.
  approver_role: change_reviewer
  evidence_required:
    - approved_change_record
    - state_reference
    - parameter_digest
    - concurrency_review
preconditions:
  - External orchestration holds a valid session_ref or runner session file.
  - Batch body contains only DELETE /api/v1/ha/iplink items with body.isGroup set to undefined.
postconditions:
  - Batch HA iplink deletion result and diagnostic references are available to the caller.
tags:
  - firewall
  - capacity
  - ha
  - batch_configuration
aliases:
  - ha-iplink
  - ha-link-detect
since_version: "1.6.0"
