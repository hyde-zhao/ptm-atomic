schema_version: "1.1"
op_id: tg_stop_traffic_stream
device_type: tg
description: Stop one Ixia-C traffic stream or all active traffic streams.
parameters:
  topology:
    type: string
    required: true
    description: Topology YAML file path consumed by the traffic CLI.
  tx:
    type: string
    required: true
    description: TX link name in the topology file.
  rx:
    type: string
    required: true
    description: RX link name in the topology file.
  name:
    type: string
    required: false
    description: Optional traffic stream name; omit to stop all streams.
returns:
  status: success
  data:
    stream_id: "<stream-id>"
    stopped: ""
  error_type: RESOURCE_NOT_FOUND
  diag_snapshot_ref: ""
idempotent: true
side_effect: traffic_runtime
rollback_strategy:
  type: manual_required
  snapshot_required: false
  required_inputs: []
  notes: Stopping traffic is a cleanup action; ptm-atomic cannot automatically restore the previous runtime stream state.
post_verify:
  op_id: tg_capture_traffic_result
  expected_state: stopped
dry_run_supported: true
risk_level: medium
timeout_ms: 30000
error_types:
  - INVALID_PARAM
  - RESOURCE_NOT_FOUND
  - DEVICE_UNREACHABLE
  - TIMEOUT
  - INTERNAL_ERROR
preconditions:
  - The topology file exists and maps the TX and RX links to one TG node.
  - The Ixia-C API server is reachable.
postconditions:
  - The selected traffic stream or all streams are stopped.
tags:
  - traffic
  - ixiac
  - stream
since_version: "1.0.0"
