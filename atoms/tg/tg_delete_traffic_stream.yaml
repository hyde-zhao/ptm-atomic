schema_version: "1.0.0"
op_id: tg_delete_traffic_stream
device_type: tg
description: Delete a named Ixia-C traffic stream configuration.
parameters:
  topology:
    type: string
    required: true
    description: Topology YAML file path consumed by the traffic CLI.
  tx:
    type: string
    required: true
    description: TX link name in the topology file.
  rx:
    type: string
    required: true
    description: RX link name in the topology file.
  name:
    type: string
    required: true
    description: Traffic stream name to delete.
returns:
  status: success
  data:
    deleted: ""
  error_type: RESOURCE_NOT_FOUND
  diag_snapshot_ref: ""
idempotent: true
timeout_ms: 30000
error_types:
  - INVALID_PARAM
  - RESOURCE_NOT_FOUND
  - DEVICE_UNREACHABLE
  - TIMEOUT
  - INTERNAL_ERROR
preconditions:
  - The topology file exists and maps the TX and RX links to one TG node.
  - The named traffic stream exists in the Ixia-C configuration.
postconditions:
  - The named traffic stream is removed from Ixia-C configuration.
tags:
  - traffic
  - ixiac
  - stream
since_version: "1.0.0"
