schema_version: "1.1"
op_id: tg_verify_traffic_loss
device_type: tg
description: Verify Ixia-C traffic loss against a maximum allowed loss ratio.
parameters:
  topology:
    type: string
    required: true
    description: Topology YAML file path consumed by the traffic CLI.
  tx:
    type: string
    required: true
    description: TX link name in the topology file.
  rx:
    type: string
    required: true
    description: RX link name in the topology file.
  name:
    type: string
    required: false
    description: Optional traffic stream name; omit to verify all streams.
  max_loss:
    type: float
    required: false
    description: Maximum allowed loss ratio.
returns:
  status: success
  data:
    passed: true
    max_loss: 0.01
    failures: []
    flows: []
  error_type: STATE_MISMATCH
  diag_snapshot_ref: ""
idempotent: true
side_effect: observation
dry_run_supported: true
risk_level: low
timeout_ms: 30000
error_types:
  - INVALID_PARAM
  - RESOURCE_NOT_FOUND
  - STATE_MISMATCH
  - DEVICE_UNREACHABLE
  - TIMEOUT
  - INTERNAL_ERROR
preconditions:
  - The topology file exists and maps the TX and RX links to one TG node.
  - Traffic stream statistics are available for verification.
postconditions:
  - Traffic stream configuration is not modified by the verification.
tags:
  - traffic
  - ixiac
  - verification
since_version: "1.0.0"
