schema_version: "1.1"
op_id: tg_start_traffic_stream
device_type: tg
description: Start a TRex traffic stream from a predefined traffic template.
adapter_contract_ref: adapters/trex/default.yaml#/operations/tg_start_traffic_stream
parameters:
  user_id:
    type: string
    required: false
    description: >-
      TRex multi-user owner id. Defaults to "default" (legacy force mode).
      Set to dev<ip-suffix>-<seq> (e.g. dev171-1) and pair with tg_acquire_ports
      so stream start reuses the acquired client without re-acquiring.
  ports:
    type: list
    required: true
    description: TRex port IDs occupied by this operation.
  txport:
    type: string
    required: true
    description: TRex port ID that transmits traffic.
  rxport:
    type: string
    required: true
    description: >-
      TRex port ID that receives traffic. Also accepts a list of port IDs to
      capture and count received packets per port (multi-port observation).
  template:
    type: string
    required: true
    description: Traffic template name created by tg_apply_traffic_template.
  name:
    type: string
    required: true
    description: Runtime stream instance name used by verify and stop.
returns:
  status: success
  data:
    name: demo
    template: tcp_demo
    txport: "0"
    rxport: "1"
    state: running
    rx_by_port:
      "1": 500
  error_type: INVALID_PARAM
  diag_snapshot_ref: ""
idempotent: false
side_effect: traffic_runtime
rollback_strategy:
  type: inverse_op
  op_id: tg_stop_traffic_stream
  snapshot_required: false
  required_inputs:
    - ports
    - txport
    - rxport
    - name
  notes: Stop cleans the runtime stream and does not preserve final statistics.
dry_run_supported: true
risk_level: medium
timeout_ms: 60000
error_types:
  - INVALID_PARAM
  - RESOURCE_NOT_FOUND
  - DEVICE_UNREACHABLE
  - TIMEOUT
  - INTERNAL_ERROR
preconditions:
  - The template exists on the TRex API host.
  - The TRex STL server and trex-api service are reachable.
postconditions:
  - The named TRex runtime stream is running on the requested TX port.
tags:
  - traffic
  - trex
  - stream
since_version: "1.1.0"
