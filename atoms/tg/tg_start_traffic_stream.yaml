schema_version: "1.0.0"
op_id: tg_start_traffic_stream
device_type: tg
description: Start an Ixia-C traffic stream from a topology-defined TX link to RX link.
parameters:
  topology:
    type: string
    required: true
    description: Topology YAML file path consumed by the traffic CLI.
  tx:
    type: string
    required: true
    description: TX link name in the topology file.
  rx:
    type: string
    required: true
    description: RX link name in the topology file.
  name:
    type: string
    required: true
    description: Traffic stream name.
  l3:
    type: string
    required: false
    description: L3 protocol, one of ipv4, ipv6, or arp.
  src_ip:
    type: string
    required: false
    description: Source IP address without prefix length.
  dst_ip:
    type: string
    required: false
    description: Destination IP address without prefix length.
  l4:
    type: string
    required: false
    description: L4 protocol, one of tcp, udp, icmp, or icmpv6.
  src_port:
    type: int
    required: false
    description: TCP or UDP source port.
  dst_port:
    type: int
    required: false
    description: TCP or UDP destination port.
  src_mac:
    type: string
    required: false
    description: Source MAC address.
  dst_mac:
    type: string
    required: false
    description: Destination MAC address.
  vlan:
    type: string
    required: false
    description: VLAN ID or comma-separated VLAN stack.
  count:
    type: int
    required: false
    description: Fixed frame count.
  continuous:
    type: bool
    required: false
    description: Whether to send traffic continuously.
  pps:
    type: int
    required: false
    description: Packets per second.
  frame_size:
    type: int
    required: false
    description: Frame size in bytes.
returns:
  status: success
  data:
    flow_name: ""
    tx_link: ""
    rx_link: ""
    l3: ipv4
    l4: ""
    count: 100
    continuous: false
    pps: 10000
    frame_size: 128
  error_type: INVALID_PARAM
  diag_snapshot_ref: ""
idempotent: false
timeout_ms: 60000
error_types:
  - INVALID_PARAM
  - DEVICE_UNREACHABLE
  - TIMEOUT
  - INTERNAL_ERROR
preconditions:
  - The topology file exists and maps the TX and RX links to one TG node.
  - The Ixia-C API server and SSH endpoint are reachable.
postconditions:
  - The named traffic stream is configured and started on Ixia-C.
tags:
  - traffic
  - ixiac
  - stream
since_version: "1.0.0"
