schema_version: "1.1"
op_id: tg_config_stateful_interface
device_type: tg
description: Configure ASTF interfaces, learn gateway MACs, and announce the template IP pool via gratuitous ARP.
adapter_contract_ref: adapters/trex/default.yaml#/operations/tg_config_stateful_interface
parameters:
  user_id:
    type: string
    required: false
    description: >-
      TRex multi-user owner id. Defaults to "default" (legacy force mode).
      Set to dev<ip-suffix>-<seq> (e.g. dev171-1) and pair with tg_acquire_ports.
  interfaces:
    type: list
    required: true
    description: >-
      List of port, IPv4 address (pool start), and gateway objects for the ASTF
      port pair (client port = lower index, server port = higher index).
returns:
  status: success
  data:
    interfaces: []
    status: configured
  error_type: STATE_MISMATCH
  diag_snapshot_ref: ""
idempotent: true
side_effect: state_mutation
dry_run_supported: true
risk_level: medium
timeout_ms: 60000
error_types:
  - INVALID_PARAM
  - STATE_MISMATCH
  - DEVICE_UNREACHABLE
  - TIMEOUT
  - INTERNAL_ERROR
preconditions:
  - The TRex ASTF server (RPC 4511) and trex-api service are reachable.
  - Each requested port is physically connected to a reachable gateway.
  - The interface IPs are within a subnet the DUT can route.
postconditions:
  - Each configured ASTF port has L3 settings and a gateway MAC learned through ARP.
  - The template IP pool (interface IP plus the next 4 addresses) is announced
    to the DUT via gratuitous ARP so the whole pool is resolvable.
  - Service mode is re-disabled after configuration to restore fast-path RX.
tags:
  - traffic
  - trex
  - stateful
  - interface
since_version: "1.3.0"
