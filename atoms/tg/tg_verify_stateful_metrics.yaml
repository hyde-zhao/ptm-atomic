schema_version: "1.1"
op_id: tg_verify_stateful_metrics
device_type: tg
description: Query ASTF stats snapshot and optionally verify loss ratio.
adapter_contract_ref: adapters/trex/default.yaml#/operations/tg_verify_stateful_metrics
parameters:
  user_id:
    type: string
    required: false
    description: TRex multi-user owner id. Defaults to "default".
  max_loss:
    type: float
    required: false
    description: >-
      Maximum allowed incremental loss ratio (tx-rx)/tx for this stream
      window. If omitted, only returns stats without pass/fail. Verification
      also fails with STATE_MISMATCH on zero transmitted traffic or when the
      opened flow count is below the template nflows expectation.
returns:
  status: success
  data:
    user_id: dev172-1
    metrics:
      connection:
        client_active_flows: 0
        client_est_flows: 0
        server_active_flows: 0
        server_est_flows: 0
      throughput:
        tx_bytes: 2224434
        rx_bytes: 2224434
        tx_bps: 0
        rx_bps: 0
      global:
        active_flows: 0
        open_flows: 10
        tx_cps: 0
        cpu_util: 0
    loss_bytes: 0
    loss_ratio: 0.0
    max_loss: 0.01
    passed: true
  error_type: STATE_MISMATCH
  diag_snapshot_ref: ""
idempotent: true
side_effect: observation
dry_run_supported: true
risk_level: low
timeout_ms: 30000
error_types:
  - INVALID_PARAM
  - RESOURCE_NOT_FOUND
  - STATE_MISMATCH
  - DEVICE_UNREACHABLE
  - TIMEOUT
  - INTERNAL_ERROR
preconditions:
  - A stateful stream is still running (called before tg_stop_stateful_stream).
postconditions:
  - ASTF traffic runtime is not modified by the verification.
tags:
  - traffic
  - trex
  - stateful
  - verification
since_version: "1.3.0"
