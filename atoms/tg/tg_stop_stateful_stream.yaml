schema_version: "1.1"
op_id: tg_stop_stateful_stream
device_type: tg
description: Stop ASTF stateful traffic and clear runtime state.
adapter_contract_ref: adapters/trex/default.yaml#/operations/tg_stop_stateful_stream
parameters:
  user_id:
    type: string
    required: false
    description: TRex multi-user owner id. Defaults to "default".
returns:
  status: success
  data:
    user_id: default
    stopped: true
  error_type: INVALID_PARAM
  diag_snapshot_ref: ""
idempotent: false
side_effect: traffic_runtime
dry_run_supported: true
risk_level: medium
timeout_ms: 30000
error_types:
  - INVALID_PARAM
  - RESOURCE_NOT_FOUND
  - DEVICE_UNREACHABLE
  - TIMEOUT
  - INTERNAL_ERROR
preconditions:
  - A stateful stream is running for the given user_id.
postconditions:
  - The ASTF stateful traffic is stopped.
tags:
  - traffic
  - trex
  - stateful
  - stream
since_version: "1.3.0"
