schema_version: "1.0"
adapter_id: trex.default
device_type: tg
profile_family: trex
description: Public non-sensitive TRex trex-api HTTP shape profile for external script generators.
operations:
  tg_config_interface:
    atom_ref: atoms/tg/tg_config_interface.yaml
    intent: Build a TRex interface configuration request that sets port IPs and learns gateway MACs via ARP or Neighbor Discovery.
    request:
      method: POST
      path: /api/v1/ops/tg_config_interface
      content_type: application/json
      auth:
        mode: external_credential_ref
        header_name: X-Session-Ref
        value_ref: <trex-no-auth>
      payload_template:
        user_id: "{{ params.user_id }}"
        interfaces: "{{ params.interfaces }}"
    response:
      success_status:
        - 200
      result_ref: <trex-config-interface-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - trex-api is an unauthenticated lab service; no credential header is sent at runtime.
        - trex-api uses a single POST /api/v1/ops/{op_id} endpoint; success is determined by the response envelope status and error_type, not the HTTP status code.
        - ptm-atomic run can execute this request only when --execute is explicit.
  tg_apply_traffic_template:
    atom_ref: atoms/tg/tg_apply_traffic_template.yaml
    intent: Build a TRex traffic template apply request that generates a native TRex YAML template on the trex-api service.
    request:
      method: POST
      path: /api/v1/ops/tg_apply_traffic_template
      content_type: application/json
      auth:
        mode: external_credential_ref
        header_name: X-Session-Ref
        value_ref: <trex-no-auth>
      payload_template:
        user_id: "{{ params.user_id }}"
        template: "{{ params.template }}"
        tx_port: "{{ params.tx_port }}"
        rx_port: "{{ params.rx_port }}"
        ip_version: "{{ params.ip_version }}"
        l4_protocol: "{{ params.l4_protocol }}"
        l4_sport: "{{ params.l4_sport }}"
        l4_dport: "{{ params.l4_dport }}"
        traffic_mode: "{{ params.traffic_mode }}"
        rate: "{{ params.rate }}"
        count: "{{ params.count }}"
        frame_size: "{{ params.frame_size }}"
        vlan: "{{ params.vlan }}"
        src_ip: "{{ params.src_ip }}"
        dst_ip: "{{ params.dst_ip }}"
        src_mac: "{{ params.src_mac }}"
        dst_mac: "{{ params.dst_mac }}"
    response:
      success_status:
        - 200
      result_ref: <trex-apply-template-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - trex-api is an unauthenticated lab service; no credential header is sent at runtime.
        - trex-api uses a single POST /api/v1/ops/{op_id} endpoint; success is determined by the response envelope status and error_type, not the HTTP status code.
        - ptm-atomic run can execute this request only when --execute is explicit.
  tg_start_traffic_stream:
    atom_ref: atoms/tg/tg_start_traffic_stream.yaml
    intent: Build a TRex runtime stream start request from a predefined traffic template.
    request:
      method: POST
      path: /api/v1/ops/tg_start_traffic_stream
      content_type: application/json
      auth:
        mode: external_credential_ref
        header_name: X-Session-Ref
        value_ref: <trex-no-auth>
      payload_template:
        user_id: "{{ params.user_id }}"
        ports: "{{ params.ports }}"
        txport: "{{ params.txport }}"
        rxport: "{{ params.rxport }}"
        template: "{{ params.template }}"
        name: "{{ params.name }}"
    response:
      success_status:
        - 200
      result_ref: <trex-start-stream-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - trex-api is an unauthenticated lab service; no credential header is sent at runtime.
        - trex-api uses a single POST /api/v1/ops/{op_id} endpoint; success is determined by the response envelope status and error_type, not the HTTP status code.
        - ptm-atomic run can execute this request only when --execute is explicit.
  tg_verify_traffic_loss:
    atom_ref: atoms/tg/tg_verify_traffic_loss.yaml
    intent: Build a TRex port-stat loss verification request against a maximum allowed loss ratio.
    request:
      method: POST
      path: /api/v1/ops/tg_verify_traffic_loss
      content_type: application/json
      auth:
        mode: external_credential_ref
        header_name: X-Session-Ref
        value_ref: <trex-no-auth>
      payload_template:
        user_id: "{{ params.user_id }}"
        ports: "{{ params.ports }}"
        txport: "{{ params.txport }}"
        rxport: "{{ params.rxport }}"
        name: "{{ params.name }}"
        max_loss: "{{ params.max_loss }}"
    response:
      success_status:
        - 200
      result_ref: <trex-verify-loss-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - trex-api is an unauthenticated lab service; no credential header is sent at runtime.
        - trex-api uses a single POST /api/v1/ops/{op_id} endpoint; success is determined by the response envelope status and error_type, not the HTTP status code.
        - ptm-atomic run can execute this request only when --execute is explicit.
  tg_stop_traffic_stream:
    atom_ref: atoms/tg/tg_stop_traffic_stream.yaml
    intent: Build a TRex runtime stream stop request that removes the stream and cleans its runtime configuration.
    request:
      method: POST
      path: /api/v1/ops/tg_stop_traffic_stream
      content_type: application/json
      auth:
        mode: external_credential_ref
        header_name: X-Session-Ref
        value_ref: <trex-no-auth>
      payload_template:
        user_id: "{{ params.user_id }}"
        ports: "{{ params.ports }}"
        txport: "{{ params.txport }}"
        rxport: "{{ params.rxport }}"
        name: "{{ params.name }}"
    response:
      success_status:
        - 200
      result_ref: <trex-stop-stream-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - trex-api is an unauthenticated lab service; no credential header is sent at runtime.
        - trex-api uses a single POST /api/v1/ops/{op_id} endpoint; success is determined by the response envelope status and error_type, not the HTTP status code.
        - ptm-atomic run can execute this request only when --execute is explicit.
  tg_delete_traffic_template:
    atom_ref: atoms/tg/tg_delete_traffic_template.yaml
    intent: Build a TRex traffic template delete request that removes a template when no runtime stream uses it.
    request:
      method: POST
      path: /api/v1/ops/tg_delete_traffic_template
      content_type: application/json
      auth:
        mode: external_credential_ref
        header_name: X-Session-Ref
        value_ref: <trex-no-auth>
      payload_template:
        user_id: "{{ params.user_id }}"
        template: "{{ params.template }}"
    response:
      success_status:
        - 200
      result_ref: <trex-delete-template-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - trex-api is an unauthenticated lab service; no credential header is sent at runtime.
        - trex-api uses a single POST /api/v1/ops/{op_id} endpoint; success is determined by the response envelope status and error_type, not the HTTP status code.
        - ptm-atomic run can execute this request only when --execute is explicit.
  tg_acquire_ports:
    atom_ref: atoms/tg/tg_acquire_ports.yaml
    intent: Build a TRex port acquire request that exclusively binds logical ports to a user_id under the explicit ownership model (force=False).
    request:
      method: POST
      path: /api/v1/ops/tg_acquire_ports
      content_type: application/json
      auth:
        mode: external_credential_ref
        header_name: X-Session-Ref
        value_ref: <trex-no-auth>
      payload_template:
        user_id: "{{ params.user_id }}"
        ports: "{{ params.ports }}"
    response:
      success_status:
        - 200
      result_ref: <trex-acquire-ports-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - trex-api is an unauthenticated lab service; no credential header is sent at runtime.
        - trex-api uses a single POST /api/v1/ops/{op_id} endpoint; success is determined by the response envelope status and error_type, not the HTTP status code.
        - A RESOURCE_CONFLICT error_type means the port is already owned by another user_id.
        - ptm-atomic run can execute this request only when --execute is explicit.
  tg_release_ports:
    atom_ref: atoms/tg/tg_release_ports.yaml
    intent: Build a TRex port release request that frees ports previously acquired by a user_id; omit ports to release all ports held by the user_id.
    request:
      method: POST
      path: /api/v1/ops/tg_release_ports
      content_type: application/json
      auth:
        mode: external_credential_ref
        header_name: X-Session-Ref
        value_ref: <trex-no-auth>
      payload_template:
        user_id: "{{ params.user_id }}"
        ports: "{{ params.ports }}"
    response:
      success_status:
        - 200
      result_ref: <trex-release-ports-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - trex-api is an unauthenticated lab service; no credential header is sent at runtime.
        - trex-api uses a single POST /api/v1/ops/{op_id} endpoint; success is determined by the response envelope status and error_type, not the HTTP status code.
        - A RESOURCE_NOT_FOUND error_type means the user_id owns no matching ports.
        - ptm-atomic run can execute this request only when --execute is explicit.
  tg_verify_ownership:
    atom_ref: atoms/tg/tg_verify_ownership.yaml
    intent: Build a TRex port ownership query that returns the trex-api internal ownership registry across all users.
    request:
      method: GET
      path: /api/v1/ownership
      content_type: application/json
      auth:
        mode: external_credential_ref
        header_name: X-Session-Ref
        value_ref: <trex-no-auth>
      payload_template: {}
    response:
      success_status:
        - 200
      result_ref: <trex-ownership-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - trex-api is an unauthenticated lab service; no credential header is sent at runtime.
        - This operation uses a dedicated GET /api/v1/ownership endpoint, not the POST /api/v1/ops/{op_id} dispatch endpoint.
        - The response is a raw {count, ownerships} object, not an OperationEnvelope; HTTP 200 alone determines success.
        - ptm-atomic run can execute this request only when --execute is explicit.
  tg_query_port_status:
    atom_ref: atoms/tg/tg_query_port_status.yaml
    intent: Build a read-only TRex port status diagnostics query (zero acquire, no ownership change) returning link/status/mac/src_ipv4 per port; ports omitted queries all ports.
    request:
      method: POST
      path: /api/v1/ops/tg_query_port_status
      content_type: application/json
      auth:
        mode: external_credential_ref
        header_name: X-Session-Ref
        value_ref: <trex-no-auth>
      payload_template:
        ports: "{{ params.ports }}"
    response:
      success_status:
        - 200
      result_ref: <trex-query-port-status-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - trex-api is an unauthenticated lab service; no credential header is sent at runtime.
        - trex-api uses a single POST /api/v1/ops/{op_id} endpoint; success is determined by the response envelope status and error_type, not the HTTP status code.
        - This is a read-only diagnostics operation; it never acquires or releases ports and leaves no lease behind.
        - gateway_mac is null when the neighbor literal is 'unresolved' (peer ARP/ND not answered); use it to pre-check TG port health before traffic steps.
  tg_config_stateful_interface:
    atom_ref: atoms/tg/tg_config_stateful_interface.yaml
    intent: Build an ASTF interface configuration request that sets port IPs, learns gateway MACs via ARP, and announces the template IP pool via gratuitous ARP.
    request:
      method: POST
      path: /api/v1/ops/tg_config_stateful_interface
      content_type: application/json
      auth:
        mode: external_credential_ref
        header_name: X-Session-Ref
        value_ref: <trex-no-auth>
      payload_template:
        user_id: "{{ params.user_id }}"
        interfaces: "{{ params.interfaces }}"
    response:
      success_status:
        - 200
      result_ref: <trex-config-stateful-interface-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - trex-api is an unauthenticated lab service; no credential header is sent at runtime.
        - trex-api uses a single POST /api/v1/ops/{op_id} endpoint; success is determined by the response envelope status and error_type, not the HTTP status code.
        - The template IP pool (interface IP plus the next 4 addresses) must stay DUT-routable; the DUT ARP cache ages in ~20 minutes so re-run this op before each test round.
        - ptm-atomic run can execute this request only when --execute is explicit.
  tg_apply_stateful_template:
    atom_ref: atoms/tg/tg_apply_stateful_template.yaml
    intent: Build an ASTF template load request that finds and loads a pre-defined profile on the ASTF instance.
    request:
      method: POST
      path: /api/v1/ops/tg_apply_stateful_template
      content_type: application/json
      auth:
        mode: external_credential_ref
        header_name: X-Session-Ref
        value_ref: <trex-no-auth>
      payload_template:
        user_id: "{{ params.user_id }}"
        template: "{{ params.template }}"
        tunables: "{{ params.tunables }}"
    response:
      success_status:
        - 200
      result_ref: <trex-apply-stateful-template-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - trex-api is an unauthenticated lab service; no credential header is sent at runtime.
        - trex-api uses a single POST /api/v1/ops/{op_id} endpoint; success is determined by the response envelope status and error_type, not the HTTP status code.
        - ptm-atomic run can execute this request only when --execute is explicit.
  tg_start_stateful_stream:
    atom_ref: atoms/tg/tg_start_stateful_stream.yaml
    intent: Build an ASTF traffic start request with CPS multiplier and duration.
    request:
      method: POST
      path: /api/v1/ops/tg_start_stateful_stream
      content_type: application/json
      auth:
        mode: external_credential_ref
        header_name: X-Session-Ref
        value_ref: <trex-no-auth>
      payload_template:
        user_id: "{{ params.user_id }}"
        mult: "{{ params.mult }}"
        duration: "{{ params.duration }}"
    response:
      success_status:
        - 200
      result_ref: <trex-start-stateful-stream-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - trex-api uses a single POST /api/v1/ops/{op_id} endpoint; success is determined by the response envelope status and error_type, not the HTTP status code.
        - ptm-atomic run can execute this request only when --execute is explicit.
  tg_verify_stateful_metrics:
    atom_ref: atoms/tg/tg_verify_stateful_metrics.yaml
    intent: Build an ASTF metrics verification request against an optional max loss ratio.
    request:
      method: POST
      path: /api/v1/ops/tg_verify_stateful_metrics
      content_type: application/json
      auth:
        mode: external_credential_ref
        header_name: X-Session-Ref
        value_ref: <trex-no-auth>
      payload_template:
        user_id: "{{ params.user_id }}"
        max_loss: "{{ params.max_loss }}"
    response:
      success_status:
        - 200
      result_ref: <trex-verify-stateful-metrics-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - trex-api uses a single POST /api/v1/ops/{op_id} endpoint; success is determined by the response envelope status and error_type, not the HTTP status code.
        - ptm-atomic run can execute this request only when --execute is explicit.
  tg_stop_stateful_stream:
    atom_ref: atoms/tg/tg_stop_stateful_stream.yaml
    intent: Build an ASTF traffic stop request.
    request:
      method: POST
      path: /api/v1/ops/tg_stop_stateful_stream
      content_type: application/json
      auth:
        mode: external_credential_ref
        header_name: X-Session-Ref
        value_ref: <trex-no-auth>
      payload_template:
        user_id: "{{ params.user_id }}"
    response:
      success_status:
        - 200
      result_ref: <trex-stop-stateful-stream-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - trex-api uses a single POST /api/v1/ops/{op_id} endpoint; success is determined by the response envelope status and error_type, not the HTTP status code.
        - ptm-atomic run can execute this request only when --execute is explicit.
  tg_delete_stateful_template:
    atom_ref: atoms/tg/tg_delete_stateful_template.yaml
    intent: Build an ASTF profile unload request.
    request:
      method: POST
      path: /api/v1/ops/tg_delete_stateful_template
      content_type: application/json
      auth:
        mode: external_credential_ref
        header_name: X-Session-Ref
        value_ref: <trex-no-auth>
      payload_template:
        user_id: "{{ params.user_id }}"
    response:
      success_status:
        - 200
      result_ref: <trex-delete-stateful-template-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - trex-api uses a single POST /api/v1/ops/{op_id} endpoint; success is determined by the response envelope status and error_type, not the HTTP status code.
        - ptm-atomic run can execute this request only when --execute is explicit.
