    intent: Build a gratuitous ARP rate limit configuration request.
    request:
      method: PUT
      path: /api/v1/neighbor/garplimitrate
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        id: "0"
        val:
          rate: "{{ params.val.rate }}"
          capacity: "{{ params.val.capacity }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <garp-rate-limit-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - PUT /api/v1/neighbor/garplimitrate configures gratuitous ARP send rate limit.
        - rate is in pps (device range 1-4096); capacity is the burst capacity (observed fixed at 16).
        - id is fixed to "0"; the backend locates the setting by the val object.
        - GET /api/v1/neighbor/garplimitrate returns {"vals":[{"rate":...,"capacity":...}]} for read-back.
        - Interface-level gratuitous ARP enable (enable_garp_timed_send / garp_send_interval) is covered by fw_config_interface / fw_update_interface over PUT /api/v1/intf.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_config_nat_snat:
    atom_ref: atoms/fw/fw_config_nat_snat.yaml
    intent: Build a source NAT rule create request from a validated atom parameter set.
    request:
      method: POST
      path: /api/v1/natsnat
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        val: "{{ params.val }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <nat-snat-create-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - POST /api/v1/natsnat creates a source NAT rule; the response body is {"id":"1","msg":"success"} with a string id.
        - val.natType carries the address family and translation variant; nat44 is the only value this device exposes today.
        - The read-back record from GET /api/v1/natsnat returns the same rule with an integer id and extra read-only fields (config_source, effect_type, enable_status, hitcount, auto_disable).
        - The create payload uses relate.isIpv6 while the read-back record uses relate.is_ipv6; keep the captured spelling on each side.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_update_nat_snat:
    atom_ref: atoms/fw/fw_update_nat_snat.yaml
    intent: Build a source NAT rule update request from a validated atom parameter set.
    request:
      method: PUT
      path: /api/v1/natsnat
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        id: "{{ params.id }}"
        val: "{{ params.val }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <nat-snat-update-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - PUT /api/v1/natsnat updates an existing source NAT rule; the captured request carried id as an integer.
        - The captured source NAT update sent business fields only (plus desc); unlike the destination NAT endpoint it did not echo the device read-back fields inside val.
        - Pass the complete val through --payload-file or --payload-json when read-back fields must be round-tripped.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_delete_nat_snat:
    atom_ref: atoms/fw/fw_delete_nat_snat.yaml
