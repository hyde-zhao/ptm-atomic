schema_version: "1.0"
adapter_id: ngfw.default
device_type: fw
profile_family: ngfw
description: Public non-sensitive NGFW API shape profile for external script generators.
operations:
  fw_config_interface:
    atom_ref: atoms/fw/fw_config_interface.yaml
    intent: Build an interface creation request for bvi, subinterface, or bond objects.
    request:
      method: POST
      path: /api/v1/intf
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        id: "{{ params.id }}"
        val: "{{ params.val }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <interface-create-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - BVI and subinterface payloads only support Route mode.
        - Physical interfaces are not created; use fw_update_interface for existing physical interfaces.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_update_interface:
    atom_ref: atoms/fw/fw_update_interface.yaml
    intent: Build an interface update request for bvi, subinterface, physical, or bond objects.
    request:
      method: PUT
      path: /api/v1/intf
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        id: "{{ params.id }}"
        val: "{{ params.val }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <interface-update-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - Physical and bond interfaces support Route, Switch, Pair, and Monitor modes.
        - BVI and subinterface payloads only support Route mode.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_verify_interface:
    atom_ref: atoms/fw/fw_verify_interface.yaml
    intent: Build an all-interface query request.
    request:
      method: GET
      path: /api/v1/intf
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template: {}
    response:
      success_status:
        - 200
      result_ref: <interface-state-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - GET /api/v1/intf returns all interfaces and sends no JSON body.
  fw_delete_interface:
    atom_ref: atoms/fw/fw_delete_interface.yaml
    intent: Build a single-interface delete request by query id.
    request:
      method: DELETE
      path: /api/v1/intf
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        id: "{{ params.id }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <interface-delete-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - DELETE sends the interface id as ?id=<interface-id> and sends no JSON body.
        - Physical interfaces are not deletable.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_delete_batch_interface:
    atom_ref: atoms/fw/fw_delete_batch_interface.yaml
    intent: Build a batch request that deletes multiple interface entries.
    request:
      method: POST
      path: /api/v1/batch
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        batch:
          - method: DELETE
            resource: /api/v1/intf
            body:
              id:
                - "{{ params.id }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <interface-batch-delete-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - Batch interface deletion is independent from single-interface DELETE /api/v1/intf.
        - Each batch item must be DELETE /api/v1/intf with body.id as a non-empty list.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_config_object:
    atom_ref: atoms/fw/fw_config_object.yaml
    intent: Build an IPv4 address-object configuration request from a validated atom parameter set.
    request:
      method: POST
      path: /api/v1/ippool
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        val:
          name: "{{ params.object_name }}"
          desc: "{{ params.object_desc }}"
          type: 4
          ranges: []
          networks:
            - ipaddr: "{{ params.ipaddr }}"
              mask: "{{ params.mask }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <object-config-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - Address-object names are later referenced by policy route source_network or dst_network fields.
        - CIDR input must be split into ipaddr and mask before calling this endpoint.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_config_policy_route:
    atom_ref: atoms/fw/fw_config_policy_route.yaml
    intent: Build an IPv4 or IPv6 policy-route create request from a validated atom parameter set.
    request:
      method: POST
      path: /api/v1/policyroute
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        id: 0
        val:
          type: "{{ params.type }}"
          in_interface: "{{ params.in_interface }}"
          source_network: "{{ params.source_network }}"
          source_network_is_group: "{{ params.source_network_is_group }}"
          dst_network: "{{ params.dst_network }}"
          dst_network_is_group: "{{ params.dst_network_is_group }}"
          service: "{{ params.service }}"
          service_is_group: "{{ params.service_is_group }}"
          active: "{{ params.active }}"
          applist: []
          app_tag_name: []
          forwarding_paths:
            - next_hop_ip: "{{ params.next_hop_ip }}"
              outgoing_interface: "{{ params.outgoing_interface }}"
              weight: "{{ params.weight }}"
              health_check: {}
          time_obj: "{{ params.time_obj }}"
          action: "{{ params.action }}"
          config_source: "{{ params.config_source }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <policy-route-config-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - Adapter profiles describe endpoint and payload shape without runtime values.
        - type must be ipv4 or ipv6; forwarding_paths entries require next_hop_ip or outgoing_interface.
        - next_hop_ip may be empty for outgoing-interface forwarding mode, but must match the selected IP version when provided.
        - source_network and dst_network are address object names unless the matching is_group flag is true.
        - Live endpoint, session material, and credentials must come from runner input.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_update_policy_route:
    atom_ref: atoms/fw/fw_update_policy_route.yaml
    intent: Build an IPv4 or IPv6 policy-route update request from a validated atom parameter set.
    request:
      method: PUT
      path: /api/v1/policyroute
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        id: "{{ params.id }}"
        val:
          id: "{{ params.id }}"
          type: "{{ params.type }}"
          in_interface: "{{ params.in_interface }}"
          source_network: "{{ params.source_network }}"
          source_network_is_group: "{{ params.source_network_is_group }}"
          dst_network: "{{ params.dst_network }}"
          dst_network_is_group: "{{ params.dst_network_is_group }}"
          service: "{{ params.service }}"
          service_is_group: "{{ params.service_is_group }}"
          active: "{{ params.active }}"
          applist: []
          app_tag_name: []
          forwarding_paths:
            - next_hop_ip: "{{ params.next_hop_ip }}"
              outgoing_interface: "{{ params.outgoing_interface }}"
              weight: "{{ params.weight }}"
              health_check: {}
          time_obj: "{{ params.time_obj }}"
          action: "{{ params.action }}"
          config_source: "{{ params.config_source }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <policy-route-update-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - PUT updates an existing policy-route id on /api/v1/policyroute.
        - type must be ipv4 or ipv6; forwarding_paths entries require next_hop_ip or outgoing_interface.
        - next_hop_ip may be empty for outgoing-interface forwarding mode, but must match the selected IP version when provided.
        - Live endpoint, session material, and credentials must come from runner input.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_delete_policy_route:
    atom_ref: atoms/fw/fw_delete_policy_route.yaml
    intent: Build a policy-route delete request by id and address family.
    request:
      method: DELETE
      path: /api/v1/policyroute
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template: {}
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <policy-route-delete-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - DELETE uses id and is_ip6 as query values and sends no JSON body.
        - is_ip6=false deletes an IPv4 policy route id; is_ip6=true deletes an IPv6 policy route id.
        - Live endpoint, session material, and credentials must come from runner input.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_verify_policy_route:
    atom_ref: atoms/fw/fw_verify_policy_route.yaml
    intent: Build a policy-route query request for IPv4 or IPv6 routes.
    request:
      method: GET
      path: /api/v1/policyroute
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template: {}
    response:
      success_status:
        - 200
      result_ref: <policy-route-query-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - Query values are page, size, and is_ip6.
        - GET requests send no JSON body.
        - is_ip6=false queries IPv4 policy routes; is_ip6=true queries IPv6 policy routes.
  fw_reset_policy_route_hitcount:
    atom_ref: atoms/fw/fw_reset_policy_route_hitcount.yaml
    intent: Build a policy-route hit-count reset request by id and address family.
    request:
      method: DELETE
      path: /api/v1/policyroutehitcount
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template: {}
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <policy-route-hitcount-reset-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - DELETE uses id and is_ip6 as query values and sends no JSON body.
        - is_ip6=false resets an IPv4 policy-route hit count; is_ip6=true resets an IPv6 policy-route hit count.
        - Reset is irreversible; historical hit-count values cannot be restored.
        - Live endpoint, session material, and credentials must come from runner input.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_verify_policy_route_hitcount:
    atom_ref: atoms/fw/fw_verify_policy_route_hitcount.yaml
    intent: Build a policy-route hit-count query request for IPv4 or IPv6 routes.
    request:
      method: GET
      path: /api/v1/policyroute
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template: {}
    response:
      success_status:
        - 200
      result_ref: <policy-route-hitcount-query-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - Query values are page, size, and is_ip6; the hitcount field is read from the response.
        - GET requests send no JSON body.
        - is_ip6=false queries IPv4 policy-route hit counts; is_ip6=true queries IPv6 policy-route hit counts.
        - Reuses the /api/v1/policyroute query endpoint; differs from fw_verify_policy_route by focusing on the hitcount field.
  fw_update_policy_route_priority:
    atom_ref: atoms/fw/fw_update_policy_route_priority.yaml
    intent: Build a policy-route priority move request for IPv4 or IPv6 routes.
    request:
      method: POST
      path: /api/v1/pridpriconf
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        val:
          targetsite: "{{ params.targetsite }}"
          targetid: "{{ params.targetid }}"
          moveid: "{{ params.moveid }}"
          is_ip6: "{{ params.is_ip6 }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <policy-route-priority-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - targetsite supports before, after, first, and last.
        - is_ip6=false moves IPv4 policy route priority; is_ip6=true moves IPv6 policy route priority.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_config_ospfv2_global:
    atom_ref: atoms/fw/fw_config_ospfv2_global.yaml
    intent: Build an OSPFv2 global configuration request from a validated atom parameter set.
    request:
      method: PUT
      path: /api/v1/ospfconfig
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        id: "{{ params.id }}"
        val:
          enable: "{{ params.enable }}"
          routerId: "{{ params.router_id }}"
          originate: "{{ params.originate }}"
          always: "{{ params.always }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <ospfv2-global-config-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - Router ID must be an IPv4 address.
        - Live endpoint and session material must come from runner input.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_verify_ospfv2_global:
    atom_ref: atoms/fw/fw_verify_ospfv2_global.yaml
    intent: Build an OSPFv2 global configuration query request.
    request:
      method: GET
      path: /api/v1/ospfconfig
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template: {}
    response:
      success_status:
        - 200
      result_ref: <ospfv2-global-state-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - GET requests send no JSON body.
        - Live endpoint and session material must come from runner input.
  fw_config_ospfv2_redistribution:
    atom_ref: atoms/fw/fw_config_ospfv2_redistribution.yaml
    intent: Build an OSPFv2 route redistribution configuration request.
    request:
      method: PUT
      path: /api/v1/ospfredist
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        id: "{{ params.id }}"
        val:
          redistribute: "{{ params.redistribute }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <ospfv2-redistribution-config-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - Supported redistribution protocols are connected, static, and rip.
        - Live endpoint and session material must come from runner input.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_verify_ospfv2_redistribution:
    atom_ref: atoms/fw/fw_verify_ospfv2_redistribution.yaml
    intent: Build an OSPFv2 route redistribution query request.
    request:
      method: GET
      path: /api/v1/ospfredist
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template: {}
    response:
      success_status:
        - 200
      result_ref: <ospfv2-redistribution-state-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - GET requests send no JSON body.
        - Live endpoint and session material must come from runner input.
  fw_config_ospfv2_network:
    atom_ref: atoms/fw/fw_config_ospfv2_network.yaml
    intent: Build an OSPFv2 network creation request.
    request:
      method: POST
      path: /api/v1/ospfnetwork
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        val:
          network: "{{ params.network }}"
          area: "{{ params.area }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <ospfv2-network-config-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - Network must be an IPv4 CIDR.
        - Live endpoint and session material must come from runner input.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_config_ospfv2_network_update:
    atom_ref: atoms/fw/fw_config_ospfv2_network_update.yaml
    intent: Build an OSPFv2 network update request by entry id.
    request:
      method: PUT
      path: /api/v1/ospfnetwork
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        id: "{{ params.id }}"
        val:
          network: "{{ params.network }}"
          area: "{{ params.area }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <ospfv2-network-update-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - Network update requires an explicit entry id.
        - Live endpoint and session material must come from runner input.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_delete_ospfv2_network:
    atom_ref: atoms/fw/fw_delete_ospfv2_network.yaml
    intent: Build an OSPFv2 network deletion request by entry id.
    request:
      method: DELETE
      path: /api/v1/ospfnetwork
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template: {}
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <ospfv2-network-delete-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - Network deletion requires an explicit entry id.
        - The runner sends the id as a DELETE query value and sends no JSON body.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_verify_ospfv2_network:
    atom_ref: atoms/fw/fw_verify_ospfv2_network.yaml
    intent: Build an OSPFv2 network query request.
    request:
      method: GET
      path: /api/v1/ospfnetwork
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template: {}
    response:
      success_status:
        - 200
      result_ref: <ospfv2-network-state-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - GET requests send no JSON body.
        - Live endpoint and session material must come from runner input.
  fw_config_ospfv2_interface:
    atom_ref: atoms/fw/fw_config_ospfv2_interface.yaml
    intent: Build an OSPFv2 interface creation request.
    request:
      method: POST
      path: /api/v1/ospfinterface
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        val:
          interface: "{{ params.interface }}"
          cost: "{{ params.cost }}"
          priority: "{{ params.priority }}"
          helloInterval: "{{ params.hello_interval }}"
          retransmitInterval: "{{ params.retransmit_interval }}"
          deadInterval: "{{ params.dead_interval }}"
          transmitDelay: "{{ params.transmit_delay }}"
          typeNetwork: "{{ params.type_network }}"
          intAuthMode: "{{ params.int_auth_mode }}"
          bfdEnable: "{{ params.bfd_enable }}"
          detectMultiplier: "{{ params.detect_multiplier }}"
          minRxInterval: "{{ params.min_rx_interval }}"
          minTxInterval: "{{ params.min_tx_interval }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <ospfv2-interface-config-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - Timer and BFD interval values must be validated before execution.
        - Live endpoint and session material must come from runner input.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_config_ospfv2_interface_update:
    atom_ref: atoms/fw/fw_config_ospfv2_interface_update.yaml
    intent: Build an OSPFv2 interface update request by entry id.
    request:
      method: PUT
      path: /api/v1/ospfinterface
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        id: "{{ params.id }}"
        val:
          interface: "{{ params.interface }}"
          cost: "{{ params.cost }}"
          priority: "{{ params.priority }}"
          helloInterval: "{{ params.hello_interval }}"
          retransmitInterval: "{{ params.retransmit_interval }}"
          deadInterval: "{{ params.dead_interval }}"
          transmitDelay: "{{ params.transmit_delay }}"
          typeNetwork: "{{ params.type_network }}"
          intAuthMode: "{{ params.int_auth_mode }}"
          bfdEnable: "{{ params.bfd_enable }}"
          detectMultiplier: "{{ params.detect_multiplier }}"
          minRxInterval: "{{ params.min_rx_interval }}"
          minTxInterval: "{{ params.min_tx_interval }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <ospfv2-interface-update-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - Interface update requires an explicit entry id.
        - Live endpoint and session material must come from runner input.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_delete_ospfv2_interface:
    atom_ref: atoms/fw/fw_delete_ospfv2_interface.yaml
    intent: Build an OSPFv2 interface deletion request by entry id.
    request:
      method: DELETE
      path: /api/v1/ospfinterface
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        id: "{{ params.id }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <ospfv2-interface-delete-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - Interface deletion requires an explicit entry id.
        - The runner sends the id as the DELETE query value.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_verify_ospfv2_interface:
    atom_ref: atoms/fw/fw_verify_ospfv2_interface.yaml
    intent: Build an OSPFv2 interface query request.
    request:
      method: GET
      path: /api/v1/ospfinterface
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template: {}
    response:
      success_status:
        - 200
      result_ref: <ospfv2-interface-state-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - GET requests send no JSON body.
        - Live endpoint and session material must come from runner input.
