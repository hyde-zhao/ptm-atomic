    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <policy-route-priority-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - targetsite supports before, after, first, and last.
        - is_ip6=false moves IPv4 policy route priority; is_ip6=true moves IPv6 policy route priority.
        - atomic-ops run can execute this request only when --execute is explicit.
  fw_config_ospfv2_global:
