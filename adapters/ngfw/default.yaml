schema_version: "1.0"
adapter_id: ngfw.default
device_type: fw
profile_family: ngfw
description: Public non-sensitive NGFW API shape profile for external script generators.
operations:
  fw_config_interface:
    atom_ref: atoms/fw/fw_config_interface.yaml
    intent: Build an interface creation request for bvi, subinterface, or bond objects.
    request:
      method: POST
      path: /api/v1/intf
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        id: "{{ params.id }}"
        val: "{{ params.val }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <interface-create-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - BVI and subinterface payloads only support Route mode.
        - Physical interfaces are not created; use fw_update_interface for existing physical interfaces.
        - BVI bridge member ports are optional; when specified they must be Switch mode with pvid equal to the BVI instance and linkType 1 (access), prepared with fw_update_interface before creation.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_update_interface:
    atom_ref: atoms/fw/fw_update_interface.yaml
    intent: Build an interface update request for bvi, subinterface, physical, or bond objects.
    request:
      method: PUT
      path: /api/v1/intf
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        id: "{{ params.id }}"
        val: "{{ params.val }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <interface-update-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        # 注意：notes 各项必须是纯字符串；句中避免「key: value」形态（否则 YAML 会把
        # 整条解析成 dict），冒号后不跟空格或改用「-」连接。
        - >-
          Full-replacement PUT semantics (P2-42) — PUT /api/v1/intf replaces the complete val
          object; fields omitted from val (ip_addresses, desc, level, service, mtus, ...) are
          wiped on the device.
        - >-
          Therefore --interface-enabled / --interface-disabled without --ip-address clears
          existing interface IPs; re-pass --ip-address, or use --keep-ip so the runner looks up
          current device IPs and backfills them before the PUT.
        - >-
          Bond interfaces use val.type=10 with val.bond={id, mode, lb,
          bonded_interfaces=[{name, is_passive, is_long_timeout}]}; --bond-member is an append
          flag and must be repeated per member (a comma-joined string is one member name).
        - Physical and bond interfaces support Route, Switch, Pair, and Monitor modes.
        - BVI and subinterface payloads only support Route mode.
        - Switch-mode ports used as optional BVI bridge members need pvid equal to the BVI instance and linkType 1 (access); the device defaults omitted linkType to 2, which is rejected as a BVI member.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_verify_interface:
    atom_ref: atoms/fw/fw_verify_interface.yaml
    intent: Build an interface query request with optional pagination.
    request:
      method: GET
      path: /api/v1/intf
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      query_params:
        page: "{{ params.page }}"
        size: "{{ params.size }}"
      payload_template: {}
    response:
      success_status:
        - 200
      result_ref: <interface-state-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - GET /api/v1/intf returns all interfaces and sends no JSON body.
        - GET supports optional page and size query parameters; page=N&size=M returns the Nth page of vals while count keeps the total.
  fw_delete_interface:
    atom_ref: atoms/fw/fw_delete_interface.yaml
    intent: Build a single-interface delete request by query id.
    request:
      method: DELETE
      path: /api/v1/intf
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        id: "{{ params.id }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <interface-delete-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - DELETE sends the interface id as ?id=<interface-id> and sends no JSON body.
        - Physical interfaces are not deletable.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_delete_batch_interface:
    atom_ref: atoms/fw/fw_delete_batch_interface.yaml
    intent: Build a batch request that deletes multiple interface entries.
    request:
      method: POST
      path: /api/v1/batch
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        batch:
          - method: DELETE
            resource: /api/v1/intf
            body:
              id:
                - "{{ params.id }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <interface-batch-delete-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - Batch interface deletion is independent from single-interface DELETE /api/v1/intf.
        - Each batch item must be DELETE /api/v1/intf with body.id as a non-empty list.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_config_ip6pool_object:
    atom_ref: atoms/fw/fw_config_ip6pool_object.yaml
    intent: Build an IPv6 address-object configuration request from a validated atom parameter set.
    request:
      method: POST
      path: /api/v1/ip6pool
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        val:
          name: "{{ params.object_name }}"
          desc: "{{ params.object_desc }}"
          type: 4
          ranges: []
          networks:
            - ipaddr: "{{ params.ipaddr }}"
              mask: "{{ params.mask }}"
          exclranges: "{{ params.exclranges }}"
          exclnetworks: "{{ params.exclnetworks }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <ip6pool-object-config-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - IPv6 address-object names are later referenced by policy route source_network or dst_network fields.
        - CIDR input must be split into ipaddr and mask before calling this endpoint.
        - exclranges and exclnetworks are optional; each exclnetworks entry carries ipaddr and mask where an empty mask excludes a single address.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_update_ip6pool_object:
    atom_ref: atoms/fw/fw_update_ip6pool_object.yaml
    intent: Build an IPv6 address-object update request by name.
    request:
      method: PUT
      path: /api/v1/ip6pool
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        id: "{{ params.id }}"
        val:
          name: "{{ params.val.name }}"
          desc: "{{ params.val.desc }}"
          type: 4
          ranges: []
          networks:
            - ipaddr: "{{ params.val.networks[0].ipaddr }}"
              mask: "{{ params.val.networks[0].mask }}"
          exclranges: "{{ params.val.exclranges }}"
          exclnetworks: "{{ params.val.exclnetworks }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <ip6pool-object-update-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - PUT carries top-level id (target name) and a val body mirroring the POST shape.
        - id and val.name must identify the same IPv6 address object to update.
        - exclranges and exclnetworks are optional and mirror the POST shape.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_delete_ip6pool_object:
    atom_ref: atoms/fw/fw_delete_ip6pool_object.yaml
    intent: Build an IPv6 address-object delete request by name.
    request:
      method: DELETE
      path: /api/v1/ip6pool
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template: {}
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <ip6pool-object-delete-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - DELETE carries the object name as a query value (?id=<name>) and sends no JSON body.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_verify_ip6pool_object:
    atom_ref: atoms/fw/fw_verify_ip6pool_object.yaml
    intent: Build an IPv6 address-object query request with pagination and optional type/keyword filters.
    request:
      method: GET
      path: /api/v1/ip6pool
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template: {}
    response:
      success_status:
        - 200
      result_ref: <ip6pool-object-query-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - GET returns all IPv6 address objects in vals; supports page, size, type and keywords query parameters.
        - type filter may repeat as ANY and CUSTOM; GET requests send no JSON body.
        - Each val entry carries name, type, networks, desc, and refcnt fields.
  fw_delete_batch_ip6pool_object:
    atom_ref: atoms/fw/fw_delete_batch_ip6pool_object.yaml
    intent: Build a batch IPv6 address-object delete request.
    request:
      method: POST
      path: /api/v1/batch
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        batch: "{{ params.batch }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <ip6pool-object-batch-delete-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - Batch body contains only DELETE /api/v1/ip6pool items with an id list per item.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_config_object:
    atom_ref: atoms/fw/fw_config_object.yaml
    intent: Build an IPv4 address-object configuration request from a validated atom parameter set.
    request:
      method: POST
      path: /api/v1/ippool
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        val:
          name: "{{ params.object_name }}"
          desc: "{{ params.object_desc }}"
          type: 4
          ranges: []
          networks:
            - ipaddr: "{{ params.ipaddr }}"
              mask: "{{ params.mask }}"
          exclranges: "{{ params.exclranges }}"
          exclnetworks: "{{ params.exclnetworks }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <object-config-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - Address-object names are later referenced by policy route source_network or dst_network fields.
        - CIDR input must be split into ipaddr and mask before calling this endpoint.
        - exclranges and exclnetworks are optional; each exclnetworks entry carries ipaddr and mask where an empty mask excludes a single address.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_update_object:
    atom_ref: atoms/fw/fw_update_object.yaml
    intent: Build an address-object update request by name.
    request:
      method: PUT
      path: /api/v1/ippool
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        id: "{{ params.id }}"
        val:
          name: "{{ params.val.name }}"
          desc: "{{ params.val.desc }}"
          type: 4
          ranges: []
          networks:
            - ipaddr: "{{ params.val.networks[0].ipaddr }}"
              mask: "{{ params.val.networks[0].mask }}"
          exclranges: "{{ params.val.exclranges }}"
          exclnetworks: "{{ params.val.exclnetworks }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <object-update-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - PUT carries top-level id (target name) and a val body mirroring the POST shape.
        - id and val.name must identify the same address object to update.
        - exclranges and exclnetworks are optional and mirror the POST shape.
        - Live endpoint, session material, and credentials must come from runner input.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_delete_object:
    atom_ref: atoms/fw/fw_delete_object.yaml
    intent: Build an address-object delete request by name.
    request:
      method: DELETE
      path: /api/v1/ippool
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template: {}
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <object-delete-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - DELETE uses id as a query value and sends no JSON body.
        - id is the address-object val.name to delete.
        - Live endpoint, session material, and credentials must come from runner input.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_verify_object:
    atom_ref: atoms/fw/fw_verify_object.yaml
    intent: Build an address-object query request with pagination.
    request:
      method: GET
      path: /api/v1/ippool
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template: {}
    response:
      success_status:
        - 200
      result_ref: <object-query-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - GET returns all address objects in vals; supports page and size query parameters.
        - GET requests send no JSON body.
        - Each val entry carries name, type, networks, desc, and refcnt fields.
  fw_delete_batch_object:
    atom_ref: atoms/fw/fw_delete_batch_object.yaml
    intent: Build a batch address-object delete request.
    request:
      method: POST
      path: /api/v1/batch
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        batch: "{{ params.batch }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <object-batch-delete-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - Batch delete is independent from single-object DELETE /api/v1/ippool.
        - Each batch item must be DELETE /api/v1/ippool with body.id as a non-empty list.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_config_policy_route:
    atom_ref: atoms/fw/fw_config_policy_route.yaml
    intent: Build an IPv4 or IPv6 policy-route create request from a validated atom parameter set.
    request:
      method: POST
      path: /api/v1/policyroute
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        id: 0
        val:
          type: "{{ params.type }}"
          in_interface: "{{ params.in_interface }}"
          source_network: "{{ params.source_network }}"
          source_network_is_group: "{{ params.source_network_is_group }}"
          dst_network: "{{ params.dst_network }}"
          dst_network_is_group: "{{ params.dst_network_is_group }}"
          service: "{{ params.service }}"
          service_is_group: "{{ params.service_is_group }}"
          active: "{{ params.active }}"
          applist: "{{ params.applist }}"
          app_tag_name: "{{ params.app_tag_name }}"
          forwarding_paths:
            - next_hop_ip: "{{ params.next_hop_ip }}"
              outgoing_interface: "{{ params.outgoing_interface }}"
              weight: "{{ params.weight }}"
              health_check: "{{ params.health_check }}"
          time_obj: "{{ params.time_obj }}"
          action: "{{ params.action }}"
          config_source: "{{ params.config_source }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <policy-route-config-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - Adapter profiles describe endpoint and payload shape without runtime values.
        - type must be ipv4 or ipv6; forwarding_paths entries require exactly one of next_hop_ip (gateway mode) or outgoing_interface (outgoing-interface mode).
        - 'The two forwarding modes are mutually exclusive: providing both (or neither) is rejected as RUNNER_VALIDATION_FAILED before any HTTP request. Device models may support only one mode — DAS-TGFW-290 supports gateway mode only and rejects outgoing-interface mode with ePolicyRouteOutIfModeError.'
        - next_hop_ip may be empty for outgoing-interface forwarding mode, but must match the selected IP version when provided.
        - source_network and dst_network are address object names unless the matching is_group flag is true.
        - applist and app_tag_name are optional application match criteria; omit to match no application.
        - 'health_check is an empty object unless ip_link_name is provided, then it becomes {type: iplink, name: <ip_link_name>}.'
        - Live endpoint, session material, and credentials must come from runner input.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_update_policy_route:
    atom_ref: atoms/fw/fw_update_policy_route.yaml
    intent: Build an IPv4 or IPv6 policy-route update request from a validated atom parameter set.
    request:
      method: PUT
      path: /api/v1/policyroute
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        id: "{{ params.id }}"
        val:
          id: "{{ params.id }}"
          type: "{{ params.type }}"
          in_interface: "{{ params.in_interface }}"
          source_network: "{{ params.source_network }}"
          source_network_is_group: "{{ params.source_network_is_group }}"
          dst_network: "{{ params.dst_network }}"
          dst_network_is_group: "{{ params.dst_network_is_group }}"
          service: "{{ params.service }}"
          service_is_group: "{{ params.service_is_group }}"
          active: "{{ params.active }}"
          applist: "{{ params.applist }}"
          app_tag_name: "{{ params.app_tag_name }}"
          forwarding_paths:
            - next_hop_ip: "{{ params.next_hop_ip }}"
              outgoing_interface: "{{ params.outgoing_interface }}"
              weight: "{{ params.weight }}"
              health_check: "{{ params.health_check }}"
          time_obj: "{{ params.time_obj }}"
          action: "{{ params.action }}"
          config_source: "{{ params.config_source }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <policy-route-update-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - PUT updates an existing policy-route id on /api/v1/policyroute.
        - type must be ipv4 or ipv6; forwarding_paths entries require exactly one of next_hop_ip (gateway mode) or outgoing_interface (outgoing-interface mode).
        - 'The two forwarding modes are mutually exclusive: providing both (or neither) is rejected as RUNNER_VALIDATION_FAILED before any HTTP request. Device models may support only one mode — DAS-TGFW-290 supports gateway mode only and rejects outgoing-interface mode with ePolicyRouteOutIfModeError.'
        - next_hop_ip may be empty for outgoing-interface forwarding mode, but must match the selected IP version when provided.
        - applist and app_tag_name are optional application match criteria; omit to match no application.
        - 'health_check is an empty object unless ip_link_name is provided, then it becomes {type: iplink, name: <ip_link_name>}.'
        - Live endpoint, session material, and credentials must come from runner input.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_delete_policy_route:
    atom_ref: atoms/fw/fw_delete_policy_route.yaml
    intent: Build a policy-route delete request by id and address family.
    request:
      method: DELETE
      path: /api/v1/policyroute
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template: {}
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <policy-route-delete-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - DELETE uses id and is_ip6 as query values and sends no JSON body.
        - is_ip6=false deletes an IPv4 policy route id; is_ip6=true deletes an IPv6 policy route id.
        - Live endpoint, session material, and credentials must come from runner input.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_delete_batch_policy_route:
    atom_ref: atoms/fw/fw_delete_batch_policy_route.yaml
    intent: Build a batch policy-route delete request by id and address family.
    request:
      method: POST
      path: /api/v1/batch
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        batch: "{{ params.batch }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <policy-route-batch-delete-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - Batch delete is independent from single-route DELETE /api/v1/policyroute and uses the /api/v1/batch endpoint.
        - Each batch item must be DELETE /api/v1/policyroute with body.id and body.is_ip6 as non-empty string lists.
        - is_ip6=false deletes an IPv4 policy route; is_ip6=true deletes an IPv6 policy route.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_verify_policy_route:
    atom_ref: atoms/fw/fw_verify_policy_route.yaml
    intent: Build a policy-route query request for IPv4 or IPv6 routes.
    request:
      method: GET
      path: /api/v1/policyroute
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template: {}
    response:
      success_status:
        - 200
      result_ref: <policy-route-query-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - Query values are page, size, and is_ip6.
        - GET requests send no JSON body.
        - is_ip6=false queries IPv4 policy routes; is_ip6=true queries IPv6 policy routes.
  fw_reset_policy_route_hitcount:
    atom_ref: atoms/fw/fw_reset_policy_route_hitcount.yaml
    intent: Build a policy-route hit-count reset request by id and address family.
    request:
      method: DELETE
      path: /api/v1/policyroutehitcount
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template: {}
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <policy-route-hitcount-reset-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - DELETE uses id and is_ip6 as query values and sends no JSON body.
        - is_ip6=false resets an IPv4 policy-route hit count; is_ip6=true resets an IPv6 policy-route hit count.
        - Reset is irreversible; historical hit-count values cannot be restored.
        - Live endpoint, session material, and credentials must come from runner input.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_verify_policy_route_hitcount:
    atom_ref: atoms/fw/fw_verify_policy_route_hitcount.yaml
    intent: Build a policy-route hit-count query request for IPv4 or IPv6 routes.
    request:
      method: GET
      path: /api/v1/policyroute
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template: {}
    response:
      success_status:
