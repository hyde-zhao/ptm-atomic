  fw_config_export_file:
    atom_ref: atoms/fw/fw_config_export_file.yaml
    intent: Build a configuration export workflow that starts a download task, polls it, and downloads the file.
    request:
      method: POST
      path: /api/v1/downloadfilehandle
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        val:
          dataId: "{{ params.data_id }}"
          moduletype: "{{ params.moduletype }}"
          filetype: "{{ params.filetype }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <export-file-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - The runner polls GET /api/v1/downloadfilehandle?id=<downloadtaskid> until vals[0].filename is ready.
        - The file is then downloaded from GET /api/v1/downloadfile?id=<urlencoded filename> as a binary stream.
        - moduletype is an open string; systemconfig is one value and other module types pass through unchanged.
        - The exported file may contain sensitive configuration; the runner writes bytes to output_path and never parses contents.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_config_import_file:
    atom_ref: atoms/fw/fw_config_import_file.yaml
    intent: Build a configuration import workflow that uploads a file, starts an import task, polls it, and confirms.
    request:
      method: POST
      path: /api/v1/uploadfile
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        filename: "{{ params.input_path }}"
        file_name: "{{ params.file_name }}"
        chunkornot: "no"
        filetype: "{{ params.filetype }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <import-file-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - Step 1 uploads the file as multipart form-data to /api/v1/uploadfile.
        - Step 2 POSTs /api/v1/uploadfilehandle with val.moduletype, val.filetype, val.operationtype, val.chunkornot and returns uploadtaskid.
        - Step 3 polls GET /api/v1/uploadfilehandle?id=<uploadtaskid> until msg equals success.
        - Step 4 GETs /api/v1/importfile to confirm vals[0].havefile is true.
        - moduletype is an open string; other module types pass through unchanged.
        - A reboot via fw_config_reboot is required after import for the configuration to take effect.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_config_reboot:
    atom_ref: atoms/fw/fw_config_reboot.yaml
    intent: Build a device reboot request that invalidates the current session.
    request:
      method: GET
      path: /api/v1/reboot
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template: {}
    response:
      success_status:
        - 200
