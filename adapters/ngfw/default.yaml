      notes:
        - PUT /api/v1/neighbor/scan/trigger handles both immediate scan and periodic scan.
        - is_periodic selects periodic mode; period_in_seconds is in seconds (UI shows minutes).
        - start_at_once true triggers a scan immediately once.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_config_garp_rate_limit:
