  fw_verify_abf_policy:
    atom_ref: atoms/fw/fw_verify_abf_policy.yaml
    intent: Verify a policy route is in effect by querying the VPP ABF policy table over SSH or Telnet (vppctl show abf policy).
    transport: ssh
    shell:
      command_template: "/opt/dbappsecurity/bin/vppctl show abf policy"
      success_pattern: "add_counts"
      prompt_timeout_ms: 30000
      privilege_level: privileged
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - Read-only observation; the command writes nothing to the device.
        - Requires root privileges; the runner resolves the credential from the FW_SSH_* environment variable by default.
        - The table carries no {{param}} placeholder; the runner matches the policy-id in the parsed output instead of templating the command.
        - "The lookup id is the policy route id for ipv4 and 10000 + the route id for ipv6 (measured 2026-09-21: policy-id 10001 belongs to route id 1 of the ipv6 family)."
        - "An absent policy-id raises STATE_MISMATCH: the device omits the policy from the ABF table while the time object is outside its effective window."
        - Connection inputs come from runner input and the session file; the profile carries no runtime values.
        - Session output is captured into diag_snapshot_ref and never written to the repo.
        - ptm-atomic run can execute this command only when --execute is explicit.
