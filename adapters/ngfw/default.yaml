  fw_config_bridge_domain_mac_age:
    atom_ref: atoms/fw/fw_config_bridge_domain_mac_age.yaml
    intent: Set the VPP bridge-domain MAC ageing time over SSH or Telnet (vppctl set bridge-domain mac-age).
    transport: ssh
    shell:
      command_template: "/opt/dbappsecurity/bin/vppctl set bridge-domain mac-age {{bridge_domain_id}} {{age_minutes}}"
      success_pattern: "\\S+"
      prompt_timeout_ms: 30000
      privilege_level: privileged
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - Mutating command; the runner asserts exit_code 0 and no error text on stderr (vppctl reports parameter errors on stderr, e.g. 'expecting ageing time in minutes').
        - The runner re-reads the domain with 'vppctl show bridge-domain <id>' after the set and reports the actual Age(min) as age_minutes_actual.
        - Requires root privileges; the runner resolves the credential from the FW_SSH_* environment variable by default.
        - The runner MUST shell-escape every {{param}} placeholder; this template has two placeholders {{bridge_domain_id}} and {{age_minutes}}.
        - Connection inputs come from runner input and the session file; the profile carries no runtime values.
        - Session output is captured into diag_snapshot_ref and never written to the repo.
        - ptm-atomic run can execute this command only when --execute is explicit.
