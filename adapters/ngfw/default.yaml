  fw_verify_security_zone_vpp:
    atom_ref: atoms/fw/fw_verify_security_zone_vpp.yaml
    intent: Verify NGFW security-zone data-plane (VPP) state via SSH vppctl.
    transport: ssh
    shell:
      command_template: "vppctl show zone{{#if zone_name}} name {{zone_name}}{{/if}}"
      success_pattern: ".*"
      prompt_timeout_ms: 30000
      privilege_level: root
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - Requires SSH access to the NGFW device; parses vppctl show zone output for zone/interface consistency.
  fw_verify_neighbor_probe:
    atom_ref: atoms/fw/fw_verify_neighbor_probe.yaml
    intent: Query the VPP IP neighbor table to verify ARP neighbor phase and aging probes.
    transport: ssh
    shell:
      command_template: "/opt/dbappsecurity/bin/vppctl show ip neighbor"
      success_pattern: "Time\\s+IP"
      prompt_timeout_ms: 30000
      privilege_level: user
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - Read-only observation; the command writes nothing to the device.
        - 'Output columns: Time, IP, Flags, Ethernet, Interface, Phase, Probes (x/3), NextProbe(S), Age(S).'
        - Phase (alive/probing/dead) and Probes (attempt/3) directly support SR-47077(2) aging-probe assertions.
        - The runner MUST shell-escape every {{param}} placeholder; this template has no placeholders.
        - Session output is captured into diag_snapshot_ref and never written to the repo.
        - ptm-atomic run can execute this command only when --execute is explicit.
        - The runner selects SSH (paramiko) or Telnet (telnetlib) based on the transport parameter; the profile's transport field is the default.
  fw_config_arp_scan:
    atom_ref: atoms/fw/fw_config_arp_scan.yaml
    intent: Build an ARP scan interface and CIDR nets configuration request.
    request:
      method: PUT
      path: /api/v1/neighbor/scan/intf
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      payload_template:
        id: neighbor_scan_intf
        val:
          intfs: "{{ params.val.intfs }}"
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <arp-scan-config-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - PUT /api/v1/neighbor/scan/intf configures per-interface ARP scan (enable + CIDR nets).
        - Each intfs item is {name, enable, nets[]}; nets values are CIDR strings.
        - GET /api/v1/neighbor/scan/intf returns the same structure under vals for read-back.
        - ptm-atomic run can execute this request only when --execute is explicit.
  fw_trigger_arp_scan:
    atom_ref: atoms/fw/fw_trigger_arp_scan.yaml
    intent: Build an ARP scan trigger or periodic schedule request.
    request:
      method: PUT
      path: /api/v1/neighbor/scan/trigger
      content_type: application/json
      auth:
