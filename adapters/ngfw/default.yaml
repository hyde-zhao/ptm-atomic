    request:
      method: DELETE
      path: /api/v1/natsnat
      content_type: application/json
      auth:
        mode: external_session_ref
        header_name: Authorization
        value_ref: <session-ref>
      query_params:
        id: "{{ params.id }}"
      payload_template: {}
    response:
      success_status:
        - 200
        - 201
        - 202
      result_ref: <nat-snat-delete-result-ref>
