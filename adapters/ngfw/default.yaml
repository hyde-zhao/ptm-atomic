        - 4over6 endpoints are IPv6; 6over4 endpoints are IPv4.
        - Creating an IP tunnel also brings up a tunnel interface on /api/v1/intf; configure it with fw_update_interface using interface-kind tunnel.
        - ptm-atomic run can execute this request only when --execute is explicit.
