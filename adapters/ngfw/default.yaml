        - 202
      result_ref: <reboot-result-ref>
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - A 2xx response means the reboot has been initiated; the device tears down the session and becomes unreachable.
        - The runner never issues follow-up requests after a successful reboot to avoid mistaking the expected disconnect for a failure.
        - A fresh fw_login_web_management session is required before any further run command.
