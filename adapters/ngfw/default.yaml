    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - DELETE uses the provided policy-route id in the JSON request body.
        - Live endpoint, session material, and credentials must come from runner input.
        - atomic-ops run can execute this request only when --execute is explicit.
  fw_verify_policy_route:
    atom_ref: atoms/fw/fw_verify_policy_route.yaml
    intent: Build a policy-route query request for IPv4 or IPv6 routes.
    request:
