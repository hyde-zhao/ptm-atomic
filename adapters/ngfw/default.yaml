    atom_ref: atoms/fw/fw_check_bvi_interface_config.yaml
    intent: Query the BVI interface configuration from etcd over SSH or Telnet.
    transport: ssh
    shell:
      command_template: "etcdctl get --print-value-only /vnf-agent/vpp1/config/vpp/v2/interfaces/bvi{{id}}"
      success_pattern: "\\S+"
      prompt_timeout_ms: 30000
      privilege_level: user
    safety:
      stores_sensitive_data: false
      runner_required: true
      notes:
        - Read-only observation; the command writes nothing to the device.
        - Connection inputs come from runner input and the session file; the profile carries no runtime values.
        - The runner MUST shell-escape every {{param}} placeholder; this template has one placeholder {{id}}.
        - Session output is captured into diag_snapshot_ref and never written to the repo.
        - ptm-atomic run can execute this command only when --execute is explicit.
        - The runner selects SSH (paramiko) or Telnet (telnetlib) based on the transport parameter; the profile's transport field is the default.
  fw_check_bridge_domain:
    atom_ref: atoms/fw/fw_check_bridge_domain.yaml
    intent: Query the VPP bridge-domain table over SSH or Telnet.
    transport: ssh
