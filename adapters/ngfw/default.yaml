      stores_sensitive_data: false
      runner_required: true
      notes:
        - DELETE /api/v1/natsnat carries the rule id as ?id=<id> and sends no JSON body (2026-09-21 真机实测订正).
        - This differs from fw_delete_iptun and fw_delete_interface, which pass id as a query value; do not mirror their transport here.
